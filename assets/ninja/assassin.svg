<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <linearGradient id="assassin_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#240812"/><stop offset="50%" stop-color="#4a1020"/><stop offset="100%" stop-color="#14060b"/>
    </linearGradient>
    <linearGradient id="assassin_vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090714" stop-opacity="0.15"/>
      <stop offset="58%" stop-color="#090714" stop-opacity="0.05"/>
      <stop offset="86%" stop-color="#0a0816" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#090713" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="assassin_glow" cx="50%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#ff546e" stop-opacity="0.48"/>
      <stop offset="60%" stop-color="#ff546e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff546e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="assassin_pat" width="32" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 16 A16 16 0 0 1 32 16 M-16 16 A16 16 0 0 1 16 16 M16 16 A16 16 0 0 1 48 16" fill="none" stroke="#ff546e" stroke-opacity="0.08" stroke-width="1"/>
      <path d="M4 16 A12 12 0 0 1 28 16 M8 16 A8 8 0 0 1 24 16" fill="none" stroke="#ff546e" stroke-opacity="0.06" stroke-width="0.9"/>
    </pattern>
    <filter id="assassin_blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="ass_blade" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#ffd1dc"/><stop offset="100%" stop-color="#ff4d6d"/>
  </linearGradient>
  </defs>
  <rect width="240" height="320" fill="url(#assassin_bg)"/>
  <rect width="240" height="320" fill="url(#assassin_pat)"/>
  <rect width="240" height="320" fill="url(#assassin_glow)"/>
  
  <!-- Huge Crimson Crescent Moon -->
  <circle cx="126" cy="96" r="64" fill="#d92944" opacity="0.88"/>
  <circle cx="148" cy="84" r="56" fill="#320b17"/>
  <!-- Dramatic diagonal katana slash arc -->
  <path d="M16 244 Q118 176 232 46" fill="none" stroke="#ff6b81" stroke-width="10" stroke-linecap="round" opacity="0.28" filter="url(#assassin_blur)"/>
  <path d="M18 242 Q120 174 230 48" fill="none" stroke="url(#ass_blade)" stroke-width="4" stroke-linecap="round"/>
  
  <g fill="#ff7a90" opacity="0.82">
    <ellipse cx="38" cy="54" rx="5" ry="2.6" transform="rotate(-32 38 54)"/>
    <ellipse cx="196" cy="74" rx="5.5" ry="2.5" transform="rotate(28 196 74)"/>
    <ellipse cx="52" cy="144" rx="4.5" ry="2.2" transform="rotate(-18 52 144)"/>
    <ellipse cx="204" cy="168" rx="5" ry="2.4" transform="rotate(42 204 168)"/>
    <ellipse cx="82" cy="34" rx="3.8" ry="1.8" transform="rotate(15 82 34)"/>
    <ellipse cx="164" cy="212" rx="4.5" ry="2.2" transform="rotate(-40 164 212)"/>
  </g>
  <!-- Blindfolded Shinobi -->
  <g>
    <!-- Flowing crimson blindfold ribbons -->
    <path d="M150 124 Q188 112 224 128 Q196 134 156 136 Z" fill="#e63956"/>
    <path d="M148 130 Q186 138 214 156 Q184 152 150 139 Z" fill="#b81d38"/>
    <!-- Shoulders & armor -->
    <path d="M36 280 Q54 186 116 172 Q178 184 202 280 Z" fill="#120810" stroke="#ff5c77" stroke-width="1.6"/>
    <path d="M70 186 L120 242 L166 184" fill="none" stroke="#8f1930" stroke-width="3.5"/>
    <!-- Head -->
    <path d="M80 144 Q80 86 120 84 Q160 86 160 144 Q158 172 120 176 Q82 172 80 144 Z" fill="#160a14" stroke="#ff6b81" stroke-width="1.5"/>
    <!-- Crimson Silk Blindfold -->
    <path d="M78 116 Q120 124 162 114 L162 134 Q120 142 78 134 Z" fill="#d92944" stroke="#ff9aad" stroke-width="1.2"/>
    <!-- Lower face wrap -->
    <path d="M82 142 Q120 154 158 142 L154 170 Q120 180 86 170 Z" fill="#0d060b"/>
    <!-- Gleaming Katana held diagonally -->
    <path d="M38 232 L198 78 L206 84 L48 242 Z" fill="url(#ass_blade)" stroke="#fff" stroke-width="0.8"/>
    <!-- Tsuba (hilt guard) & tsuka -->
    <ellipse cx="46" cy="234" rx="14" ry="5" transform="rotate(-44 46 234)" fill="#f6c945" stroke="#3b1219" stroke-width="1.5"/>
    <path d="M40 240 L16 264 L24 272 L48 248 Z" fill="#2a0c16" stroke="#f6c945" stroke-width="1.4"/>
  </g>
  <rect width="240" height="320" fill="url(#assassin_vig)"/>
  <!-- Subtle gold-leaf dust -->
  <g fill="#f6d887" opacity="0.55">
    <circle cx="26" cy="34" r="1.3"/><circle cx="212" cy="48" r="1.6"/><circle cx="195" cy="24" r="1"/>
    <circle cx="44" cy="96" r="1.1"/><circle cx="218" cy="142" r="1.2"/><circle cx="18" cy="176" r="1"/>
  </g>
</svg>