<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="br_sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0b22"/>
      <stop offset="48%" stop-color="#241942"/>
      <stop offset="100%" stop-color="#3b1630"/>
    </linearGradient>
    <radialGradient id="br_moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="55%" stop-color="#f7cf79" stop-opacity="0.92"/>
      <stop offset="82%" stop-color="#ff6b81" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff6b81" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="br_fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c0918" stop-opacity="0.82"/>
      <stop offset="45%" stop-color="#0c0918" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0c0918" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="br_blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="720" height="320" fill="url(#br_sky)"/>
  <!-- Subtle stars -->
  <g fill="#fff2cc" opacity="0.65">
    <circle cx="54" cy="42" r="1.4"/><circle cx="118" cy="28" r="1.8"/><circle cx="192" cy="56" r="1.2"/>
    <circle cx="284" cy="34" r="1.5"/><circle cx="614" cy="46" r="1.6"/><circle cx="672" cy="26" r="1.2"/>
    <circle cx="566" cy="24" r="1.3"/><circle cx="88" cy="96" r="1.1"/><circle cx="648" cy="84" r="1.4"/>
  </g>
  <!-- Enormous Glowing Full Moon -->
  <circle cx="496" cy="134" r="144" fill="url(#br_moon)"/>
  <circle cx="496" cy="134" r="88" fill="#fff1c4" opacity="0.94"/>
  <!-- Swirling midnight cloud bands crossing the moon -->
  <path d="M290 144 Q392 126 488 142 Q568 154 720 132 L720 166 Q568 182 464 166 Q372 152 290 166 Z" fill="#1b1433" opacity="0.58"/>
  <path d="M0 198 Q144 176 286 196 Q442 216 610 188 L720 182 L720 242 L0 242 Z" fill="#17112b" opacity="0.72"/>
  <!-- Distant Mountain Ridge -->
  <path d="M0 246 L94 172 L182 222 L288 148 L392 224 L536 168 L646 218 L720 186 L720 320 L0 320 Z" fill="#140e24"/>
  <!-- Japanese Castle Pagoda Silhouette in Center-Right -->
  <g fill="#0e091b" stroke="#ff7a90" stroke-opacity="0.35" stroke-width="1">
    <rect x="466" y="138" width="60" height="122"/>
    <path d="M442 156 Q496 138 550 156 L538 142 L454 142 Z"/>
    <path d="M452 128 Q496 112 540 128 L530 116 L462 116 Z"/>
    <path d="M464 102 Q496 86 528 102 L496 74 Z"/>
    <line x1="496" y1="62" x2="496" y2="76" stroke="#f6c945" stroke-width="2.5"/>
    <!-- Glowing castle windows -->
    <rect x="488" y="166" width="16" height="10" rx="1" fill="#ffd166" opacity="0.85"/>
    <rect x="478" y="192" width="12" height="8" rx="1" fill="#ff9e44" opacity="0.7"/>
    <rect x="502" y="192" width="12" height="8" rx="1" fill="#ff9e44" opacity="0.7"/>
  </g>
  <!-- Vermilion Torii Gate on Left-Mid Hill -->
  <g transform="translate(278, 174)" opacity="0.9">
    <path d="M-8 10 Q38 -2 84 10 L80 18 Q38 10 -4 18 Z" fill="#d92944" stroke="#f6c945" stroke-width="0.9"/>
    <rect x="6" y="24" width="64" height="6" fill="#b81d38"/>
    <rect x="14" y="14" width="8" height="66" fill="#b81d38"/>
    <rect x="54" y="14" width="8" height="66" fill="#b81d38"/>
  </g>
  <!-- Foreground Curved Castle Roof Eaves (Left & Right) -->
  <path d="M-10 258 Q138 232 276 286 L276 320 L-10 320 Z" fill="#090714" stroke="#ff6b81" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M430 284 Q576 226 730 252 L730 320 L430 320 Z" fill="#090714" stroke="#5fb2ff" stroke-opacity="0.45" stroke-width="1.5"/>
  <!-- Rival Ninja 1 (Crimson Lotus Ninja crouched on right-center eave) -->
  <g transform="translate(556, 176)">
    <path d="M36 22 Q68 12 88 26 Q66 30 38 30 Z" fill="#ff546e"/>
    <path d="M6 74 Q16 32 32 28 Q50 32 54 74 Z" fill="#0b0817" stroke="#ff6b81" stroke-width="1.4"/>
    <circle cx="32" cy="20" r="11" fill="#0b0817" stroke="#ff6b81" stroke-width="1.3"/>
    <line x1="22" y1="42" x2="-16" y2="20" stroke="#fff0f3" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <!-- Rival Ninja 2 (Silver Crane Ninja poised on mid-left roof) -->
  <g transform="translate(362, 198)">
    <path d="M18 18 Q-12 6 -28 18 Q-6 24 16 24 Z" fill="#5fb2ff"/>
    <path d="M4 66 Q12 30 26 26 Q42 30 48 66 Z" fill="#0b0817" stroke="#5fb2ff" stroke-width="1.4"/>
    <circle cx="26" cy="18" r="10" fill="#0b0817" stroke="#5fb2ff" stroke-width="1.3"/>
    <line x1="36" y1="38" x2="72" y2="18" stroke="#e6f5ff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- Drifting Sakura Petals across the night -->
  <g fill="#ff8fa3" opacity="0.85">
    <ellipse cx="142" cy="76" rx="6" ry="2.8" transform="rotate(-24 142 76)"/>
    <ellipse cx="238" cy="112" rx="5.5" ry="2.4" transform="rotate(18 238 112)"/>
    <ellipse cx="384" cy="68" rx="6.5" ry="2.8" transform="rotate(-35 384 68)"/>
    <ellipse cx="448" cy="146" rx="5" ry="2.3" transform="rotate(28 448 146)"/>
    <ellipse cx="598" cy="118" rx="6" ry="2.6" transform="rotate(-18 598 118)"/>
    <ellipse cx="662" cy="176" rx="5.5" ry="2.4" transform="rotate(32 662 176)"/>
    <ellipse cx="312" cy="248" rx="5" ry="2.3" transform="rotate(-28 312 248)"/>
  </g>
  <!-- Left contrast scrim for crisp mobile headline typography -->
  <rect width="720" height="320" fill="url(#br_fade)"/>
</svg>