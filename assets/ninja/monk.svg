<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <linearGradient id="monk_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1306"/><stop offset="52%" stop-color="#54260a"/><stop offset="100%" stop-color="#1a0b04"/>
    </linearGradient>
    <linearGradient id="monk_vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090714" stop-opacity="0.15"/>
      <stop offset="58%" stop-color="#090714" stop-opacity="0.05"/>
      <stop offset="86%" stop-color="#0a0816" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#090713" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="monk_glow" cx="50%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#ff9f5a" stop-opacity="0.48"/>
      <stop offset="60%" stop-color="#ff9f5a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff9f5a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="monk_pat" width="32" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 16 A16 16 0 0 1 32 16 M-16 16 A16 16 0 0 1 16 16 M16 16 A16 16 0 0 1 48 16" fill="none" stroke="#ff9f5a" stroke-opacity="0.08" stroke-width="1"/>
      <path d="M4 16 A12 12 0 0 1 28 16 M8 16 A8 8 0 0 1 24 16" fill="none" stroke="#ff9f5a" stroke-opacity="0.06" stroke-width="0.9"/>
    </pattern>
    <filter id="monk_blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="mnk_aura" cx="50%" cy="46%" r="48%">
    <stop offset="0%" stop-color="#fff5cc"/><stop offset="50%" stop-color="#ff9f43" stop-opacity="0.7"/><stop offset="100%" stop-color="#ff6b2b" stop-opacity="0"/>
  </radialGradient>
  </defs>
  <rect width="240" height="320" fill="url(#monk_bg)"/>
  <rect width="240" height="320" fill="url(#monk_pat)"/>
  <rect width="240" height="320" fill="url(#monk_glow)"/>
  
  <!-- Swirling Golden Spirit Counter-Barrier -->
  <circle cx="120" cy="148" r="88" fill="url(#mnk_aura)" opacity="0.45"/>
  <circle cx="120" cy="148" r="76" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="14 6" opacity="0.85"/>
  <circle cx="120" cy="148" r="64" fill="none" stroke="#ff9f43" stroke-width="2" opacity="0.65"/>
  <!-- Deflected Enemy Blade shattering on right barrier -->
  <path d="M236 62 L182 118 L188 125 L242 74 Z" fill="#ff5c77" stroke="#fff" stroke-width="1"/>
  <!-- Spark burst at impact point -->
  <g stroke="#fff3b0" stroke-width="2.5" stroke-linecap="round">
    <line x1="180" y1="118" x2="162" y2="94"/><line x1="180" y1="118" x2="206" y2="108"/>
    <line x1="180" y1="118" x2="196" y2="142"/><line x1="180" y1="118" x2="160" y2="132"/>
  </g>
  <circle cx="180" cy="118" r="10" fill="#fff7d6"/>
  <!-- Fierce Warrior Monk Ninja -->
  <g>
    <!-- Saffron & dark indigo robes -->
    <path d="M48 276 Q64 184 120 176 Q176 184 192 276 Z" fill="#1f120b" stroke="#ff9f5a" stroke-width="1.8"/>
    <path d="M74 182 L144 268 L174 268 L104 178 Z" fill="#d96b1f" opacity="0.9"/>
    <!-- Head -->
    <circle cx="120" cy="126" r="32" fill="#29170d" stroke="#ffd166" stroke-width="1.6"/>
    <!-- Forehead monastic band -->
    <path d="M89 116 Q120 108 151 116" fill="none" stroke="#ffd166" stroke-width="4"/>
    <circle cx="120" cy="111" r="5" fill="#fff2b2"/>
    <!-- Determined glowing eyes -->
    <path d="M101 126 L114 129 L103 132 Z" fill="#ffe082"/>
    <path d="M139 126 L126 129 L137 132 Z" fill="#ffe082"/>
    <!-- Giant Glowing Prayer Beads (Juzu) -->
    <g fill="#f6c453" stroke="#5c2808" stroke-width="1.4">
      <circle cx="84" cy="170" r="8"/><circle cx="98" cy="186" r="8.5"/><circle cx="120" cy="194" r="9.5"/>
      <circle cx="142" cy="186" r="8.5"/><circle cx="156" cy="170" r="8"/>
    </g>
    <!-- Clasped mudra hands glowing -->
    <path d="M108 216 L120 196 L132 216 L120 232 Z" fill="#fff0b8" stroke="#ff9f43" stroke-width="2"/>
  </g>
  <rect width="240" height="320" fill="url(#monk_vig)"/>
  <!-- Subtle gold-leaf dust -->
  <g fill="#f6d887" opacity="0.55">
    <circle cx="26" cy="34" r="1.3"/><circle cx="212" cy="48" r="1.6"/><circle cx="195" cy="24" r="1"/>
    <circle cx="44" cy="96" r="1.1"/><circle cx="218" cy="142" r="1.2"/><circle cx="18" cy="176" r="1"/>
  </g>
</svg>