<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <linearGradient id="spy_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#091a32"/><stop offset="55%" stop-color="#133054"/><stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="spy_vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090714" stop-opacity="0.15"/>
      <stop offset="58%" stop-color="#090714" stop-opacity="0.05"/>
      <stop offset="86%" stop-color="#0a0816" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#090713" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="spy_glow" cx="50%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#5fb2ff" stop-opacity="0.48"/>
      <stop offset="60%" stop-color="#5fb2ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5fb2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="spy_pat" width="32" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 16 A16 16 0 0 1 32 16 M-16 16 A16 16 0 0 1 16 16 M16 16 A16 16 0 0 1 48 16" fill="none" stroke="#5fb2ff" stroke-opacity="0.08" stroke-width="1"/>
      <path d="M4 16 A12 12 0 0 1 28 16 M8 16 A8 8 0 0 1 24 16" fill="none" stroke="#5fb2ff" stroke-opacity="0.06" stroke-width="0.9"/>
    </pattern>
    <filter id="spy_blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="spy_moon" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#e3f4ff"/><stop offset="65%" stop-color="#7bc4ff" stop-opacity="0.85"/><stop offset="100%" stop-color="#5fb2ff" stop-opacity="0"/>
  </radialGradient>
  </defs>
  <rect width="240" height="320" fill="url(#spy_bg)"/>
  <rect width="240" height="320" fill="url(#spy_pat)"/>
  <rect width="240" height="320" fill="url(#spy_glow)"/>
  
  <!-- Moon -->
  <circle cx="172" cy="76" r="56" fill="url(#spy_moon)" opacity="0.45"/>
  <circle cx="172" cy="76" r="36" fill="#d8f0ff" opacity="0.92"/>
  <!-- Shoji lattice shadows on right -->
  <g stroke="#5fb2ff" stroke-opacity="0.18" stroke-width="2">
    <line x1="156" y1="0" x2="156" y2="260"/><line x1="196" y1="0" x2="196" y2="260"/>
    <line x1="140" y1="45" x2="240" y2="45"/><line x1="140" y1="105" x2="240" y2="105"/><line x1="140" y1="165" x2="240" y2="165"/>
  </g>
  <!-- Bamboo stalks -->
  <g fill="#0c233d" stroke="#2c6394" stroke-width="1">
    <rect x="18" y="0" width="9" height="320" rx="2"/>
    <rect x="40" y="0" width="6" height="320" rx="2"/>
    <rect x="206" y="0" width="11" height="320" rx="2"/>
    <path d="M27 88 Q54 78 68 85 Q52 94 27 92 Z" fill="#173e66"/>
    <path d="M27 148 Q56 134 74 142 Q50 156 27 152 Z" fill="#173e66"/>
    <path d="M206 118 Q178 106 162 114 Q182 126 206 122 Z" fill="#173e66"/>
  </g>
  
  <g fill="#1c4a78" opacity="0.35">
    <path d="M-10 175 Q30 155 68 168 Q95 152 135 166 Q165 158 200 170 L250 170 L250 205 L-10 205 Z"/>
    <path d="M-10 218 Q48 196 98 212 Q146 194 205 210 Q228 205 250 212 L250 250 L-10 250 Z"/>
  </g>
  <!-- Hooded Spy Shinobi -->
  <g>
    <!-- Cloak shoulders -->
    <path d="M36 275 Q52 192 92 174 L148 174 Q188 192 204 275 Z" fill="#0c1528" stroke="#4796e6" stroke-width="1.6"/>
    <path d="M72 184 L120 226 L168 184" fill="none" stroke="#2a588a" stroke-width="3"/>
    <!-- Scarf collar -->
    <path d="M78 164 Q120 186 162 164 L166 196 Q120 212 74 196 Z" fill="#132542" stroke="#5fb2ff" stroke-width="1.4"/>
    <!-- Head & Cowl -->
    <path d="M74 150 Q74 86 120 82 Q166 86 166 150 Q164 176 120 182 Q76 176 74 150 Z" fill="#0d172c" stroke="#5fb2ff" stroke-width="1.6"/>
    <!-- Face opening -->
    <path d="M88 124 Q120 114 152 124 Q150 144 120 146 Q90 144 88 124 Z" fill="#1a2c4a"/>
    <!-- Glowing keen eyes -->
    <path d="M96 131 Q106 126 114 132 Q106 136 96 131 Z" fill="#7be0ff"/>
    <path d="M144 131 Q134 126 126 132 Q134 136 144 131 Z" fill="#7be0ff"/>
    <circle cx="105" cy="131" r="2.2" fill="#fff"/>
    <circle cx="135" cy="131" r="2.2" fill="#fff"/>
    <!-- Headband gold crest -->
    <path d="M84 113 Q120 104 156 113" fill="none" stroke="#5fb2ff" stroke-width="3"/>
    <polygon points="120,101 128,110 120,119 112,110" fill="#f6d887" stroke="#0c1528" stroke-width="1.2"/>
    <!-- Unrolled glowing intel scroll in front -->
    <g transform="translate(68, 206) rotate(-6)">
      <rect x="10" y="6" width="88" height="36" rx="3" fill="#f3e6c8" stroke="#c89f52" stroke-width="1.8"/>
      <rect x="4" y="2" width="9" height="44" rx="4" fill="#8f5b28" stroke="#f6d887" stroke-width="1.2"/>
      <rect x="95" y="2" width="9" height="44" rx="4" fill="#8f5b28" stroke="#f6d887" stroke-width="1.2"/>
      <!-- Brushstroke seal lines (abstract, no text) -->
      <path d="M24 16 H56 M24 24 H82 M24 32 H66" stroke="#30241c" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
      <circle cx="78" cy="17" r="5" fill="#d94452" opacity="0.85"/>
    </g>
  </g>
  <rect width="240" height="320" fill="url(#spy_vig)"/>
  <!-- Subtle gold-leaf dust -->
  <g fill="#f6d887" opacity="0.55">
    <circle cx="26" cy="34" r="1.3"/><circle cx="212" cy="48" r="1.6"/><circle cx="195" cy="24" r="1"/>
    <circle cx="44" cy="96" r="1.1"/><circle cx="218" cy="142" r="1.2"/><circle cx="18" cy="176" r="1"/>
  </g>
</svg>