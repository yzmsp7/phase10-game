<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <linearGradient id="t4_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12132e"/><stop offset="50%" stop-color="#242352"/><stop offset="100%" stop-color="#100e21"/>
    </linearGradient>
    <linearGradient id="t4_vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090714" stop-opacity="0.15"/>
      <stop offset="58%" stop-color="#090714" stop-opacity="0.05"/>
      <stop offset="86%" stop-color="#0a0816" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#090713" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="t4_glow" cx="50%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#f0c040" stop-opacity="0.48"/>
      <stop offset="60%" stop-color="#f0c040" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f0c040" stop-opacity="0"/>
    </radialGradient>
    <pattern id="t4_pat" width="32" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 16 A16 16 0 0 1 32 16 M-16 16 A16 16 0 0 1 16 16 M16 16 A16 16 0 0 1 48 16" fill="none" stroke="#f0c040" stroke-opacity="0.08" stroke-width="1"/>
      <path d="M4 16 A12 12 0 0 1 28 16 M8 16 A8 8 0 0 1 24 16" fill="none" stroke="#f0c040" stroke-opacity="0.06" stroke-width="0.9"/>
    </pattern>
    <filter id="t4_blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    
  </defs>
  <rect width="240" height="320" fill="url(#t4_bg)"/>
  <rect width="240" height="320" fill="url(#t4_pat)"/>
  <rect width="240" height="320" fill="url(#t4_glow)"/>
  
  <!-- Mystical Indigo & Gold Aura -->
  <circle cx="120" cy="140" r="72" fill="#f0c040" opacity="0.12"/>
  <!-- Veiled Merchant Ninja -->
  <g>
    <path d="M52 276 Q66 180 120 172 Q174 180 188 276 Z" fill="#13132b" stroke="#e8ba45" stroke-width="1.6"/>
    <ellipse cx="120" cy="136" rx="25" ry="26" fill="#121126" stroke="#8d82d6" stroke-width="1.3"/>
    <circle cx="110" cy="134" r="2.8" fill="#7be0ff"/><circle cx="130" cy="134" r="2.8" fill="#7be0ff"/>
    <!-- Wide Merchant Straw Hat -->
    <path d="M46 118 Q120 72 194 118 Q120 132 46 118 Z" fill="#2c2442" stroke="#f0c040" stroke-width="2"/>
    <!-- Ornate Antique Brass Balance Scale in front -->
    <g stroke="#f0c040" stroke-width="2.4" fill="none">
      <line x1="120" y1="168" x2="120" y2="246"/>
      <line x1="60" y1="184" x2="180" y2="174"/>
      <circle cx="120" cy="179" r="5" fill="#f0c040"/>
      <!-- Left pan strings & pan (Gold Honor Medallions) -->
      <line x1="60" y1="184" x2="46" y2="218" stroke-width="1.3"/>
      <line x1="60" y1="184" x2="74" y2="218" stroke-width="1.3"/>
      <path d="M40 218 Q60 232 80 218 Z" fill="#c99326"/>
      <!-- Right pan strings & pan (Spirit Orb) -->
      <line x1="180" y1="174" x2="166" y2="208" stroke-width="1.3"/>
      <line x1="180" y1="174" x2="194" y2="208" stroke-width="1.3"/>
      <path d="M160 208 Q180 222 200 208 Z" fill="#c99326"/>
    </g>
    <!-- Glowing Honor Coins on left pan -->
    <circle cx="55" cy="212" r="7" fill="#ffe169" stroke="#7d5208" stroke-width="1.2"/>
    <circle cx="66" cy="210" r="7" fill="#ffd147" stroke="#7d5208" stroke-width="1.2"/>
    <!-- Ethereal Blue Spirit Flame on right pan -->
    <circle cx="180" cy="196" r="18" fill="#63d9ff" opacity="0.32" filter="url(#t4_blur)"/>
    <path d="M180 180 Q190 194 185 206 Q180 212 175 206 Q170 194 180 180 Z" fill="#b8f3ff"/>
  </g>
  <rect width="240" height="320" fill="url(#t4_vig)"/>
  <!-- Subtle gold-leaf dust -->
  <g fill="#f6d887" opacity="0.55">
    <circle cx="26" cy="34" r="1.3"/><circle cx="212" cy="48" r="1.6"/><circle cx="195" cy="24" r="1"/>
    <circle cx="44" cy="96" r="1.1"/><circle cx="218" cy="142" r="1.2"/><circle cx="18" cy="176" r="1"/>
  </g>
</svg>