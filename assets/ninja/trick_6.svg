  <rect width="240" height="320" fill="url(#t6_bg)"/>
  <rect width="240" height="320" fill="url(#t6_pat)"/>
  <rect width="240" height="320" fill="url(#t6_glow)"/>
  
  <!-- Stark Crimson Ceremonial Lanterns -->
  <g>
    <rect x="20" y="34" width="24" height="44" rx="10" fill="#d92938" stroke="#f6c945" stroke-width="1.8"/>
    <circle cx="32" cy="56" r="24" fill="#ff4757" opacity="0.22" filter="url(#t6_blur)"/>
    <rect x="196" y="34" width="24" height="44" rx="10" fill="#d92938" stroke="#f6c945" stroke-width="1.8"/>
    <circle cx="208" cy="56" r="24" fill="#ff4757" opacity="0.22" filter="url(#t6_blur)"/>
  </g>
