<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <linearGradient id="t6_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24090c"/><stop offset="50%" stop-color="#4d1419"/><stop offset="100%" stop-color="#140608"/>
    </linearGradient>
    <linearGradient id="t6_vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090714" stop-opacity="0.15"/>
      <stop offset="58%" stop-color="#090714" stop-opacity="0.05"/>
      <stop offset="86%" stop-color="#0a0816" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#090713" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="t6_glow" cx="50%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#ff5e5e" stop-opacity="0.48"/>
      <stop offset="60%" stop-color="#ff5e5e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff5e5e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="t6_pat" width="32" height="16" patternUnits="userSpaceOnUse">
