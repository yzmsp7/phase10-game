    <path d="M36 276 Q46 168 120 158 Q194 168 204 276 Z" fill="#170a0d" stroke="#f6c945" stroke-width="1.8"/>
    <path d="M58 176 H182 M64 198 H176" stroke="#b81d2c" stroke-width="4" opacity="0.75"/>
