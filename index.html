<style>

:root{--s1:12px;--s2:16px;--s3:20px;--s4:28px;--bg:#0f3d2e;--panel:#165740;--panel2:#1d6a4f;--ink:#f6f3ea;--mute:#cfe3d8;--accent:#f6c945;--R:#d64545;--B:#3b73d4;--G:#2e9e5b;--Y:#e0b020}

#app:has(.tray),#app:has(.cta){padding-bottom:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column} /* 內容不滿一屏時，sticky 托盤會浮在半空 → 撐滿一屏，用 margin-top:auto 把托盤推到最底 */

b{font-weight:600}

button{background:var(--accent);color:#2a2200;font-weight:600;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed;pointer-events:none} /* 點擊穿透到外層 [data-why]，用 toast 說明為什麼不能按 */
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--mute)}
input,select{font-size:16px;background:#0c2f23;color:var(--ink);border:1px solid #2f7d5f} /* iOS 對 <16px 的輸入框聚焦會自動放大整頁 */
button,.card{-webkit-user-select:none;user-select:none}
.mute{color:var(--mute)}.big{font-size:var(--s4);letter-spacing:6px;font-weight:600}

.table{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}

.group .row{gap:4px}.group small{display:block;color:var(--mute);margin-bottom:4px}

.tray>b{display:block}.tray .hand{padding:12px 0 8px}
.act button{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px}
.players{margin:12px 0;align-items:stretch}.ic{min-width:44px;min-height:44px;padding:0}
.slot.can{outline:2px dashed var(--accent);cursor:pointer}
.pile .card{width:56px;height:80px}.pile .card b{font-size:var(--s3)}

.pile button.card:not(:disabled){animation:glow 1s ease-in-out infinite alternate}
.overlay.sheet{align-items:flex-end;padding:0}.sheet .modal{border-radius:16px 16px 0 0;max-height:80vh;max-height:80dvh}.modal .log{max-height:none}
.bd{position:absolute;inset:0}.act .w{flex:1;display:flex}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.slot{background:#0c2f23;border-radius:8px;padding:8px;margin-top:8px}
.slotH{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.slot .row{min-height:48px}
.log{font-size:var(--s1);color:var(--mute);max-height:90px;overflow:auto}
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal{background:var(--panel);border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:90vh;max-height:90dvh;overflow:auto;position:relative}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left}th{color:var(--mute);font-weight:600}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#000d;padding:8px 16px;border-radius:10px;z-index:9;display:none}
tr.me{color:var(--accent);font-weight:600}h2 small{font-weight:400}
.crown{color:var(--accent)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:#777}.dot.on{background:#5fe08a}
@media(max-width:600px){
#app{padding:8px 8px 32px}.panel{padding:12px}h1{font-size:var(--s3)}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}.player{min-width:0;padding:8px}
.piles{width:100%;justify-content:center}.groups{min-width:0;width:100%}
.hand{gap:4px}.card{width:40px;height:56px}.card.sm{width:32px;height:46px}
button,select,input{min-height:40px}
.tray{margin:auto -8px 0;padding:8px 8px calc(12px + env(safe-area-inset-bottom))}
.cta{margin:auto -8px 0;padding:12px 8px calc(12px + env(safe-area-inset-bottom))} /* 負邊距要跟 #app 的左右內距（8）一樣，否則整頁會橫向溢出 */

input[readonly]{width:100%}
}
/* 橫放手機高度只有 ~375px：手牌改單排橫捲，按鈕縮矮，托盤才不會吃掉半個畫面 */
@media(max-height:500px){.tray .hand{flex-wrap:nowrap;overflow-x:auto}.act button{min-height:40px}}
/* 結算畫面：按鈕固定在 modal 底部（玩家多、剩牌多時中間捲動，按鈕仍在拇指區） */
.modal.res-m{display:flex;flex-direction:column;overflow:hidden}.res-m .body{overflow:auto;flex:1;min-height:0;padding:4px}.res-m .foot{padding-top:16px}

.rk{padding:16px;font-size:var(--s3)}.rk.me{background:var(--accent);color:#1a1a1a;outline:0} /* 排行榜：列加大；自己整列反白（深字 on 黃底） */
.hd{font-size:var(--s4);font-weight:600;margin-bottom:8px}
.cd.warn{display:inline-block;font-size:var(--s3);animation:shake 1s both}
@keyframes shake{0%{transform:scale(1)}12%{transform:scale(1.9) rotate(-8deg)}28%{transform:scale(1.7) rotate(8deg)}44%{transform:scale(1.7) rotate(-6deg)}60%{transform:scale(1.5) rotate(5deg)}100%{transform:scale(1)}}

/* 表情：浮動層放在 #app 外面（render 會重建 #app）；入口是頂列 😀 + 往下展開的選單 */

.rxb{position:absolute;text-align:center;font-size:var(--s4);line-height:1;animation:rxup 2s ease-out both}

@keyframes rxup{0%{transform:translate(-50%,0) scale(.4);opacity:0}15%{transform:translate(-50%,-8px) scale(1.2);opacity:1}25%{transform:translate(-50%,-16px) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-72px);opacity:0}}

.rxp{position:absolute;right:0;top:calc(100% + 8px);z-index:4;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;width:max-content;max-width:calc(100vw - 16px);padding:8px;background:var(--panel);border:1px solid #2f7d5f;border-radius:12px;box-shadow:0 8px 16px #0a2a1f99}
.rxp button{background:transparent;font-size:var(--s3);min-width:44px;min-height:44px;padding:0}

.fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}.fld label{color:var(--mute);font-size:var(--s1)}.fld select,.fld input{width:100%}

.rule{display:flex;gap:12px;align-items:center;min-height:56px;padding:8px 12px;margin-top:8px;border-radius:10px;background:#0c2f23;border:2px solid transparent;cursor:pointer}
.rule:has(input:checked){border-color:var(--accent);background:#1d6a4f}.rule:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

.rule:has(input:checked) i{background:var(--accent);border-color:var(--accent);color:#2a2200}.rule span{flex:1;min-width:0}.rule small{display:block;color:var(--mute)}
.cta{position:sticky;bottom:0;z-index:2;margin:auto -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid #2f7d5f}.cta button{width:100%;min-height:48px;font-size:var(--s2)}
.xs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px #0a2a1fcc;max-height:75vh;max-height:75dvh;overflow:auto}
.xs h3{margin:16px 0 8px;font-size:var(--s2);font-weight:600;color:var(--mute)}.xs h3:first-child{margin-top:0}.xs .row{gap:8px}
.xs button.on{background:var(--accent);color:#2a2200}.xs .nums button{min-width:44px;min-height:44px;padding:0}.xs .give .card{box-shadow:none}.xs .give .card.sel{outline:3px solid var(--accent);transform:translateY(-4px)}

.card.X b{font-size:var(--s3)}.card.X i{font-size:11px;line-height:1.1;text-align:center;max-width:100%}
.trophy{display:inline-block;animation:pop .7s cubic-bezier(.2,1.4,.4,1)}

.gsel{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:640px){.gsel{grid-template-columns:repeat(4,1fr)}}.gsel button{min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 8px;line-height:1.2}.gsel .gi{font-size:var(--s4);line-height:1}.gsel small{font-weight:400}

body.manila-mode{--bg:#1c110a;--panel:#2b1b11;--panel2:#392517;--ink:#f8eed8;--mute:#d8c19b;--accent:#e8b954;background:repeating-linear-gradient(90deg,#21140c 0,#21140c 26px,#1c110a 26px,#1c110a 54px,#24160d 54px,#24160d 82px);background-attachment:fixed}

@keyframes mBoatSail{0%{bottom:var(--from-b);transform:translate(-50%,50%) rotate(-3deg)}50%{transform:translate(-50%,50%) rotate(3deg) scale(1.04)}100%{bottom:var(--to-b);transform:translate(-50%,50%) rotate(0)}}
.m-boat.can{cursor:pointer}
.m-boat.can:hover .m-boat-svg,.m-boat.sel .m-boat-svg{filter:drop-shadow(0 0 10px #f4c459) drop-shadow(0 6px 10px #000a)}
.m-boat-svg{width:58px;height:88px;filter:drop-shadow(0 6px 8px #000b);transition:filter .2s}
.m-boat-cargo{position:absolute;top:15px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid #e6c06e;box-shadow:0 2px 5px #0009;pointer-events:none}
.m-boat-crew{position:absolute;top:46px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:1px;width:40px;pointer-events:none}
.m-boat-die{position:absolute;top:-6px;right:-16px;z-index:5;pointer-events:none}
.m-boat-pos{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);background:#1f120af0;color:#f5dfae;border:1px solid #b58d47;border-radius:8px;padding:0 6px;font-size:10px;font-weight:600;white-space:nowrap;box-shadow:0 2px 4px #0008;pointer-events:none}
.m-boat.danger .m-boat-pos{background:#7d1818;border-color:#ff9e94;color:#fff}
.m-boat.arrived .m-boat-pos{background:#185738;border-color:#7fe8b0;color:#e4fff0}
.m-bay-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
.m-bay-empty span{background:#26170eee;color:#f3e1bc;border:1.5px solid #9e7738;border-radius:12px;padding:12px 16px;font-size:var(--s1);box-shadow:0 6px 16px #000a;line-height:1.45}
/* 全寬水平船隻登船條（每船一列、零截字、大點擊目標） */
.m-ship-rows{display:flex;flex-direction:column;gap:8px}
.m-srow{background:linear-gradient(180deg,#f4e4c2f2,#e2c68ff0);color:#2a190d;border:1.5px solid #7d5b28;border-left:5px solid var(--gc);border-radius:10px;padding:8px 10px;box-shadow:0 3px 10px #0a050299;display:flex;flex-direction:column;gap:8px}
.m-srow.danger{border-color:#b82e2e;box-shadow:0 0 12px #d6454566}
.m-srow.arrived{border-color:#2c8a56}
.m-srow-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.m-srow-id{display:flex;align-items:center;gap:8px;min-width:0}
.m-srow-id b{font-size:var(--s2);color:#26150a}
.m-srow-id small{display:block;font-size:var(--s1);color:#5c3f1e;font-weight:600}
.m-srow-st{font-size:var(--s1);font-weight:600;padding:3px 8px;border-radius:8px;background:#2b1a0e18;color:#3d2510;white-space:nowrap}
.m-srow.danger .m-srow-st{background:#8f1f1f;color:#fff}
.m-srow.arrived .m-srow-st{background:#1c6b42;color:#e6fff2}
.m-crew-row{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:6px}
.m-slot{min-height:42px;padding:4px 6px;border-radius:8px;background:#e4cc9a;border:1.5px solid #94723c;color:#4a3116;font-size:var(--s1);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-variant-numeric:tabular-nums;cursor:default;min-width:0}
.m-slot.open{cursor:pointer;background:#fff8e3;border:2px dashed #b56c12;color:#7d3f00;box-shadow:0 0 0 2px #f0c45c55}
.m-slot.sel{background:#e8b954;color:#261600;border:2px solid #fff;box-shadow:0 0 12px #f0c45ccc}
.m-slot.locked{opacity:.46}
.m-slot.occ{background:#d4b782;border-color:#7d5d2d;color:#2b1a0e}
.m-slot .snm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--s1)}
/* 全寬沿岸與特殊職位木牌（不擠兩欄，卡片大而清楚） */
.m-zones-stack{display:flex;flex-direction:column;gap:10px}
.m-plaque{background:linear-gradient(180deg,#f3e2bef2,#e2c792f0);color:#2a190d;border:1.5px solid #7d5b28;border-radius:12px;padding:10px;box-shadow:0 4px 12px #0d0703aa,inset 0 0 0 1px #fff6df99}
.m-plaque.dark{background:linear-gradient(180deg,#2e1715f0,#20100ff0);color:#f8ebd4;border-color:#9e3c36;box-shadow:0 4px 12px #090302bb,inset 0 0 0 1px #e26d5c33}
.m-plaque.navy{background:linear-gradient(180deg,#163042f0,#102333f0);color:#f3e6cc;border-color:#8f6d37;box-shadow:0 4px 12px #090302aa}
.m-plaque-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #8a693544}
.m-plaque.dark .m-plaque-h,.m-plaque.navy .m-plaque-h{border-bottom-color:#c9a15a33}
.m-plaque-h b{font-size:var(--s2);letter-spacing:.3px}.m-plaque-h small{font-size:var(--s1);opacity:.82}
.m-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m-grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.m-zcard{min-height:60px;width:100%;padding:8px 6px;border-radius:9px;background:#efe0bd;border:1.5px solid #8f6d37;color:#2b1a0e;font-size:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;font-variant-numeric:tabular-nums;cursor:default}
.m-zcard.row{flex-direction:row;justify-content:space-between;text-align:left;padding:10px 12px;min-height:50px}
.m-plaque.dark .m-zcard{background:#3a1d1a;border-color:#8a3d38;color:#f8ebd4}
.m-plaque.navy .m-zcard{background:#1b384d;border-color:#7a5e32;color:#f5e9cf}
.m-zcard small{font-size:11px;opacity:.82;line-height:1.2}
.m-zcard .m-price{font-size:var(--s2);font-weight:600;color:#7a3e06}
.m-plaque.dark .m-zcard .m-price,.m-plaque.navy .m-zcard .m-price{color:var(--accent)}
.m-zcard.open{cursor:pointer;background:#fff7e0;border:2px dashed #b56c12;box-shadow:0 0 0 2px #f0c45c55,0 2px 6px #0004}
.m-plaque.dark .m-zcard.open{background:#52231e;border-color:#f0c45c;color:#fff}
.m-plaque.navy .m-zcard.open{background:#234a66;border-color:#f0c45c;color:#fff}
.m-zcard.sel{background:#e8b954!important;color:#261600!important;border:2px solid #fff!important;box-shadow:0 0 14px #f0c45ccc}
.m-zcard.sel small,.m-zcard.sel .m-price{color:#3d2400!important;opacity:1}
.m-zcard.locked{opacity:.5}
.m-zcard.occ{background:#dfc694;border-color:#856535;color:#2b1a0e}
.m-plaque.dark .m-zcard.occ{background:#291412;border-color:#69302c}
.m-plaque.navy .m-zcard.occ{background:#132838;border-color:#544225}
.m-zcard.ins-box{background:linear-gradient(180deg,#dff1e0,#c8e4cb);border-color:#3a7a4d;color:#12381d}
.m-zcard.ins-open{cursor:pointer;background:#ebfaec;border:2px dashed #1f8a4c;box-shadow:0 0 12px #3fd18055}
.m-zcard.ins-open.sel{background:#38b56c!important;color:#052412!important;border-color:#fff!important}
/* 船老大特權工作台（行內呈現，不擠占固定底部托盤） */
.m-desk{background:linear-gradient(180deg,#332114,#25170e);border:2px solid #c99a45;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 8px 20px #0a0502aa}
.m-desk h2{color:var(--accent);font-size:var(--s2);margin:0 0 10px}
/* 底部操作區與復古股票證書 */
.m-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid #6b4e27;font-size:var(--s1);font-variant-numeric:tabular-nums}
.m-bar-btn{min-height:36px;padding:4px 10px;font-size:var(--s1);border-radius:8px}
.m-step{display:flex;align-items:center;gap:6px}
.m-step button{min-width:44px;min-height:44px;padding:0 10px}
.m-step b{min-width:40px;text-align:center;font-size:var(--s3);font-variant-numeric:tabular-nums}
.m-chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.m-chip{min-height:48px;padding:6px 10px;border-radius:10px;background:#1e130b;border:1.5px solid #75562c;color:#f8eed8;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:var(--s1)}
.m-chip.on{border-color:var(--gc);background:#342214;box-shadow:0 0 0 1.5px var(--gc)}
.m-alloc{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#1d120a;border-radius:10px;margin-top:8px;border:1px solid #6b4e27;border-left:4px solid var(--gc)}
.m-cert{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;background:linear-gradient(180deg,#f4e4c2,#e0c38c);color:#2b1a0e;border:2px solid #8a6630;border-left:5px solid var(--gc);border-radius:10px;margin-top:10px;box-shadow:inset 0 0 0 2px #fff6df88,0 4px 10px #0a050288;position:relative}
.m-cert.mort{background:linear-gradient(180deg,#dfd1b6,#c7b494);border-style:dashed;border-left-style:solid}
.m-cert small{color:#5c3f1e}
.m-wax{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:12px;background:#8f1f1f;color:#ffece8;font-size:11px;font-weight:600;border:1px solid #c9584d;box-shadow:0 2px 4px #0006;margin-top:4px}
/* 🎲 真 3D 六面立體木骰擲骰動畫舞台（獨立在 #app 外，3 顆彩色木骰同步拋出翻滾落地） */
#mDiceStage{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:16px;background:#0a0502c4;backdrop-filter:blur(3px);cursor:pointer}
#mDiceStage.on{display:flex;animation:mFadeIn .22s ease-out both}
#mDiceStage.out{animation:mFadeOut .3s ease-in forwards}
.m-dtray{width:100%;max-width:420px;background:radial-gradient(circle at 50% 35%,#3d2616 0%,#22130a 82%);border:3px solid #c99a45;border-radius:20px;padding:20px 16px 16px;box-shadow:0 20px 48px #000d,inset 0 0 28px #0c0602bb,inset 0 0 0 2px #f6d58b33;text-align:center;color:#f8eed8}
.m-dtray-hd{font-size:var(--s3);font-weight:600;color:var(--accent);margin-bottom:18px;letter-spacing:.5px}
.m-drow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
.m-dcol{display:flex;flex-direction:column;align-items:center;gap:10px}
.m-dwrap{position:relative;width:76px;height:76px;display:flex;align-items:center;justify-content:center;perspective:360px}
.m-dwrap::before{content:'';position:absolute;bottom:2px;left:50%;width:50px;height:14px;border-radius:50%;background:#00000088;filter:blur(4px);transform:translateX(-50%);pointer-events:none}
.m-dwrap.throw::before{animation:mDieShadow 1.05s cubic-bezier(.22,.82,.34,1) var(--dl,0s) both}
.m-dthrow{width:56px;height:56px;transform-style:preserve-3d;position:relative}
.m-dwrap.throw .m-dthrow{animation:mDiceArc 1.05s cubic-bezier(.2,.8,.32,1) var(--dl,0s) both}
.m-dcube{width:56px;height:56px;position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx1,0deg)) rotateY(var(--ry1,0deg)) rotateZ(0deg)}
.m-dwrap.throw .m-dcube{animation:mDiceSpin 1.05s cubic-bezier(.16,.84,.28,1) var(--dl,0s) both}
.m-dface{position:absolute;inset:0;border-radius:10px;background:var(--dc,#8c5a2b);border:2px solid #241207;box-shadow:inset 0 0 0 2px #ffffff38,inset 0 0 10px #00000044;display:grid;place-items:center;backface-visibility:hidden}
.m-dface svg{width:52px;height:52px;display:block}
.m-dface.f1{transform:rotateY(0deg) translateZ(28px)}
.m-dface.f2{transform:rotateY(90deg) translateZ(28px)}
.m-dface.f3{transform:rotateX(90deg) translateZ(28px)}
.m-dface.f4{transform:rotateX(-90deg) translateZ(28px)}
.m-dface.f5{transform:rotateY(-90deg) translateZ(28px)}
.m-dface.f6{transform:rotateY(180deg) translateZ(28px)}
.m-dwrap.land::after{content:'';position:absolute;inset:-4px;border-radius:16px;border:2px solid var(--accent);opacity:0;animation:mRing .6s ease-out both}
.m-dres{min-height:38px;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:0;transform:translateY(6px);transition:opacity .28s ease,transform .28s ease}
.m-dres.show{opacity:1;transform:none}
.m-dpill{display:inline-block;padding:2px 8px;border-radius:8px;font-size:var(--s1);font-weight:600;background:#1a0f08;border:1px solid #8c6a36;color:#f5dfae;font-variant-numeric:tabular-nums;white-space:nowrap}
.m-dpill.port{background:#185e3a;border-color:#7fe8b0;color:#e6fff2}
.m-dpill.p13{background:#8c1d1d;border-color:#ff9e94;color:#fff}
.m-dtray-ft{margin-top:14px;font-size:var(--s1);color:var(--mute)}
.m-ready-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;justify-content:center}
.m-rchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;font-size:var(--s1);background:#24150c;border:1px solid #6b4e27;color:var(--mute)}
.m-rchip.ok{background:#19452c;border-color:#5ce09e;color:#e4fff0;font-weight:600}
/* 📢 其他玩家動作大通知橫幅（非阻斷、高對比羊皮紙×胡桃木牌，清楚掌握對手每一步） */
#mActBan{position:fixed;left:50%;top:max(56px,calc(env(safe-area-inset-top) + 52px));transform:translateX(-50%);z-index:7;width:calc(100% - 24px);max-width:440px;pointer-events:none;display:none}
#mActBan.on{display:block;animation:mActIn .32s cubic-bezier(.18,1.25,.35,1) both}
#mActBan.out{animation:mActOut .26s ease-in forwards}
.m-act-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(180deg,#342013f5,#21130bf5);border:2px solid #e8b954;box-shadow:0 14px 32px #000000cc,0 0 22px #e8b95455,inset 0 1px 0 #fff2cc44;color:#fbf3df;backdrop-filter:blur(4px)}
.m-act-card.red{border-color:#e8635a;background:linear-gradient(180deg,#471815f5,#290d0cf5);box-shadow:0 14px 32px #000c,0 0 24px #d6454577}
.m-act-card.green{border-color:#57d693;background:linear-gradient(180deg,#163d28f5,#0d2619f5);box-shadow:0 14px 32px #000c,0 0 22px #2eb87266}
.m-act-card.blue{border-color:#68a9ed;background:linear-gradient(180deg,#163047f5,#0e2030f5);box-shadow:0 14px 32px #000c,0 0 22px #3b82d466}
.m-act-card.mute{border-color:#8c734b;background:linear-gradient(180deg,#2c1e15f0,#1e140ef0);box-shadow:0 10px 24px #000b}
.m-act-vis{position:relative;flex:none;display:flex;align-items:center;justify-content:center;min-width:40px}
.m-act-vis .m-ico-img{width:40px;height:40px;border-width:2px}
.m-act-vis .m-mp-badge{position:absolute;right:-6px;bottom:-4px}
.m-act-txt{min-width:0;flex:1}
.m-act-ttl{font-size:18px;font-weight:600;line-height:1.25;color:#fff7e2;letter-spacing:.2px}
.m-act-sub{font-size:13px;color:#e4cfa8;margin-top:3px;line-height:1.3}
@keyframes mActIn{from{opacity:0;transform:translate(-50%,-18px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes mActOut{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-12px) scale(.97)}}
@keyframes mFadeIn{from{opacity:0}to{opacity:1}}
@keyframes mFadeOut{from{opacity:1}to{opacity:0}}
@keyframes mDiceArc{
  0%{transform:translate3d(var(--tx0,30px),110px,0) scale(.55);opacity:0}
  16%{opacity:1}
  44%{transform:translate3d(calc(var(--tx0,30px) * -.25),-34px,0) scale(1.14)}
  68%{transform:translate3d(calc(var(--tx0,30px) * .12),6px,0) scale(.94)}
  84%{transform:translate3d(0,-10px,0) scale(1.04)}
  100%{transform:translate3d(0,0,0) scale(1)}
}
@keyframes mDiceSpin{
  0%{transform:rotateX(var(--rx0,0deg)) rotateY(var(--ry0,0deg)) rotateZ(var(--rz0,-180deg))}
  100%{transform:rotateX(var(--rx1,720deg)) rotateY(var(--ry1,720deg)) rotateZ(0deg)}
}
@keyframes mDieShadow{
  0%{transform:translateX(-50%) scale(.4);opacity:0}
  44%{transform:translateX(-50%) scale(.75);opacity:.45}
  68%{transform:translateX(-50%) scale(1.1);opacity:.9}
  84%{transform:translateX(-50%) scale(.88);opacity:.65}
  100%{transform:translateX(-50%) scale(1);opacity:.85}
}
@keyframes mRing{0%{transform:scale(.75);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@media(min-width:700px){
.m-bay{height:384px;gap:12px}.m-boat-svg{width:68px;height:102px}.m-boat-cargo{top:18px;width:32px;height:32px}.m-boat-crew{top:53px;width:46px}
.m-zones-stack{display:grid;grid-template-columns:1fr 1fr;gap:10px}.m-zones-stack .wide{grid-column:1 / -1}
}
@media(max-width:600px){
.m-mkt{gap:5px}.m-good{padding:5px 4px}.m-ico-img{width:22px;height:22px}
.m-map{padding:10px 8px;gap:10px}.m-bay{height:300px;gap:5px}
.m-boat-svg{width:52px;height:78px}.m-boat-cargo{top:13px;width:24px;height:24px}.m-boat-crew{top:41px;width:36px}
}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<div id="skipBan" role="status"></div>
<div id="rx" aria-hidden="true"></div>
<div id="mActBan" role="status" aria-live="polite"></div>
<div id="mDiceStage" role="dialog" aria-label="擲骰結果動畫"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const EMOJI = ['😮', '😡', '😂', '👏', '😭', '😎', '🙏', '😴']; // 跟 server.js 的白名單同一份
const SYM = { R: '●', B: '■', G: '▲', Y: '◆' }, CN = { R: '紅', B: '藍', G: '綠', Y: '黃' };
// 房間規則（鍵名跟 server.js 的 RULES 同一份，test.js 會比對）；每條都在建房畫面和房間畫面列出說明
const RULES = [
  ['catchUp', '落後補牌', '階段落後最高者 2 階以上，每回合多發 1 張牌'],
  ['first', '先放先贏', '第一個放下階段的人，該回合 −10 分（可能變負分）'],
  ['rv', '迴轉牌 ×2', '打出後出牌方向反過來；2 人局無效果'],
  ['sh', '換位子牌 ×2', '打出後全員座位隨機重排，手牌跟著人走'],
  ['xn', '數字交換牌 ×4', '指定一人和一個數字，用自己選好的牌，換他手上該數字的隨機一張；他沒有就落空。也可以不交換，直接當普通牌棄掉'],
  ['xc', '顏色交換牌 ×2', '同上，改指定顏色，一樣可以直接棄掉'],
];
const SP_NOTE = '特殊牌每張 25 分，不能放階段、不能接牌、不能從棄牌堆撿。'; // 四種特殊牌共通，只寫一次
const SP = { rv: ['⟲', '迴轉'], sh: ['⇄', '換位'], xn: ['#', '換數'], xc: ['◐', '換色'] }; // 特殊牌：[牌面, 名稱]
const lab = ([t, n]) => (t === 'set' ? `${n} 張同數字` : t === 'run' ? `${n} 張連續順子` : `${n} 張同顏色`);
const store = {
  get() { try { return JSON.parse(localStorage.getItem('p10') || 'null'); } catch { return null; } },
  set(v) { try { v ? localStorage.setItem('p10', JSON.stringify(v)) : localStorage.removeItem('p10'); } catch {} },

  const m = Array.from({ length: N }, () => Array(N).fill(0)), fn = m.map((r) => r.map(() => false));

  for (const [r0, c0] of [[0, 0], [0, N - 7], [N - 7, 0]]) for (let dr = -1; dr <= 7; dr++) for (let dc2 = -1; dc2 <= 7; dc2++) { const d = Math.max(Math.abs(dr - 3), Math.abs(dc2 - 3)); set(r0 + dr, c0 + dc2, +(d !== 2 && d !== 4)); }

  set(N - 8, 8, 1);
  const fc = [...Array(15)].map((_, i) => [i < 6 ? [i, 8] : i < 8 ? [i + 1, 8] : i === 8 ? [8, 7] : [8, 14 - i], i < 8 ? [8, N - 1 - i] : [N - 15 + i, 8]]); // 格式資訊第 i 位的兩個位置
  fc.flat().forEach(([r, c]) => set(r, c, 0));

  for (let c = N - 1, up = true, i = 0; c > 0; c -= 2, up = !up) {
    if (c === 6) c = 5;
    for (let k = 0; k < N; k++) for (const cc of [c, c - 1]) { const r = up ? N - 1 - k : k; if (!fn[r][cc]) m[r][cc] = stream[i++] ?? 0; }

  const MASK = [(r, c) => (r + c) % 2 === 0, (r) => r % 2 === 0, (r, c) => c % 3 === 0, (r, c) => (r + c) % 3 === 0, (r, c) => ((r >> 1) + Math.floor(c / 3)) % 2 === 0,
    (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0, (r, c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0, (r, c) => ((((r + c) % 2) + ((r * c) % 3)) % 2) === 0];
  const penalty = (t) => { // 規格的四條扣分：連續同色、2×2 色塊、類 finder 圖樣、深淺比例
    let p = 0;
    for (const l of [...t, ...t[0].map((_, c) => t.map((row) => row[c]))].map((x) => x.join(''))) {

      p += 40 * (l.match(/(?=10111010000|00001011101)/g) ?? []).length;

    return p + 10 * (Math.ceil(Math.abs(t.flat().reduce((a, b) => a + b) * 20 - N * N * 10) / (N * N)) - 1);
  };
  const tries = MASK.map((f, mk) => {
    const t = m.map((row, r) => row.map((x, c) => (fn[r][c] ? x : x ^ +f(r, c))));
    let f15 = (0b01000 | mk) << 10, q = f15; // 格式資訊：糾錯 L(01) + 遮罩編號，BCH(15,5)

// 邀請 QR：localhost 開頁面時 lanHost 還沒查到就先不畫；查不到區網 IP（null）就說明原因，因為掃 localhost 手機打不開
function qrBox(link) {
  if (lanHost === undefined) return '';
  if (isLocal && !lanHost) return '<p class="mute" style="margin:12px 0 0">找不到區網 IP，無法產生可掃描的 QR code。請確認電腦已連上 Wi-Fi。</p>';
  const m = qrMatrix(link); if (!m) return '';
  const d = m.flatMap((row, r) => row.map((x, c) => (x ? `M${c} ${r}h1v1h-1z` : ''))).join(''), n = m.length + 8;
  return `<svg viewBox="-4 -4 ${n} ${n}" width="176" height="176" role="img" aria-label="邀請連結 QR code" shape-rendering="crispEdges" style="display:block;margin-top:12px;border-radius:8px"><rect x="-4" y="-4" width="${n}" height="${n}" fill="#fff"/><path d="${d}"/></svg>
    <p class="mute" style="margin:8px 0 0">面對面可以直接用手機相機掃描加入。</p>`;
}

function game() {
  const s = snap, g = s.game, me = s.me, mine = g.players.find((p) => p.id === me);
  const myTurn = g.turn === me, canAct = myTurn && g.stage === 'act';
  const laying = g.status === 'play' && mine.in && !mine.laid;
  if (!laying) actSlot = null;
  if (g.status !== 'play') sheet = false, histFor = null; // 結算畫面出現時收起 📋 面板，免得下一回合自己彈出來
  const online = Object.fromEntries(s.players.map((p) => [p.id, p.online]));
  const ids = new Set(g.hand.map((c) => c.id));
  sel.forEach((id) => ids.has(id) || sel.delete(id));
  Object.keys(slots).forEach((id) => ids.has(+id) || delete slots[id]);
  // 抽牌動畫：手牌比上次多出來的牌 = 剛抽到的（只在該次 render 播動畫），標記「新」直到我棄牌結束回合
  if (seen?.round !== g.round) { seen = { round: g.round, ids: null, drawn: null, laid: null }; slots = {}; los = {}; actSlot = null; } // 新回合發牌不算抽牌；牌 id 每局重編，舊預放要清
  // 放下階段是整場的 peak：自己 → 震動 + 慶祝；別人 → 橫幅提醒（只在「剛變成已放下」的那次 render 觸發）。
  // 不顯示階段數字：放完最後一張牌時伺服器已把 phase+1，數字會差一。
  if (seen.laid) g.players.forEach((p) => { if (p.laid && !seen.laid.has(p.id)) { if (p.id === me) { navigator.vibrate?.(30); toast('🎉 階段完成！'); } else toast(`${p.name} 放下了階段`); } });
  seen.laid = new Set(g.players.filter((p) => p.laid).map((p) => p.id));
  const fresh = seen.ids ? [...ids].filter((id) => !seen.ids.has(id)) : [];
  seen.ids = ids;
  if (!canAct || !ids.has(seen.drawn)) seen.drawn = null;
  if (fresh.length === 1) seen.drawn = fresh[0];
  const rank = (c) => (c.t === 'n' ? (byColor ? 'RBGY'.indexOf(c.c) * 13 + c.n : c.n * 4 + 'RBGY'.indexOf(c.c)) : c.t === 'w' ? 100 : 101 + (SP[c.t] ? Object.keys(SP).indexOf(c.t) : 0)); // 顏色模式：同色排一起，色內依數字
  const hand = [...g.hand].sort((a, b) => rank(a) - rank(b));
  const req = g.phases[mine.phase - 1] || [];
  const name = (id) => g.players.find((p) => p.id === id)?.name ?? '?';
  // 特殊牌效果：新事件才彈出橫幅（第一次 render／重連只記錄，不重播舊事件）
  const ev = g.ev, nm = (id) => (id === me ? '你' : name(id));
  if (seen.evNo !== undefined && ev && ev.no !== seen.evNo) {
    const hit = ev.to === me, who = `<span class="crown">${esc(nm(ev.by))}</span>`, to = `<span class="crown">${esc(nm(ev.to))}</span>`;
    const what = { s: `⏭ ${who} 跳過了 ${to}`, rv: `⟲ ${who} 打出迴轉牌，方向反過來了`, sh: `⇄ ${who} 打出換位牌，座位重排了`}[ev.kind]
      || `${SP[ev.kind][0]} ${who} 指定 ${to} 的${ev.kind === 'xn' ? `數字 ${ev.want}` : `${CN[ev.want]}色`}：${!ev.ok ? '對方沒有，落空' : ev.got ? `${esc(nm(ev.by))}${ev.by === me ? '拿到' : '換走'} ${card(ev.by === me ? ev.got : ev.give, { tag: 'span', cls: 'sm' })}` : '交換成功'}`;
    skipBanner(`${what}${hit && ev.kind === 's' ? '<div style="margin-top:12px"><button data-v="😡" aria-label="回應生氣">😡</button></div>' : ''}`, hit && ev.kind === 's' ? 4000 : ev.got ? 4000 : 2400);
    if (hit) navigator.vibrate?.([60, 40, 60]);
  }
  seen.evNo = ev ? ev.no : null;
  const picked = hand.filter((c) => sel.has(c.id));
  if (!canAct || !picked.length) endFor = null;

  const players = g.players.map((p) => `<div class="player ${g.turn === p.id ? 'turn' : ''} ${p.in ? '' : 'out'}" data-pid="${p.id}" ${p.in ? `data-a="hist" data-v="${p.id}" role="button" tabindex="0" aria-haspopup="dialog"` : ''}>
    <b class="nm">${esc(p.name)}${p.id === me ? '（你）' : ''}</b>
    <div class="ft"><small>${p.left ? '已離開' : `<span style="white-space:nowrap">階段 ${p.phase > 10 ? 10 : p.phase}${p.laid ? ' ✅' : ''}</span><br>${p.score} 分${online[p.id] ? '' : ' 💤'}${p.skip === 1 ? '<br>⏭將被跳過' : ''}`}</small>${p.left ? '' : `<span class="cnt" aria-label="${p.n} 張">${p.n}<small>張${p.in ? ' ›' : ''}</small></span>`}</div>
    ${p.id === me || !p.pick ? '' : `<div class="pick">${p.pick.from === 'pile' ? '🂠 抽牌堆' : `♻ 撿棄牌 ${card(p.pick.card, { tag: 'span', cls: 'sm' })}`}</div>`}</div>`).join('');

  // 排名：先比階段（高者優先）再比分數（低者優先）。同條件並列同名次。
  const cmp = (a, b) => b.phase - a.phase || a.score - b.score;
  const sorted = g.players.filter((p) => !p.left).sort(cmp); // 離開的人不列入排名
  const ranking = sorted.map((p) => `<tr class="${p.id === me ? 'me' : ''}"><td>${sorted.findIndex((q) => !cmp(q, p)) + 1}</td><td>${esc(p.name)}</td>
    <td>階段 ${Math.min(p.phase, 10)} ${p.laid ? '✅' : ''}</td><td>${p.score} 分</td></tr>`).join('');

  const groups = g.groups.map((gr, i) => {
    const t = gr.type === 'set' ? `${gr.n} 同數` : gr.type === 'run' ? `順子 ${gr.lo}–${gr.hi}` : `同色（${CN[gr.c]}）`;
    const cs = gr.cards.map((c, k) => card(c, { tag: 'div', cls: 'sm', sub: c.t === 'w' ? (gr.type === 'set' ? gr.n : gr.type === 'run' ? gr.lo + k : '') : '' })).join('');
    // 選了牌後整組變成點擊目標（不再長按鈕列，版面不會跳）；選到百搭的順子才多問接前/接後（覆蓋層，不占版面）
    const can = canAct && mine.laid && picked.length;
    const ends = can && endFor === i ? `<div class="ends"><button data-a="hit" data-v="${i}" data-end="lo">‹ 接前</button><button data-a="hit" data-v="${i}" data-end="hi">接後 ›</button></div>` : '';
    return `<div class="group ${can ? 'can' : ''}" ${can ? `data-a="hit" data-v="${i}" role="button"` : ''}><small>${esc(name(gr.owner))} · ${t}</small><div class="row">${cs}</div>${ends}</div>`;
  }).join('');

  const need = req.map(([, n], gi) => hand.filter((c) => slots[c.id] === gi).length >= n);
  // 放階段：點某一組讓它「作用中」，再直接點手牌放入（滿了自動跳下一組）；點組內的牌拿回手上。放下階段的按鈕在底部托盤。
  // 百搭多出來時：選順子從幾開始（例如 2,3,4＋百搭 → 1–4 或 2–5）
  const runBtns = (gi, size) => { const rg = runRange(gi), cur = curLo(gi); if (!rg) return ''; let b = ''; for (let l = rg[0]; l <= rg[1]; l++) b += `<button class="${l === cur ? '' : 'ghost'}" data-a="lo" data-v="${gi}:${l}" aria-pressed="${l === cur}">${l}–${l + size - 1}</button>`; return `<span class="row">${b}</span>`; };
  const layUI = laying ? `<div>${req.map((r, gi) => {
    const cs = hand.filter((c) => slots[c.id] === gi), on = actSlot === gi;
    // 放滿的順子照實際順序排，百搭標出它代表的數字；頭尾能換邊的百搭可以拖
    const shown = runLayout(gi) || cs.map((c) => ({ c }));
    return `<div class="slot ${on ? 'can' : ''}" data-a="slot" data-v="${gi}" role="button" aria-pressed="${on}"><div class="slotH"><span>組 ${gi + 1}：${lab(r)}（${cs.length}/${r[1]}）</span>${runBtns(gi, cs.length)}</div>
      <div class="row">${shown.map(({ c, n, mv }) => card(c, { attrs: `data-a="unslot" data-v="${c.id}"${mv ? ` data-drag="${gi}:${mv}"` : ''}`, sub: c.t === 'w' ? n : '' })).join('') ||`<span class="mute">${on ? '點下方手牌放入這組' : '點這組，再點下方手牌'}</span>`}</div></div>`;
  }).join('')}<p class="mute" style="margin:8px 0 0">順子可用百搭補洞；每組至少要有一張數字牌；放滿後還能接的牌可以一起放（等於順便接牌）${req.some((_, gi) => runLayout(gi)?.some((x) => x.mv)) ? '。虛線的百搭可以拖到另一頭' : ''}${canAct ? '' : '。可先排好牌，輪到你抽完牌後再放下'}</p></div>` : '';

  const free = hand.filter((c) => slots[c.id] === undefined);
  const one = picked.length === 1 ? picked[0] : null;
  const targets = g.players.filter((p) => p.in && p.id !== me && p.skip === 0);
  // 停用的按鈕不吞掉點擊（CSS pointer-events:none），外層 data-why 會用 toast 說明原因
  const wb = (label, a, why, cls = '') => `<span class="w" data-why="${esc(why)}"><button class="${cls}" data-a="${a}" ${why ? 'disabled' : ''}>${label}</button></span>`;
  const layWhy = need.every(Boolean) ? '' : '每一組都要放滿才能放下階段';
  const layBtn = canAct && laying ? wb('放下階段', 'lay', layWhy, layWhy ? 'ghost' : '') : '';
  const kind = one && g.hand.length > 1 ? one.t : null; // 手上只剩最後一張時直接出完，效果不觸發
  const others = g.players.filter((p) => p.in && p.id !== me);
  const swap = kind === 'xn' || kind === 'xc';
  if (!swap) xs = { target: null, v: null, give: null };
  if (xs.give && !ids.has(xs.give)) xs.give = null;
  const swapOk = swap && xs.target && xs.v && xs.give;
  const discard = !canAct ? '' : kind === 's' && targets.length
    ? `<span>跳過誰？</span>${targets.map((p) => `<button data-a="discard" data-v="${p.id}">${esc(p.name)}</button>`).join('')}`
    : swap ? ''
    : wb('棄牌並結束回合', 'discard', one ? '' : actSlot !== null ? '正在放階段：再點一次該組可取消' : picked.length > 1 ? '一次只能棄一張牌' : '先點一張要棄的牌', layBtn && !layWhy ? 'ghost' : '');
  // 交換牌：結果出來前先選好三件事（對象、數字／顏色、要換出的牌），放在底部抽屜裡；換出的牌也在抽屜內選，不跟手牌區的「已選」標示混在一起
  const give = hand.filter((c) => c.id !== one?.id);
  const swapUI = canAct && swap ? `<div class="overlay sheet" style="background:#0006"><div class="bd" data-a="xcancel"></div><div class="xs" role="dialog" aria-label="${one.t === 'xn' ? '數字' : '顏色'}交換">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2 style="margin:0;color:var(--ink)">${one.t === 'xn' ? '數字' : '顏色'}交換牌</h2><button class="ghost ic" data-a="xcancel" aria-label="取消">✕</button></div>
    <h3>跟誰換</h3><div class="row">${others.map((p) => `<button class="${xs.target === p.id ? 'on' : 'ghost'}" data-a="xt" data-v="${p.id}" aria-pressed="${xs.target === p.id}" style="min-height:44px">${esc(p.name)}</button>`).join('')}</div>
    <h3>指定${one.t === 'xn' ? '數字' : '顏色'}</h3><div class="row nums">${one.t === 'xn' ? [...Array(12)].map((_, i) => `<button class="${xs.v === i + 1 ? 'on' : 'ghost'}" data-a="xv" data-v="${i + 1}" aria-pressed="${xs.v === i + 1}">${i + 1}</button>`).join('') : ['R', 'B', 'G', 'Y'].map((c) => `<button class="${xs.v === c ? 'on' : 'ghost'}" data-a="xv" data-v="${c}" aria-pressed="${xs.v === c}" style="min-height:44px">${CN[c]}</button>`).join('')}</div>
    <h3>你要換出哪張 <small class="mute">（看結果前先決定）</small></h3><div class="row give">${give.map((c) => card(c, { cls: c.id === xs.give ? 'sel' : '', attrs: `data-a="xg" data-v="${c.id}" aria-pressed="${c.id === xs.give}"` })).join('')}</div>
    <button class="go ${swapOk ? '' : 'ghost'}" data-a="swap" ${swapOk ? '' : 'disabled'}>${swapOk ? '打出並交換' : '還沒選完'}</button>
    <button class="ghost go" data-a="plain" style="margin-top:8px">不交換，直接棄牌</button></div></div>` : '';
  const drawWhy = !myTurn ? `還沒輪到你，現在是 ${name(g.turn)}` : g.stage === 'act' ? '這回合已經抽過牌了' : '';
  const topWhy = drawWhy || (!g.top ? '棄牌堆是空的' : g.top.t !== 'n' && g.top.t !== 'w' ? '跳過牌和特殊牌不能撿' : '');

  const status = g.status !== 'play' ? '' : actSlot !== null ? `放入第 ${actSlot + 1} 組：點下方手牌` : myTurn
    ? (g.stage === 'draw' ? '輪到你了：先從牌堆或棄牌堆抽一張' : '放下階段／接牌，最後棄一張牌')
    : `輪到 ${esc(name(g.turn))}`;

  const sheetUI = sheet && g.status === 'play' ? `<div class="overlay sheet"><div class="bd" data-a="sheet"></div><div class="modal">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">排名 <small>階段高者優先，同階段比分數（低者優先）</small></h2><button class="ghost ic" data-a="sheet" aria-label="關閉">✕</button></div>
    <table>${ranking}</table>
    <h2 style="margin-top:16px">10 個階段</h2><table>${g.phases.map((r, i) => `<tr class="${i + 1 === Math.min(mine.phase, 10) ? 'me' : ''}"><td>${i + 1}</td><td>${r.map(lab).join(' ＋ ')}</td></tr>`).join('')}</table>
    <h2 style="margin-top:16px">最近動態</h2><div class="log">${g.log.map(esc).join('<br>')}</div>
    <button class="ghost" data-a="leave" style="width:100%;margin-top:16px">離開房間</button></div></div>` : '';

  // 只有還在場的人可看（離開／加賽淘汰者沒有東西可看；面板開著時對方離開 → 自動關）。最新一手排最上面：重繪會把捲動位置歸零，最新的要永遠看得到
  const hp = g.players.find((p) => p.id === histFor && p.in), who = hp && (hp.id === me ? '你' : esc(hp.name) + ' ');
  const histUI = hp ? `<div class="overlay sheet"><div class="bd" data-a="hist"></div><div class="modal" role="dialog" aria-label="${who}本回合的撿棄牌">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0;color:var(--ink)">${who}本回合的撿棄牌</h2><button class="ghost ic" data-a="hist" aria-label="關閉">✕</button></div>
    ${hp.hist.length ? hp.hist.map((h, i) => `<div class="pick" style="font-size:var(--s2);margin-top:12px"><span class="mute">${i + 1}.</span>${h.from === 'pile' ? '🂠 抽牌堆' : `♻ 撿棄牌 ${card(h.card, { tag: 'span', cls: 'sm' })}`}<span>→</span>${h.disc ? `棄 ${card(h.disc, { tag: 'span', cls: 'sm' })}` : '<span class="mute">出牌中…</span>'}</div>`).reverse().join('') : `<p class="mute">${who}還沒出過牌。輪到之後，這裡會列出每一手撿了或抽了什麼、棄了哪張。</p>`}</div></div>` : '';

  return `<div class="row"><b style="flex:1;min-width:0">${s.code} · 第 ${g.round} 回合${g.playoff ? '（加賽）' : ''}</b>
    <span class="mute" style="white-space:nowrap">${g.rules.rv ? `<span title="${g.dir < 0 ? '反向' : '順向'}" aria-label="${g.dir < 0 ? '反向' : '順向'}">${g.dir < 0 ? '⟲' : '⟳'}</span> ` : ''}目標 ${g.target}</span><b class="cd" aria-live="off"></b>
    <span class="rxw"><button class="ghost ic" data-a="rxMenu" aria-label="送表情" aria-expanded="${rxOpen}">😀</button>${rxOpen ? `<div class="rxp">${EMOJI.map((e) => `<button data-a="react" data-v="${e}" aria-label="${e}">${e}</button>`).join('')}</div>` : ''}</span>
    <button class="ghost ic" data-a="sheet" aria-label="排名、階段表、動態">📋</button></div>
  <div class="row players">${players}</div>
  <div class="panel table">
    <div class="piles">
      <div class="pile" data-why="${esc(drawWhy)}"><button class="card back" aria-label="抽牌堆" data-a="draw" data-v="pile" ${drawWhy ? 'disabled' : ''}><b>抽牌</b></button><br>牌堆 ${g.drawCount}</div>
      <div class="pile" data-why="${esc(topWhy)}">${g.top ? card(g.top, { attrs: `data-a="draw" data-v="discard" ${topWhy ? 'disabled' : ''}` }) : '<div class="card empty"></div>'}<br>棄牌</div>
    </div>
    <div class="groups">${groups || '<span class="mute">還沒有人放下階段</span>'}</div>
  </div>
  <div class="panel">
    <h2>你的階段 ${mine.phase}：${req.map(lab).join(' ＋ ')} ${mine.laid ? '✅ 已完成' : ''}</h2>
    ${layUI}
  </div>
  ${g.status !== 'play' ? overlay(g, s) : `<div class="tray"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${status}</b><button class="ghost" data-a="sort" aria-label="切換手牌排序">排序：${byColor ? '顏色' : '數字'}</button></div>
    <div class="hand">${free.map((c) => card(c, { cls: `${sel.has(c.id) || c.id === xs.give ? 'sel' : ''} ${c.id === seen.drawn ? 'new' : ''} ${fresh.includes(c.id) ? 'pop' : ''}`, attrs: `data-a="card" data-v="${c.id}"` })).join('')}</div>
    ${layBtn + discard && `<div class="row act">${layBtn}${discard}</div>`}</div>`}${swapUI}${sheetUI}${histUI}`; // 手牌＋棄牌固定在螢幕底部（拇指區），其餘在上方捲動；排名／階段表／動態收進 📋 面板
}

// 結算：依「我贏／別人贏」給不同開場；每人顯示剩下的牌，讓「+N 分」看得出來源；按鈕固定在 modal 底部
function overlay(g, s) {
  const sm = g.summary, over = g.status === 'over', me = s.me, host = me === s.host;
  const nm = (id) => esc(g.players.find((p) => p.id === id).name);
  const head = over
    ? (g.winners.includes(me) ? '<span class="trophy">🏆</span> 你贏了！' : `🏆 ${g.winners.map(nm).join('、')} 獲勝`)
    : (sm.out === me ? '🎉 你先出完牌！' : `${nm(sm.out)} 出完牌了`);
  const rows = sm.rows.map((r) => `<div class="res ${r.id === me ? 'me' : ''}">
    <div class="row" style="justify-content:space-between"><b>${esc(r.name)}${r.id === me ? '（你）' : ''}</b><span>階段 ${r.phase} ${r.laid ? '✅' : '❌'} · <b>${r.gain >= 0 ? '+' : '−'}${Math.abs(r.gain)}</b>${r.first ? ' 🥇先放下 −10' : ''} → ${r.score} 分</span></div>
    ${r.hand.length ? `<div class="row" style="margin-top:8px;gap:4px">${r.hand.map((c) => card(c, { tag: 'span', cls: 'sm' })).join('')}</div>` : ''}</div>`).join('');
  // 結束時改顯示總分排行榜：獲勝者排第一（勝負不一定等於總分最低），其餘依總分低者優先；同條件並列同名次，前三名頒獎牌
  const cmp = (a, b) => g.winners.includes(b.id) - g.winners.includes(a.id) || a.score - b.score;
  const sorted = over ? g.players.filter((p) => !p.left).sort(cmp) : [];
  const board = sorted.map((p) => { const r = sorted.findIndex((q) => !cmp(q, p));
    return `<div class="res rk ${p.id === me ? 'me' : ''}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b><span style="display:inline-block;min-width:2em">${['🥇', '🥈', '🥉'][r] ?? r + 1}</span>${esc(p.name)}${p.id === me ? '（你）' : ''}</b><b>${p.score} 分</b></div></div>`; }).join('');
  const foot = over
    ? (host ? '<button data-a="back">回到房間再來一局</button><button class="ghost" data-a="leave">離開房間</button>' :`<span class="mute">等 ${nm(s.host)} 開新局…</span><button class="ghost" data-a="leave">離開房間</button>`)
    : '<button data-a="next">下一回合</button>';
  return `<div class="overlay"><div class="modal res-m"><div class="body">
    <div class="hd">${head}</div>${over && !g.winners.includes(me) ? '<div class="mute">差一點，再來一局！</div>' : ''}
    ${over ? board : rows}${sm.note ? `<p>${esc(sm.note)}</p>` : ''}</div>
    <div class="row act foot">${foot}</div></div></div>`;
}

// 富士流：牌面只有數字，越大越紅
const fcard = (c, o = {}) => `<${o.tag || 'button'} class="card F ${o.cls || ''}" style="--h:${Math.round(210 + (c.n - 2) * 140 / 18)}${o.style ? `;${o.style}` : ''}" aria-label="${o.label || c.n}" ${o.attrs || ''}><b>${c.n}</b></${o.tag || 'button'}>`;
function fuji() {
  const s = snap, g = s.game, me = s.me, myTurn = g.turn === me;
  const name = (id) => g.players.find((p) => p.id === id)?.name ?? '?', nm = (id) => (id === me ? '你' : esc(name(id)));
  const online = Object.fromEntries(s.players.map((p) => [p.id, p.online]));
  if (g.status !== 'play') sheet = false;
  const ids = new Set(g.hand.map((c) => c.id));
  sel.forEach((id) => ids.has(id) || sel.delete(id));
  // 新事件（第一次 render／重連只記錄不重播）：我的牌被沖走 = 這場的小高潮（橫幅＋震動）；流走只輕輕提示
  seen ??= {};
  const ev = g.ev, fresh = !!ev && seen.evNo !== undefined && ev.no !== seen.evNo;
  if (fresh) {
    const out = ev.out.find((o) => o.id === me), gone = ev.gone.find((x) => x.id === me);
    if (out) { skipBanner(`💦 你的 ${out.n} 被 ${nm(ev.by)} 沖走了<div class="mute" style="margin-top:8px;font-size:var(--s2)">補抽 1 張</div>`); navigator.vibrate?.([60, 40, 60]); }
    else if (gone) { toast(`🌊 你的 ${gone.n} 順水流走`); navigator.vibrate?.(30); }
  }
  seen.evNo = ev ? ev.no : null;
  const hand = [...g.hand].sort((a, b) => a.n - b.n), one = hand.find((c) => sel.has(c.id));
  // 選牌預覽：只用桌上公開的牌，規則同 fuji.js act()（同盟合計嚴格大於才沖走；輪到自己時自己面前的牌已流走，排除自己）
  const mates = one ? g.players.filter((p) => p.id !== me && p.card?.n === one.n) : [], total = one ? one.n * (mates.length + 1) : 0;
  const wash = new Set(one ? g.players.filter((p) => p.id !== me && p.card && p.card.n !== one.n && p.sum < total).map((p) => p.id) : []);

  // 圓桌幾何：把自己固定在下方（6 點鐘方向），其餘依順位順時針排列；牌落在內圈（桌面中央）
  const N = g.players.length, myIdx = Math.max(0, g.players.findIndex((p) => p.id === me));
  const ring = Array.from({ length: N }, (_, k) => g.players[(myIdx + k) % N]);
  const [Rx, Ry, rx, ry] = N <= 4 ? [39, 42.5, 18.5, 18.5] : N <= 6 ? [39.5, 43, 20, 20] : [40.5, 43.5, 21.5, 22];
  const density = N >= 7 ? 'dense' : N >= 5 ? 'mid' : '';
  const pos = ring.map((p, k) => {
    const a = Math.PI / 2 + (2 * Math.PI * k) / N, ca = Math.cos(a), sa = Math.sin(a);
    return { p, k, a, ca, sa, sx: 50 + Rx * ca, sy: 50 + Ry * sa, cx: 50 + rx * ca, cy: 50 + ry * sa };
  });
  const turnPos = pos.find((x) => x.p.id === g.turn);
  const turnDeg = turnPos ? (turnPos.a * 180 / Math.PI) + 90 : 180;

  // SVG 桌面視覺：順時針軌道箭頭、目前出牌者聚光扇形、同盟連線（含選牌預覽連線）
  const arrows = pos.map(({ a }) => {
    const mid = a + Math.PI / N, ax = 50 + 35.5 * Math.cos(mid), ay = 50 + 35.5 * Math.sin(mid), deg = (mid * 180 / Math.PI) + 90;
    return `<path d="M-1.5 -1.1 L1.5 0 L-1.5 1.1" fill="none" stroke="#cfe3d855" stroke-width=".65" stroke-linecap="round" stroke-linejoin="round" transform="translate(${ax.toFixed(1)} ${ay.toFixed(1)}) rotate(${deg.toFixed(1)})"/>`;
  }).join('');
  let spotlight = '';
  if (turnPos && g.status === 'play') {
    const sp = Math.min(0.34, (Math.PI / N) * 0.72), a1 = turnPos.a - sp, a2 = turnPos.a + sp;
    const x1 = (50 + 39 * Math.cos(a1)).toFixed(1), y1 = (50 + 39 * Math.sin(a1)).toFixed(1);
    const x2 = (50 + 39 * Math.cos(a2)).toFixed(1), y2 = (50 + 39 * Math.sin(a2)).toFixed(1);
    spotlight = `<path d="M50 50 L${x1} ${y1} A39 39 0 0 1 ${x2} ${y2} Z" fill="url(#fspot)"/>`;
  }

    const pips = M_PRICES.map((pr, idx) => `<span class="m-pip ${idx <= m.idx ? 'on' : ''} ${idx === 4 ? 'end' : ''}"></span>`).join('');
    return `<button class="m-good ${hot ? 'hot' : ''}" style="--gc:${info.color}" data-a="mInfoSheet" aria-label="${info.name}黑市 $${m.price}，剩 ${g.supply[k]} 股">
      <div class="m-good-row">${mGoodImg(k)}<div class="m-good-val"><span class="m-good-p">$${m.price}</span><span class="m-good-sub">${info.name}·${g.supply[k]}</span></div></div>
      <div class="m-pips" aria-hidden="true">${pips}</div></button>`;
  }).join('')}</div>`;

  // 橫向單排玩家條（手機左右滑動不換行，點任意玩家看完整帳本）
  const players = `<div class="m-players" aria-label="玩家資訊">${g.players.map((p) => {
    const isMe = p.id === me, isTurn = g.status === 'play' && g.turn === p.id, isMaster = g.master === p.id;
    const mort = p.mortgagedCount ? ` 🔒${p.mortgagedCount}` : '';
    const bidTag = g.stage === 'bid' && g.auction ? (g.auction.leader === p.id ? `<span class="m-tag" style="--gc:var(--accent)">標$${g.auction.high}</span>` : g.auction.passed.includes(p.id) ? '<span class="mute">PASS</span>' : '') : '';
    const buyDot = p.bought.length ? `<span class="m-tag" title="公開購入 ${p.bought.length} 股">+${p.bought.length}股</span>` : '';
    return `<button class="m-pl ${isMe ? 'me' : ''} ${isTurn ? 'turn' : ''} ${p.in ? '' : 'out'}" data-pid="${p.id}" data-a="mInfoSheet">
      <div class="m-pl-top">${mMeeple(p, true)}<span class="m-pl-nm">${esc(p.name)}${isMe ? '(你)' : ''}</span>${isMaster ? '<span title="船老大">⚓</span>' : ''}${online[p.id] ? '' : '<span>💤</span>'}</div>
      <div class="m-pl-row"><b>${mCoin(13)} $${p.cash}</b><span>×${p.workers}人 · 📜${p.stockCount}${mort}</span></div>
      ${bidTag || buyDot ? `<div class="row" style="gap:4px;margin-top:3px">${bidTag}${buyDot}</div>` : ''}</button>`;
  }).join('')}</div>`;

  const canPlace = myTurn && g.stage === 'place' && mine.workers > 0;
  const spotAttrs = (spot, cost, open, extraCls = '') => {
    if (!open) return { cls: `occ ${extraCls}`, attrs: '' };
    if (!canPlace) return { cls: extraCls, attrs: '' };
    if (mine.cash < cost) return { cls: `locked ${extraCls}`, attrs: `data-why="現金不足，需要 $${cost}（可點下方「我的股票」先抵押換 $12）"` };
    const isSel = ms.spot === spot;
    return { cls: `open ${isSel ? 'sel' : ''} ${extraCls}`, attrs: `data-a="mSpot" data-v="${spot}" role="button" tabindex="0" aria-pressed="${isSel}"` };
  };
  const occBadge = (pid) => { const op = pById[pid]; return `<span class="row" style="gap:4px;flex-wrap:nowrap;justify-content:center;min-width:0">${mMeeple(op, true)}<b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72px">${esc(op.name)}</b></span>`; };

  // 三條直向馬尼拉航道（里程碑圓牌 0/5/10/☠13/⚓ + 中間細緻黃銅點，清爽零重疊）
  const dieByShip = Object.fromEntries((g.lastRoll?.dice || []).map((x) => [x.ship, x]));
  const nodePct = (n) => 6 + (n / 14) * 88;
  const milestones = new Set([0, 5, 10, 13, 14]);
  const lanesHTML = [0, 1, 2].map((si) => {
    const sh = g.ships[si];
    const basePos = sh ? (ms.animFrom && ms.animFrom[si] !== undefined ? ms.animFrom[si] : sh.pos) : -1;
    const navD = sh && (g.stage === 'nav_small' || g.stage === 'nav_big') && myTurn ? (ms.navMoves[si] || 0) : 0;
    const shownPos = sh ? (basePos >= 14 ? 14 : Math.max(0, Math.min(13, basePos + navD))) : -1;
    const nodes = Array.from({ length: 15 }, (_, c) => {
      const passed = sh && c < shownPos;
      if (!milestones.has(c)) return `<div class="m-dot ${passed ? 'passed' : ''}" style="bottom:${nodePct(c).toFixed(1)}%"></div>`;
      const cls = [c === 5 ? 'n5' : '', c === 13 ? 'n13' : '', c === 14 ? 'n14' : '', passed ? 'passed' : ''].filter(Boolean).join(' ');
      const txt = c === 14 ? '⚓港' : c === 13 ? '☠13' : c;
      return `<div class="m-node ${cls}" style="bottom:${nodePct(c).toFixed(1)}%">${txt}</div>`;
    }).join('');
    let boatHTML = '';
    if (sh) {
      const info = M_INFO[sh.good], arrived = shownPos >= 14, at13 = shownPos === 13, die = dieByShip[si];
      const nextCost = info.slots[sh.crew.length];
      const canTapBoat = canPlace && sh.pos < 14 && nextCost != null && mine.cash >= nextCost;
      const isBoatSel = ms.spot === `ship:${si}`;
      const crewPawns = sh.crew.map((oid) => mMeeple(pById[oid], true)).join('');
      const dieBadge = !ms.animFrom && die && !die.alreadyIn ? `<div class="m-boat-die">${mDie(die.d, info.color, 24)}</div>` : '';
      const posTxt = arrived ? '⚓ 進港' : at13 ? '☠ 13格' : `格 ${shownPos}${navD ? `(${navD > 0 ? `+${navD}` : navD})` : ''}`;
      const sailFrom = ms.sailAnim && ms.sailAnim[si] !== undefined && ms.sailAnim[si] !== shownPos ? ms.sailAnim[si] : null;
      const sailStyle = sailFrom !== null ? `;--from-b:${nodePct(sailFrom).toFixed(1)}%;--to-b:${nodePct(shownPos).toFixed(1)}%` : '';
      boatHTML = `<div class="m-boat ${sailFrom !== null ? 'sailing' : ''} ${canTapBoat ? 'can' : ''} ${isBoatSel ? 'sel' : ''} ${arrived ? 'arrived' : at13 ? 'danger' : ''}" style="bottom:${nodePct(shownPos).toFixed(1)}%${sailStyle}" ${canTapBoat ? `data-a="mSpot" data-v="ship:${si}" role="button" tabindex="0"` : ''}>
        ${mBoatSvg(info.color)}
        <img class="m-boat-cargo" src="${info.img}" alt="${info.name}">
        <div class="m-boat-crew">${crewPawns}</div>
        ${dieBadge}
        <span class="m-boat-pos">${posTxt}</span>
      </div>`;
    }
    return `<div class="m-lane"><div class="m-launch-zone"></div><div class="m-lane-line"></div>${nodes}${boatHTML}</div>`;
  }).join('');

  // 全寬水平船隻登船條（每船一列，手下名字完整顯示、觸控目標 >= 42px）
  const shipRowsHTML = g.ships.length ? `<div class="m-ship-rows">${g.ships.map((sh, si) => {
    const info = M_INFO[sh.good], arrived = sh.pos >= 14, at13 = sh.pos === 13, nextIdx = sh.crew.length;
    const stTxt = arrived ? '⚓ 已進港' : at13 ? '☠ 13 格警戒' : `第 ${sh.pos} / 13 格`;
    const slotsHTML = info.slots.map((cost, ki) => {
      const ownerId = sh.crew[ki];
      if (ownerId) {
        const op = pById[ownerId];
        return `<div class="m-slot occ">${mMeeple(op, true)}<span class="snm">${esc(op.name)}</span></div>`;
      }
      if (ki === nextIdx && !arrived) {
        const a = spotAttrs(`ship:${si}`, cost, true);
        return `<button class="m-slot ${a.cls}" ${a.attrs}>+$${cost}</button>`;
      }
      return `<div class="m-slot locked">$${cost}</div>`;
    }).join('');
    return `<div class="m-srow ${arrived ? 'arrived' : at13 ? 'danger' : ''}" style="--gc:${info.color}">
      <div class="m-srow-h">
        <div class="m-srow-id">${mGoodImg(sh.good, 'md')}<div><b>${info.name}船</b><small>進港平分 $${info.payout}</small></div></div>
        <span class="m-srow-st">${stTxt}</span>
      </div>
      <div class="m-crew-row" style="--cols:${info.slots.length}">${slotsHTML}</div></div>`;
  }).join('')}</div>` : '';

  // 港口 A/B/C（3 欄寬敞卡片）
  const harborCards = M_HARBOR.map((h, i) => {
    const occ = g.board.harbor[i], a = spotAttrs(`harbor:${i}`, h.cost, !occ);
    return `<button class="m-zcard ${a.cls}" ${a.attrs}><b>港 ${h.label}</b><small>≥${h.need} 船得 $${h.reward}</small>${occ ? occBadge(occ) : `<span class="m-price">$${h.cost}</span>`}</button>`;
  }).join('');

  // 修船廠 A/B/C（3 欄寬敞卡片）
  const shipyardCards = M_SHIPYARD.map((y, i) => {
    const occ = g.board.shipyard[i], a = spotAttrs(`shipyard:${i}`, y.cost, !occ);
    return `<button class="m-zcard ${a.cls}" ${a.attrs}><b>修 ${y.label}</b><small>≥${y.need} 船得 $${y.reward}</small>${occ ? occBadge(occ) : `<span class="m-price">$${y.cost}</span>`}</button>`;
  }).join('');

  // 海盜兩格（2 欄大卡）
  const p0 = g.board.pirates[0], p1 = g.board.pirates[1];
  const p0A = spotAttrs('pirate', 5, !p0), p1A = spotAttrs('pirate', 5, !!p0 && !p1);
  const pirateCards = `
    <button class="m-zcard ${p0A.cls}" ${p0A.attrs}><b>海盜船長</b><small>優先登船與決定去向</small>${p0 ? occBadge(p0) : '<span class="m-price">$5</span>'}</button>
    <button class="m-zcard ${p1A.cls}" ${p1A.attrs}><b>海盜船員</b><small>${p0 ? '共同掠奪平分利潤' : '需先有人當船長'}</small>${p1 ? occBadge(p1) : '<span class="m-price">$5</span>'}</button>`;

  // 領航員兩格（2 欄大卡）
  const ns = g.board.navSmall, nb = g.board.navBig;
  const nsA = spotAttrs('nav_small', 2, !ns), nbA = spotAttrs('nav_big', 5, !nb);
  const navCards = `
    <button class="m-zcard ${nsA.cls}" ${nsA.attrs}><b>小領航員</b><small>第 3 輪前調船 ±1 格</small>${ns ? occBadge(ns) : '<span class="m-price">$2</span>'}</button>
    <button class="m-zcard ${nbA.cls}" ${nbA.attrs}><b>大領航員</b><small>第 3 輪前調船 ±2 格</small>${nb ? occBadge(nb) : '<span class="m-price">$5</span>'}</button>`;

  // 保險辦事處（全寬橫幅）
  const ins = g.board.insurance, insA = spotAttrs('insurance', 0, !ins, !ins && canPlace ? 'ins-box ins-open' : 'ins-box');
  const insCard = `<button class="m-zcard row ${insA.cls}" ${insA.attrs}><span><b>🛡️ 保險辦事處</b><br><small>立刻領 +$10；若有船進修船廠須代付賠償</small></span>${ins ? occBadge(ins) : '<span class="m-price" style="color:#116b38">+$10</span>'}</button>`;

  // 船老大階段：把三大特權工作台放在主畫面捲動區，不擠爆底部固定托盤！
  let masterDeskHTML = '';
  if (myTurn && g.stage === 'master') {
    const chosen = ms.masterGoods;
    const sum = chosen.reduce((a, k) => a + (ms.masterPos[k] ?? 0), 0);
    const buyBar = g.masterBought
      ? '<div class="mute" style="font-size:var(--s1);margin-bottom:10px">✅ 本航程已行使購股特權（限買 1 張）</div>'
      : `<div style="margin-bottom:12px"><div class="mute" style="font-size:var(--s1);margin-bottom:6px">① 特權：可買 1 張股票（依黑市價，最低 $5，可略過）</div>
        <div class="m-chips">${M_GOODS.map((k) => {
          const info = M_INFO[k], price = g.market[k].buy, avail = g.supply[k] > 0, ok = avail && mine.cash >= price;
          const why = !avail ? '已售完' : !ok ? `現金不足 $${price}（可點下方「我的股票」先抵押）` : '';
          return `<span class="w" data-why="${esc(why)}"><button class="m-chip" style="--gc:${info.color};width:100%" data-a="mBuy" data-v="${k}" ${ok ? '' : 'disabled'}><span class="row" style="gap:6px;flex-wrap:nowrap">${mGoodImg(k)}<span>${info.name} <small class="mute">剩${g.supply[k]}</small></span></span><b>$${price}</b></button></span>`;
        }).join('')}</div></div>`;
    const pickGoods = `<div style="margin-bottom:12px"><div class="mute" style="font-size:var(--s1);margin-bottom:6px">② 挑選 3 種貨物裝船（已選 ${chosen.length}/3）</div>
      <div class="m-chips">${M_GOODS.map((k) => {
        const info = M_INFO[k], on = chosen.includes(k);
        return `<button class="m-chip ${on ? 'on' : ''}" style="--gc:${info.color}" data-a="mPickGood" data-v="${k}" aria-pressed="${on}"><span class="row" style="gap:6px;flex-wrap:nowrap">${mGoodImg(k)}<span>${info.name}</span></span><small>${on ? '✓ 裝船' : '未選'}</small></button>`;
      }).join('')}</div></div>`;
    const alloc = chosen.length === 3 ? `<div>
      <div class="row" style="justify-content:space-between;margin-bottom:4px">
        <span class="mute" style="font-size:var(--s1)">③ 分配出發格數（0–5，總和須為 9：<b style="color:${sum === 9 ? '#5ce09e' : 'var(--accent)'}">${sum}/9</b>）</span>
        <span class="row" style="gap:4px"><button class="ghost m-bar-btn" data-a="mPreset" data-v="3,3,3">3-3-3</button><button class="ghost m-bar-btn" data-a="mPreset" data-v="5,3,1">5-3-1</button></span>
      </div>
      ${chosen.map((k) => {
        const info = M_INFO[k], v = ms.masterPos[k] ?? 0;
        return `<div class="m-alloc" style="--gc:${info.color}"><span class="row" style="gap:6px;flex-wrap:nowrap">${mGoodImg(k)}<b>${info.name}</b> <small class="mute">($${info.payout})</small></span>
          <div class="m-step"><button class="ghost" data-a="mPos" data-v="${k}:-1" ${v <= 0 ? 'disabled' : ''}>−</button><b>${v}</b><button class="ghost" data-a="mPos" data-v="${k}:1" ${v >= 5 ? 'disabled' : ''}>+</button></div></div>`;
      }).join('')}</div>` : '';
    masterDeskHTML = `<div class="m-desk"><h2>⚓ 船老大特權工作台</h2>${buyBar}${pickGoods}${alloc}</div>`;
  }

  const boardHTML = `${masterDeskHTML}<div class="m-map-wrap"><div class="m-map" role="region" aria-label="1821 馬尼拉灣古航海圖板">
    <div class="m-bay-box">
      <div class="m-bay-head"><b>⛵ 駛向馬尼拉港</b><span>0–5 起航 · ☠13 海盜 · 骰 ${g.roll}/3</span></div>
      <div class="m-bay">${lanesHTML}${!g.ships.length ? `<div class="m-bay-empty"><span>${g.stage === 'bid' ? '⚓ 競標船老大中，待得標者決定 3 艘貨船啟航…' : myTurn ? '⬆ 請在上方船老大工作台挑選貨物並分配 9 格出發點' : `⚓ 等待船老大 ${esc(nm(g.master))} 裝載貨物與分配起點…`}</span></div>` : ''}</div>
    </div>
    ${shipRowsHTML}
    <div class="m-zones-stack">
      <div class="m-plaque"><div class="m-plaque-h"><b>⚓ 馬尼拉港</b><small>三次擲骰超過 13 格進港</small></div><div class="m-grid3">${harborCards}</div></div>
      <div class="m-plaque"><div class="m-plaque-h"><b>🔧 修船廠</b><small>三次擲骰未過 13 格進入</small></div><div class="m-grid3">${shipyardCards}</div></div>
      <div class="m-plaque dark"><div class="m-plaque-h"><b>🏴‍☠️ 海盜船</b><small>船停 13 格觸發${g.rules.pirateKick ? ' · 可踢人' : ''}</small></div><div class="m-grid2">${pirateCards}</div></div>
      <div class="m-plaque navy"><div class="m-plaque-h"><b>🧭 領航員</b><small>第 3 次擲骰前調整船位</small></div><div class="m-grid2">${navCards}</div></div>
      <div class="wide">${insCard}</div>
    </div>
  </div></div>`;

  // --- 底部精簡拇指操作區 ---
  const mortCnt = g.myStocks.filter((x) => x.mortgaged).length;
  const stockVal = g.myStocks.reduce((a, st) => a + g.market[st.good].price, 0);
  const mortDebt = mortCnt * 15;
  const estTotal = mine.cash + stockVal - mortDebt;
  const myBar = `<div class="m-bar">
    <span>${mCoin(15)} <b>$${mine.cash}</b> · ${mMeeple(mine, true)} <b>×${mine.workers}</b></span>
    <button class="ghost m-bar-btn" data-a="mStockSheet">📜 股票 ${g.myStocks.length}張 · 現值 $${stockVal}${mortCnt ? ` · 🔒${mortCnt}` : ''}</button>
    <b class="cd" aria-live="off"></b>
  </div>`;

  let trayBody = '';
  if (!myTurn) {
    const stageDesc = {
      bid: `競標船老大中（目前最高 ${g.auction?.high ? `$${g.auction.high} · ${esc(nm(g.auction.leader))}` : '尚未出價'}）`,
      master: `等待船老大 ${esc(nm(g.turn))} 買股票與安排出發船隻…`,
      place: `等待 ${esc(nm(g.turn))} 派遣手下…`,
      nav_small: `等待小領航員 ${esc(nm(g.turn))} 調整船位…`,
      nav_big: `等待大領航員 ${esc(nm(g.turn))} 調整船位…`,
      roll: `等待船老大 ${esc(nm(g.turn))} 擲第 ${g.roll + 1}/3 次骰子…`,
      pirate_board: `等待海盜 ${esc(nm(g.turn))} 決定是否登船…`,
      pirate_plunder: `等待海盜 ${esc(nm(g.turn))} 決定掠奪船隻去向…`,
    }[g.stage] || `等待 ${esc(nm(g.turn))} 行動…`;
    trayBody = `<div class="mute" style="text-align:center;padding:6px 0">${stageDesc}</div>`;
  } else if (g.stage === 'bid') {
    const minBid = Math.max(1, (g.auction?.high ?? 0) + 1);
    const amt = Math.max(minBid, ms.bidAmt);
    const canBid = mine.cash >= amt;
    const bidWhy = canBid ? '' : `現金不足 $${amt}（可點上方「我的股票」抵押 +$12）`;
    trayBody = `<div class="row" style="justify-content:space-between;margin-bottom:8px">
      <b class="crown">⚓ 競標船老大</b>
      <small class="mute">${g.auction.high ? `目前最高 $${g.auction.high}（${esc(nm(g.auction.leader))}）` : '最低 1 元起標'}</small></div>
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <div class="m-step">
          <button class="ghost" data-a="mBidStep" data-v="-1" ${amt <= minBid ? 'disabled' : ''}>−1</button>
          <b>$${amt}</b>
          <button class="ghost" data-a="mBidStep" data-v="1">+1</button>
          <button class="ghost" data-a="mBidStep" data-v="3">+3</button>
        </div>
        <small class="mute">現金上限 $${mine.cash}</small>
      </div>
      <div class="row act">
        <button class="ghost" data-a="mPass">PASS 放棄</button>
        <span class="w" data-why="${esc(bidWhy)}"><button data-a="mBid" data-v="${amt}" ${canBid ? '' : 'disabled'}>出價 $${amt}</button></span>
      </div>`;
  } else if (g.stage === 'master') {
    const chosen = ms.masterGoods;
    const sum = chosen.reduce((a, k) => a + (ms.masterPos[k] ?? 0), 0);
    const ready = chosen.length === 3 && sum === 9;
    const sailWhy = chosen.length !== 3 ? '請先在上方挑選 3 種貨物' : sum !== 9 ? `出發格數總和須為 9（目前 ${sum}）` : '';
    trayBody = `<div class="row act"><span class="w" data-why="${esc(sailWhy)}"><button data-a="mSail" ${ready ? '' : 'disabled'}>${ready ? '⚓ 啟航！開始派遣手下' : `請完成上方船老大設定（${chosen.length}/3 貨 · ${sum}/9 格）`}</button></span></div>`;
  } else if (g.stage === 'place') {
    const info = mSpotInfo(g, ms.spot);
    const placeWhy = info ? '' : '請先點擊上方圖板的虛線空位或木船';
    trayBody = `<div style="margin-bottom:8px"><b class="crown">🧍 輪到你派遣手下</b>
      <div class="mute" style="font-size:var(--s1);margin-top:2px">${info ? `已選：<b>${info.label}</b>（${info.gain ? `+$${info.gain}` : `花費 $${info.cost}`} · ${info.note}）` : '點上方船隻、港口、修船廠、海盜、領航員或保險'}</div></div>
      <div class="row act">
        <button class="ghost" data-a="mPassPlace">跳過本次</button>
        <span class="w" data-why="${esc(placeWhy)}"><button data-a="mPlace" ${info ? '' : 'disabled'}>${info ? `確認派遣（${info.gain ? `+$${info.gain}` : `$${info.cost}`}）` : '請選擇位置'}</button></span>
      </div>`;
  } else if (g.stage === 'nav_small' || g.stage === 'nav_big') {
    const budget = g.stage === 'nav_small' ? 1 : 2;
    const spent = Object.values(ms.navMoves).reduce((a, d) => a + Math.abs(d), 0);
    const left = budget - spent;
    const controls = g.ships.map((s, si) => {
      const info = M_INFO[s.good], d = ms.navMoves[si] || 0;
      if (s.pos >= 14) return `<div class="m-alloc" style="--gc:${info.color};opacity:.5"><span class="row" style="gap:6px">${mGoodImg(s.good)}${info.name}船</span><small class="mute">已進港，無法移動</small></div>`;
      const cur = s.pos + d;
      const canMinus = cur > 0 && (d > 0 || left > 0);
      const canPlus = cur < 13 && (d < 0 || left > 0);
      return `<div class="m-alloc" style="--gc:${info.color}"><span class="row" style="gap:6px;flex-wrap:nowrap">${mGoodImg(s.good)}<b>${info.name}</b> <small class="mute">格 ${s.pos}${d ? ` → <b>${cur}</b>` : ''}</small></span>
        <div class="m-step"><button class="ghost" data-a="mNav" data-v="${si}:-1" ${canMinus ? '' : 'disabled'}>−1</button><b>${d > 0 ? `+${d}` : d}</b><button class="ghost" data-a="mNav" data-v="${si}:1" ${canPlus ? '' : 'disabled'}>+1</button></div></div>`;

    trayBody = `<div class="row" style="justify-content:space-between;margin-bottom:6px">

  ${ticker}${mkt}${players}${boardHTML}${tray}${infoSheetUI}${stockSheetUI}${sheetUI}`;
