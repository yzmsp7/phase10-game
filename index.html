<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phase 10 線上</title>
<style>
/* 字級只有 4 級、字重只有 400/600；間距走 4/8 格線。--mute 在 --panel2 上 4.84:1（原 #a8c7b8 只有 3.57） */
:root{--s1:12px;--s2:16px;--s3:20px;--s4:28px;--bg:#0f3d2e;--panel:#165740;--panel2:#1d6a4f;--ink:#f6f3ea;--mute:#cfe3d8;--accent:#f6c945;--R:#d64545;--B:#3b73d4;--G:#2e9e5b;--Y:#e0b020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--s2)/1.4 system-ui,-apple-system,"Noto Sans TC",sans-serif;touch-action:manipulation;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#app:has(.tray){padding-bottom:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column} /* 內容不滿一屏時，sticky 托盤會浮在半空 → 撐滿一屏，用 margin-top:auto 把托盤推到最底 */
#app{max-width:1000px;margin:0 auto;padding:12px 16px 40px}
h1{margin:8px 0 16px;font-size:var(--s4);letter-spacing:.5px}h2{font-size:var(--s2);margin:0 0 8px;color:var(--mute);font-weight:600}
.panel{background:var(--panel);border-radius:12px;padding:16px;margin-bottom:12px}
b{font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;border-radius:8px;border:0;padding:8px 16px}
button{background:var(--accent);color:#2a2200;font-weight:600;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed;pointer-events:none} /* 點擊穿透到外層 [data-why]，用 toast 說明為什麼不能按 */
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--mute)}
input,select{font-size:16px;background:#0c2f23;color:var(--ink);border:1px solid #2f7d5f} /* iOS 對 <16px 的輸入框聚焦會自動放大整頁 */
button,.card{-webkit-user-select:none;user-select:none}
.mute{color:var(--mute)}.big{font-size:var(--s4);letter-spacing:6px;font-weight:600}
.player{background:var(--panel2);border-radius:10px;padding:8px 12px;min-width:120px;flex:1;border:2px solid transparent}
.player.turn{border-color:var(--accent)}.player.out{opacity:.4}
.pick{margin-top:4px;font-size:var(--s1);display:flex;align-items:center;gap:8px}.pick .card{box-shadow:none}
.player b{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player small{color:var(--mute)}
.cnt{font-size:var(--s3);font-weight:600;margin-right:4px}
.table{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.piles{display:flex;gap:12px}
.pile{text-align:center;font-size:var(--s1);color:var(--mute)}
.groups{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:220px}
.group{position:relative;background:var(--panel2);border-radius:10px;padding:8px}
.group.can{outline:2px dashed var(--accent);cursor:pointer}
.ends{position:absolute;inset:0;display:flex;gap:4px;padding:4px;background:#0c2f23d9;border-radius:10px}.ends button{flex:1}
.group .row{gap:4px}.group small{display:block;color:var(--mute);margin-bottom:4px}
.card{position:relative;width:46px;height:64px;border-radius:7px;border:2px solid #fff;color:#fff;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-weight:600;box-shadow:0 1px 3px #0006;flex:none}
.card b{font-size:var(--s3);line-height:1}.card i{font-style:normal;font-size:var(--s1);opacity:.9}
.card u{position:absolute;bottom:1px;right:3px;font-size:var(--s1);text-decoration:none}
.card.sm{width:34px;height:48px}.card.sm b{font-size:var(--s2)}
.card.R{background:var(--R)}.card.B{background:var(--B)}.card.G{background:var(--G)}.card.Y{background:var(--Y);color:#2a2200}
.card.W{background:conic-gradient(var(--R),var(--Y),var(--G),var(--B),var(--R))}.card.W b,.card.W i,.card.W u{text-shadow:0 0 4px #000,0 0 2px #000}
.card.S{background:#222}.card.back{background:repeating-linear-gradient(45deg,#7b2d8f,#7b2d8f 6px,#5d2070 6px,#5d2070 12px)}
.card.new{outline:3px solid #fff;box-shadow:0 0 12px 3px var(--accent)}
.card.new::after{content:'新';position:absolute;top:-8px;left:-8px;background:var(--accent);color:#2a2200;font-size:var(--s1);line-height:16px;border-radius:8px;padding:0 8px}
.card.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateY(-110px) scale(.4) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.card.sel{transform:translateY(-12px);outline:3px solid var(--accent)}
.card.empty{background:transparent;border:2px dashed var(--mute);color:var(--mute);box-shadow:none}
.hand{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0 4px}
.tray{position:sticky;bottom:0;z-index:2;margin:auto -16px 0;padding:8px 16px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid #2f7d5f;box-shadow:0 -8px 16px #0a2a1f99}
.tray>b{display:block}.tray .hand{padding:12px 0 8px}
.act button{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px}
.players{margin:12px 0}.ic{min-width:44px;min-height:44px;padding:0}
.slot.can{outline:2px dashed var(--accent);cursor:pointer}
.pile .card{width:56px;height:80px}.pile .card b{font-size:var(--s3)}
@keyframes glow{to{box-shadow:0 0 0 3px var(--accent),0 0 16px 4px var(--accent)}}
.pile button.card:not(:disabled){animation:glow 1s ease-in-out infinite alternate}
.overlay.sheet{align-items:flex-end;padding:0}.sheet .modal{border-radius:16px 16px 0 0;max-height:80vh;max-height:80dvh}.modal .log{max-height:none}
.bd{position:absolute;inset:0}.act .w{flex:1;display:flex}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.slot{background:#0c2f23;border-radius:8px;padding:8px;margin-top:8px}
.slotH{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.slot .row{min-height:48px}
.log{font-size:var(--s1);color:var(--mute);max-height:90px;overflow:auto}
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal{background:var(--panel);border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:90vh;max-height:90dvh;overflow:auto;position:relative}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left}th{color:var(--mute);font-weight:600}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#000d;padding:8px 16px;border-radius:10px;z-index:9;display:none}
tr.me{color:var(--accent);font-weight:600}h2 small{font-weight:400}
.crown{color:var(--accent)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:#777}.dot.on{background:#5fe08a}
@media(max-width:600px){
#app{padding:8px 8px 32px}.panel{padding:12px}h1{font-size:var(--s3)}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}.player{min-width:0;padding:8px}
.piles{width:100%;justify-content:center}.groups{min-width:0;width:100%}
.hand{gap:4px}.card{width:40px;height:56px}.card.sm{width:32px;height:46px}
button,select,input{min-height:40px}
.tray{margin:auto -8px 0;padding:8px 8px calc(12px + env(safe-area-inset-bottom))}
.slotH{flex-wrap:wrap}.big{letter-spacing:4px}
input[readonly]{width:100%}
}
/* 橫放手機高度只有 ~375px：手牌改單排橫捲，按鈕縮矮，托盤才不會吃掉半個畫面 */
@media(max-height:500px){.tray .hand{flex-wrap:nowrap;overflow-x:auto}.act button{min-height:40px}}
/* 結算畫面：按鈕固定在 modal 底部（玩家多、剩牌多時中間捲動，按鈕仍在拇指區） */
.modal.res-m{display:flex;flex-direction:column;overflow:hidden}.res-m .body{overflow:auto;flex:1;min-height:0}.res-m .foot{padding-top:16px}
.res{background:var(--panel2);border-radius:10px;padding:12px;margin-top:8px}.res.me{outline:2px solid var(--accent)}
.hd{font-size:var(--s4);font-weight:600;margin-bottom:8px}
.trophy{display:inline-block;animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SYM = { R: '●', B: '■', G: '▲', Y: '◆' }, CN = { R: '紅', B: '藍', G: '綠', Y: '黃' };
const lab = ([t, n]) => (t === 'set' ? `${n} 張同數字` : t === 'run' ? `${n} 張連續順子` : `${n} 張同顏色`);
const store = {
  get() { try { return JSON.parse(localStorage.getItem('p10') || 'null'); } catch { return null; } },
  set(v) { try { v ? localStorage.setItem('p10', JSON.stringify(v)) : localStorage.removeItem('p10'); } catch {} },
};
const urlRoom = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
let sess = store.get(), snap = null, es = null, sel = new Set(), slots = {}, seen = null, sheet = false, endFor = null, actSlot = null; // 每次 render 會重建 DOM，UI 狀態要存在這：sheet = 底部資訊面板開著；endFor = 正在選「接前/接後」的順子；actSlot = 放階段時作用中的那一組
if (sess && urlRoom && sess.code !== urlRoom) sess = null; // 邀請連結指向另一間房 → 先顯示加入畫面

function toast(m) {
  const t = $('#toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 2800);
}
async function post(name, data = {}) {
  const r = await fetch('/api/' + name, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '發生錯誤');
  return j;
}
const call = (name, data) => post(name, { ...sess, ...data }).catch((e) => toast(e.message));

function connect() {
  es?.close();
  es = new EventSource(`/api/events?code=${sess.code}&token=${sess.token}`);
  // 房主正在開 <select>（iOS 滾輪）時不重繪，否則 innerHTML 重建會把選單關掉；focusout 時再補畫
  es.onmessage = (e) => { snap = JSON.parse(e.data); if (!document.activeElement?.matches?.('select')) render(); };
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) { toast('連線中斷或房間已過期'); exit(); } };
}
// 手機切去別的 App 再回來，iOS 的 EventSource 常常是死的 → 回前景一律重連
document.addEventListener('visibilitychange', () => { if (!document.hidden && sess) connect(); });
function exit() {
  es?.close(); sess = snap = null; sel.clear(); slots = {}; store.set(null);
  history.replaceState(null, '', '/'); render();
}
function enter(r) {
  sess = r; store.set(r); history.replaceState(null, '', '/?room=' + r.code); connect();
}

const phaseReq = () => snap.game.phases[snap.game.players.find((p) => p.id === snap.me).phase - 1];
const card = (c, o = {}) => {
  const cls = c.t === 'n' ? c.c : c.t === 'w' ? 'W' : 'S';
  const face = c.t === 'n' ? c.n : c.t === 'w' ? 'W' : '⊘';
  const sym = c.t === 'n' ? SYM[c.c] : c.t === 'w' ? '★' : 'SKIP';
  const name = c.t === 'n' ? `${CN[c.c]}${c.n}` : c.t === 'w' ? '百搭' : '跳過';
  return `<${o.tag || 'button'} class="card ${cls} ${o.cls || ''}" aria-label="${name}" ${o.attrs || ''}><b>${face}</b><i>${sym}</i>${o.sub ? `<u>${o.sub}</u>` : ''}</${o.tag || 'button'}>`;
};

function lobby() {
  return `<h1>🃏 Phase 10 線上</h1>
  <div class="panel"><h2>你的名字</h2><input id="name" maxlength="12" placeholder="最多 12 字" value="${esc(localStorage.getItem('p10name') || '')}"></div>
  ${urlRoom ? '' : `<div class="panel"><h2>開新房間</h2><button data-a="create">建立房間</button></div>`}
  <div class="panel"><h2>${urlRoom ? '你被邀請加入房間' : '加入房間'}</h2>
    <div class="row"><input id="code" maxlength="4" size="6" placeholder="房間代碼" value="${esc(urlRoom)}" style="text-transform:uppercase" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false"><button data-a="join">加入</button>
    ${urlRoom ? '<button class="ghost" data-a="home">改為開新房間</button>' : ''}</div></div>
  <p class="mute">2–6 人。建立房間後把邀請連結傳給朋友即可。</p>`;
}

function room() {
  const s = snap, host = s.me === s.host, n = s.players.length, st = s.settings;
  const link = `${location.origin}/?room=${s.code}`;
  const set = host
    ? `<div class="row"><select data-c="target">${[...Array(10)].map((_, i) => `<option value="${i + 1}" ${st.target === i + 1 ? 'selected' : ''}>目標：第 ${i + 1} 階段</option>`).join('')}</select></div>`
    : `<div>先完成第 ${st.target} 階段者結束遊戲</div>`;
  return `<h1>房間 <span class="big">${s.code}</span></h1>
  <div class="panel"><h2>邀請朋友</h2><div class="row"><input readonly value="${esc(link)}" size="34" onfocus="this.select()"><button data-a="copy">${navigator.share ? '分享邀請' : '複製連結'}</button></div></div>
  <div class="panel"><h2>玩家（${n}/6）</h2>
    ${s.players.map((p) => `<div><span class="dot ${p.online ? 'on' : ''}"></span>${esc(p.name)} ${p.id === s.host ? '<span class="crown">👑 房主</span>' : ''} ${p.id === s.me ? '<span class="mute">（你）</span>' : ''}</div>`).join('')}</div>
  <div class="panel"><h2>規則</h2>${set}
    <p class="mute">每人發 10 張牌。只有完成當前階段的人，下一回合才能進下一階段；沒完成就繼續挑戰同一階段。有人完成目標階段後，該回合結束時比總分（低者勝）。</p></div>
  <div class="row">${host ? `<button data-a="start" ${n < 2 ? 'disabled' : ''}>開始遊戲</button>${n < 2 ? '<span class="mute">至少需要 2 人</span>' : ''}` : '<span class="mute">等待房主開始…</span>'}
  <button class="ghost" data-a="leave">離開房間</button></div>`;
}

function game() {
  const s = snap, g = s.game, me = s.me, mine = g.players.find((p) => p.id === me);
  const myTurn = g.turn === me, canAct = myTurn && g.stage === 'act';
  const laying = g.status === 'play' && mine.in && !mine.laid;
  if (!laying) actSlot = null;
  if (g.status !== 'play') sheet = false; // 結算畫面出現時收起 📋 面板，免得下一回合自己彈出來
  const online = Object.fromEntries(s.players.map((p) => [p.id, p.online]));
  const ids = new Set(g.hand.map((c) => c.id));
  sel.forEach((id) => ids.has(id) || sel.delete(id));
  Object.keys(slots).forEach((id) => ids.has(+id) || delete slots[id]);
  // 抽牌動畫：手牌比上次多出來的牌 = 剛抽到的（只在該次 render 播動畫），標記「新」直到我棄牌結束回合
  if (seen?.round !== g.round) { seen = { round: g.round, ids: null, drawn: null, laid: null }; slots = {}; actSlot = null; } // 新回合發牌不算抽牌；牌 id 每局重編，舊預放要清
  // 放下階段是整場的 peak：自己 → 震動 + 慶祝；別人 → 橫幅提醒（只在「剛變成已放下」的那次 render 觸發）。
  // 不顯示階段數字：放完最後一張牌時伺服器已把 phase+1，數字會差一。
  if (seen.laid) g.players.forEach((p) => { if (p.laid && !seen.laid.has(p.id)) { if (p.id === me) { navigator.vibrate?.(30); toast('🎉 階段完成！'); } else toast(`${p.name} 放下了階段`); } });
  seen.laid = new Set(g.players.filter((p) => p.laid).map((p) => p.id));
  const fresh = seen.ids ? [...ids].filter((id) => !seen.ids.has(id)) : [];
  seen.ids = ids;
  if (!canAct || !ids.has(seen.drawn)) seen.drawn = null;
  if (fresh.length === 1) seen.drawn = fresh[0];
  const rank = (c) => (c.t === 'n' ? c.n * 4 + 'RBGY'.indexOf(c.c) : c.t === 'w' ? 100 : 101);
  const hand = [...g.hand].sort((a, b) => rank(a) - rank(b));
  const req = g.phases[mine.phase - 1] || [];
  const name = (id) => g.players.find((p) => p.id === id)?.name ?? '?';
  const picked = hand.filter((c) => sel.has(c.id));
  if (!canAct || !picked.length) endFor = null;

  const players = g.players.map((p) => `<div class="player ${g.turn === p.id ? 'turn' : ''} ${p.in ? '' : 'out'}">
    <div class="row" style="flex-wrap:nowrap;justify-content:space-between"><b>${esc(p.name)}${p.id === me ? '（你）' : ''} ${online[p.id] ? '' : '💤'}</b><span class="cnt" aria-label="${p.n} 張">${p.n}<small>張</small></span></div>
    <small>階段 ${p.phase > 10 ? 10 : p.phase} ${p.laid ? '✅' : ''} · ${p.score} 分${p.skip === 1 ? ' · ⏭將被跳過' : ''}</small>
    ${p.id === me || !p.pick ? '' : `<div class="pick">${p.pick.from === 'pile' ? '🂠 抽牌堆' : `♻ 撿棄牌 ${card(p.pick.card, { tag: 'span', cls: 'sm' })}`}</div>`}</div>`).join('');

  // 排名：先比階段（高者優先）再比分數（低者優先）。同條件並列同名次。
  const cmp = (a, b) => b.phase - a.phase || a.score - b.score;
  const sorted = [...g.players].sort(cmp);
  const ranking = sorted.map((p) => `<tr class="${p.id === me ? 'me' : ''}"><td>${sorted.findIndex((q) => !cmp(q, p)) + 1}</td><td>${esc(p.name)}</td>
    <td>階段 ${Math.min(p.phase, 10)} ${p.laid ? '✅' : ''}</td><td>${p.score} 分</td></tr>`).join('');

  const groups = g.groups.map((gr, i) => {
    const t = gr.type === 'set' ? `${gr.n} 同數` : gr.type === 'run' ? `順子 ${gr.lo}–${gr.hi}` : `同色（${CN[gr.c]}）`;
    const cs = gr.cards.map((c, k) => card(c, { tag: 'div', cls: 'sm', sub: c.t === 'w' ? (gr.type === 'set' ? gr.n : gr.type === 'run' ? gr.lo + k : '') : '' })).join('');
    // 選了牌後整組變成點擊目標（不再長按鈕列，版面不會跳）；選到百搭的順子才多問接前/接後（覆蓋層，不占版面）
    const can = canAct && mine.laid && picked.length;
    const ends = can && endFor === i ? `<div class="ends"><button data-a="hit" data-v="${i}" data-end="lo">‹ 接前</button><button data-a="hit" data-v="${i}" data-end="hi">接後 ›</button></div>` : '';
    return `<div class="group ${can ? 'can' : ''}" ${can ? `data-a="hit" data-v="${i}" role="button"` : ''}><small>${esc(name(gr.owner))} · ${t}</small><div class="row">${cs}</div>${ends}</div>`;
  }).join('');

  const need = req.map(([, n], gi) => hand.filter((c) => slots[c.id] === gi).length === n);
  // 放階段：點某一組讓它「作用中」，再直接點手牌放入（滿了自動跳下一組）；點組內的牌拿回手上。放下階段的按鈕在底部托盤。
  const layUI = laying ? `<div>${req.map((r, gi) => {
    const cs = hand.filter((c) => slots[c.id] === gi), on = actSlot === gi;
    return `<div class="slot ${on ? 'can' : ''}" data-a="slot" data-v="${gi}" role="button" aria-pressed="${on}"><div class="slotH"><span>組 ${gi + 1}：${lab(r)}（${cs.length}/${r[1]}）</span></div>
      <div class="row">${cs.map((c) => card(c, { attrs: `data-a="unslot" data-v="${c.id}"` })).join('') || `<span class="mute">${on ? '點下方手牌放入這組' : '點這組，再點下方手牌'}</span>`}</div></div>`;
  }).join('')}<p class="mute" style="margin:8px 0 0">順子可用百搭補洞；每組至少要有一張數字牌${canAct ? '' : '。可先排好牌，輪到你抽完牌後再放下'}</p></div>` : '';

  const free = hand.filter((c) => slots[c.id] === undefined);
  const one = picked.length === 1 ? picked[0] : null;
  const targets = g.players.filter((p) => p.in && p.id !== me && p.skip === 0);
  // 停用的按鈕不吞掉點擊（CSS pointer-events:none），外層 data-why 會用 toast 說明原因
  const wb = (label, a, why, cls = '') => `<span class="w" data-why="${esc(why)}"><button class="${cls}" data-a="${a}" ${why ? 'disabled' : ''}>${label}</button></span>`;
  const layWhy = need.every(Boolean) ? '' : '每一組都要放滿才能放下階段';
  const layBtn = canAct && laying ? wb('放下階段', 'lay', layWhy, layWhy ? 'ghost' : '') : '';
  const discard = !canAct ? '' : one?.t === 's' && targets.length && g.hand.length > 1
    ? `<span>跳過誰？</span>${targets.map((p) => `<button data-a="discard" data-v="${p.id}">${esc(p.name)}</button>`).join('')}`
    : wb('棄牌並結束回合', 'discard', one ? '' : actSlot !== null ? '正在放階段：再點一次該組可取消' : picked.length > 1 ? '一次只能棄一張牌' : '先點一張要棄的牌', layBtn && !layWhy ? 'ghost' : '');
  const drawWhy = !myTurn ? `還沒輪到你，現在是 ${name(g.turn)}` : g.stage === 'act' ? '這回合已經抽過牌了' : '';
  const topWhy = drawWhy || (!g.top ? '棄牌堆是空的' : g.top.t === 's' ? '跳過牌不能撿' : '');

  const status = g.status !== 'play' ? '' : actSlot !== null ? `放入第 ${actSlot + 1} 組：點下方手牌` : myTurn
    ? (g.stage === 'draw' ? '輪到你了：先從牌堆或棄牌堆抽一張' : '放下階段／接牌，最後棄一張牌')
    : `輪到 ${esc(name(g.turn))}`;

  const sheetUI = sheet && g.status === 'play' ? `<div class="overlay sheet"><div class="bd" data-a="sheet"></div><div class="modal">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">排名 <small>階段高者優先，同階段比分數（低者優先）</small></h2><button class="ghost ic" data-a="sheet" aria-label="關閉">✕</button></div>
    <table>${ranking}</table>
    <h2 style="margin-top:16px">10 個階段</h2><table>${g.phases.map((r, i) => `<tr class="${i + 1 === Math.min(mine.phase, 10) ? 'me' : ''}"><td>${i + 1}</td><td>${r.map(lab).join(' ＋ ')}</td></tr>`).join('')}</table>
    <h2 style="margin-top:16px">最近動態</h2><div class="log">${g.log.map(esc).join('<br>')}</div>
    <button class="ghost" data-a="leave" style="width:100%;margin-top:16px">離開房間</button></div></div>` : '';

  return `<div class="row"><b style="flex:1">房間 ${s.code} · 第 ${g.round} 回合${g.playoff ? '（加賽）' : ''}</b>
    <span class="mute">目標：階段 ${g.target}</span><button class="ghost ic" data-a="sheet" aria-label="排名、階段表、動態">📋</button></div>
  <div class="row players">${players}</div>
  <div class="panel table">
    <div class="piles">
      <div class="pile" data-why="${esc(drawWhy)}"><button class="card back" aria-label="抽牌堆" data-a="draw" data-v="pile" ${drawWhy ? 'disabled' : ''}><b>抽牌</b></button><br>牌堆 ${g.drawCount}</div>
      <div class="pile" data-why="${esc(topWhy)}">${g.top ? card(g.top, { attrs: `data-a="draw" data-v="discard" ${topWhy ? 'disabled' : ''}` }) : '<div class="card empty"></div>'}<br>棄牌</div>
    </div>
    <div class="groups">${groups || '<span class="mute">還沒有人放下階段</span>'}</div>
  </div>
  <div class="panel">
    <h2>你的階段 ${mine.phase}：${req.map(lab).join(' ＋ ')} ${mine.laid ? '✅ 已完成' : ''}</h2>
    ${layUI}
  </div>
  ${g.status !== 'play' ? overlay(g, s) : `<div class="tray"><b>${status}</b>
    <div class="hand">${free.map((c) => card(c, { cls: `${sel.has(c.id) ? 'sel' : ''} ${c.id === seen.drawn ? 'new' : ''} ${fresh.includes(c.id) ? 'pop' : ''}`, attrs: `data-a="card" data-v="${c.id}"` })).join('')}</div>
    ${layBtn + discard && `<div class="row act">${layBtn}${discard}</div>`}</div>`}${sheetUI}`; // 手牌＋棄牌固定在螢幕底部（拇指區），其餘在上方捲動；排名／階段表／動態收進 📋 面板
}

// 結算：依「我贏／別人贏」給不同開場；每人顯示剩下的牌，讓「+N 分」看得出來源；按鈕固定在 modal 底部
function overlay(g, s) {
  const sm = g.summary, over = g.status === 'over', me = s.me, host = me === s.host;
  const nm = (id) => esc(g.players.find((p) => p.id === id).name);
  const head = over
    ? (g.winners.includes(me) ? '<span class="trophy">🏆</span> 你贏了！' : `🏆 ${g.winners.map(nm).join('、')} 獲勝`)
    : (sm.out === me ? '🎉 你先出完牌！' : `${nm(sm.out)} 出完牌了`);
  const rows = sm.rows.map((r) => `<div class="res ${r.id === me ? 'me' : ''}">
    <div class="row" style="justify-content:space-between"><b>${esc(r.name)}${r.id === me ? '（你）' : ''}</b><span>階段 ${r.phase} ${r.laid ? '✅' : '❌'} · <b>+${r.gain}</b> → ${r.score} 分</span></div>
    ${r.hand.length ? `<div class="row" style="margin-top:8px;gap:4px">${r.hand.map((c) => card(c, { tag: 'span', cls: 'sm' })).join('')}</div>` : ''}</div>`).join('');
  const foot = over
    ? (host ? '<button data-a="back">回到房間再來一局</button><button class="ghost" data-a="leave">離開房間</button>' :`<span class="mute">等 ${nm(s.host)} 開新局…</span><button class="ghost" data-a="leave">離開房間</button>`)
    : '<button data-a="next">下一回合</button>';
  return `<div class="overlay"><div class="modal res-m"><div class="body">
    <div class="hd">${head}</div>${over && !g.winners.includes(me) ? '<div class="mute">差一點，再來一局！</div>' : ''}
    ${rows}${sm.note ? `<p>${esc(sm.note)}</p>` : ''}</div>
    <div class="row act foot">${foot}</div></div></div>`;
}

function render() {
  const keep = $('#name')?.value;
  if (!snap?.game) seen = null; // 離開／重開一場遊戲後不要沿用舊手牌
  $('#app').innerHTML = !sess ? lobby() : !snap ? '<p>連線中…</p>' : snap.game ? game() : room();
  if (keep !== undefined && $('#name')) $('#name').value = keep;
}

const A = {
  async create() { const r = await post('create', { name: $('#name').value }).catch((e) => toast(e.message)); if (r) { localStorage.setItem('p10name', $('#name').value); enter(r); } },
  async join() { const r = await post('join', { name: $('#name').value, code: $('#code').value }).catch((e) => toast(e.message)); if (r) { localStorage.setItem('p10name', $('#name').value); enter(r); } },
  home() { history.replaceState(null, '', '/'); location.reload(); },
  async copy() {
    const l = `${location.origin}/?room=${snap.code}`;
    // 手機優先叫出系統分享面板（LINE／訊息一步到位）；使用者按取消不算失敗
    if (navigator.share) { try { return await navigator.share({ title: 'Phase 10', text: '來玩 Phase 10！', url: l }); } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(l); toast('已複製邀請連結'); } catch { prompt('複製這個連結傳給朋友：', l); }
  },
  start: () => call('start'),
  async leave() {
    // 遊戲進行中伺服器不讓你正式退出（牌和輪次都綁在你身上）→ 只在本機斷線，由系統代打；之後無法回到這局，所以先確認
    if (snap?.game && snap.game.status !== 'over') {
      if (!confirm('離開後這局會由系統代打，而且無法再回到這局。確定要離開？')) return;
      return exit();
    }
    await call('leave'); exit();
  },
  back: () => call('back'),
  next: () => call('act', { action: { type: 'next' } }),
  draw: (v) => call('act', { action: { type: 'draw', from: v } }),
  card(v) {
    endFor = null;
    if (actSlot === null) sel.has(+v) ? sel.delete(+v) : sel.add(+v);
    else { // 有作用中的組：點牌就直接放入；這組滿了自動換到下一個還沒滿的組
      const req = phaseReq(), full = (gi) => Object.values(slots).filter((x) => x === gi).length >= req[gi][1];
      if (full(actSlot)) return toast('這組已經放滿了，點組內的牌可以拿回來');
      slots[v] = actSlot;
      if (full(actSlot)) actSlot = req.findIndex((_, gi) => !full(gi)) < 0 ? null : req.findIndex((_, gi) => !full(gi));
    }
    render();
  },
  slot(v) { // 有先選好的牌 → 整批放入（舊流程仍可用）；否則切換作用中的組
    if (sel.size) { sel.forEach((id) => (slots[id] = +v)); sel.clear(); actSlot = null; } else actSlot = actSlot === +v ? null : +v;
    render();
  },
  unslot(v) { delete slots[v]; render(); },
  sheet() { sheet = !sheet; render(); },
  async lay() {
    const groups = phaseReq().map((_, gi) => Object.keys(slots).filter((id) => slots[id] === gi).map(Number));
    if (await call('act', { action: { type: 'lay', groups } })) { slots = {}; actSlot = null; }
  },
  hit(v, el) {
    const gr = snap.game.groups[+v], end = el.dataset.end;
    // 順子 + 選到百搭 + 還沒指定方向 → 先問接前/接後（純數字牌伺服器會自己判斷）
    if (gr.type === 'run' && !end && snap.game.hand.some((c) => sel.has(c.id) && c.t === 'w')) { endFor = +v; return render(); }
    return call('act', { action: { type: 'hit', group: +v, cards: [...sel], end } }).then((r) => { endFor = null; r ? sel.clear() : render(); });
  },
  discard: (v) => call('act', { action: { type: 'discard', card: [...sel][0], target: v } }).then((r) => r && sel.clear()),
};
$('#app').addEventListener('click', (e) => {
  const why = e.target.closest('[data-why]')?.dataset.why; // 停用的按鈕 pointer-events:none，點擊落在外層 → 說明為什麼不能按
  if (why) return toast(why);
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled) A[el.dataset.a]?.(el.dataset.v, el);
});
$('#app').addEventListener('focusout', (e) => { if (e.target.matches?.('select') && snap) render(); }); // 補上選單開著時被略過的重繪
$('#app').addEventListener('change', (e) => {
  const k = e.target.dataset.c;
  if (k) e.target.blur(); // 選完就放開焦點，不然「焦點在 select 時略過重繪」會讓房主一直看不到新加入的玩家
  if (k) call('settings', { [k]: k === 'target' ? +e.target.value : e.target.value });
});
if (sess) connect(); else render();
</script>
</body>
</html>
