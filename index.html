<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 10 線上</title>
<style>
:root{--bg:#0f3d2e;--panel:#165740;--panel2:#1d6a4f;--ink:#f6f3ea;--mute:#a8c7b8;--accent:#f6c945;--R:#d64545;--B:#3b73d4;--G:#2e9e5b;--Y:#e0b020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Noto Sans TC",sans-serif;touch-action:manipulation}
#app:has(.tray){padding-bottom:0}
#app{max-width:1000px;margin:0 auto;padding:12px 16px 40px}
h1{margin:8px 0 16px;font-size:26px;letter-spacing:.5px}h2{font-size:16px;margin:0 0 8px;color:var(--mute);font-weight:600}
.panel{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px}
summary{cursor:pointer;font-size:16px;font-weight:600;color:var(--mute)}details[open] summary{margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;border-radius:8px;border:0;padding:8px 14px}
button{background:var(--accent);color:#2a2200;font-weight:600;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--mute)}
input,select{font-size:16px;background:#0c2f23;color:var(--ink);border:1px solid #2f7d5f} /* iOS 對 <16px 的輸入框聚焦會自動放大整頁 */
button,.card{-webkit-user-select:none;user-select:none}
.mute{color:var(--mute)}.big{font-size:32px;letter-spacing:6px;font-weight:700}
.player{background:var(--panel2);border-radius:10px;padding:8px 12px;min-width:120px;flex:1;border:2px solid transparent}
.player.turn{border-color:var(--accent)}.player.out{opacity:.4}
.pick{margin-top:4px;font-size:13px;display:flex;align-items:center;gap:6px}.pick .card{box-shadow:none}
.player b{display:block}.player small{color:var(--mute)}
.table{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.piles{display:flex;gap:12px}
.pile{text-align:center;font-size:12px;color:var(--mute)}
.groups{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:220px}
.group{position:relative;background:var(--panel2);border-radius:10px;padding:8px}
.group.can{outline:2px dashed var(--accent);cursor:pointer}
.ends{position:absolute;inset:0;display:flex;gap:4px;padding:4px;background:#0c2f23d9;border-radius:10px}.ends button{flex:1}
.group .row{gap:4px}.group small{display:block;color:var(--mute);margin-bottom:4px}
.card{position:relative;width:46px;height:64px;border-radius:7px;border:2px solid #fff;color:#fff;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-weight:700;box-shadow:0 1px 3px #0006;flex:none}
.card b{font-size:21px;line-height:1}.card i{font-style:normal;font-size:11px;opacity:.9}
.card u{position:absolute;bottom:1px;right:3px;font-size:10px;text-decoration:none}
.card.sm{width:34px;height:48px}.card.sm b{font-size:16px}
.card.R{background:var(--R)}.card.B{background:var(--B)}.card.G{background:var(--G)}.card.Y{background:var(--Y);color:#2a2200}
.card.W{background:conic-gradient(var(--R),var(--Y),var(--G),var(--B),var(--R))}.card.W b,.card.W i,.card.W u{text-shadow:0 0 4px #000,0 0 2px #000}
.card.S{background:#222}.card.back{background:repeating-linear-gradient(45deg,#7b2d8f,#7b2d8f 6px,#5d2070 6px,#5d2070 12px);font-size:11px}
.card.new{outline:3px solid #fff;box-shadow:0 0 12px 3px var(--accent)}
.card.new::after{content:'新';position:absolute;top:-10px;left:-6px;background:var(--accent);color:#2a2200;font-size:11px;line-height:16px;border-radius:8px;padding:0 6px}
.card.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateY(-110px) scale(.4) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.card.sel{transform:translateY(-12px);outline:3px solid var(--accent)}
.card.empty{background:transparent;border:2px dashed var(--mute);color:var(--mute);box-shadow:none}
.hand{display:flex;flex-wrap:wrap;gap:6px;padding:16px 0 4px}
.tray{position:sticky;bottom:0;z-index:2;margin:12px -16px 0;padding:8px 16px 12px;background:var(--panel);border-top:1px solid #2f7d5f;box-shadow:0 -8px 16px #0a2a1f99}
.tray>b{display:block}.tray .hand{padding:12px 0 8px}
.act button{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px}
.slot{background:#0c2f23;border-radius:8px;padding:8px;margin-top:8px}
.slotH{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.slot .row{min-height:48px}
.log{font-size:12px;color:var(--mute);max-height:90px;overflow:auto}
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal{background:var(--panel);border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;text-align:left}th{color:var(--mute);font-weight:500}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#000d;padding:10px 18px;border-radius:10px;z-index:9;display:none}
tr.me{color:var(--accent);font-weight:600}h2 small{font-weight:400}
.crown{color:var(--accent)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#777}.dot.on{background:#5fe08a}
@media(max-width:600px){
#app{padding:8px 8px 32px}.panel{padding:10px}h1{font-size:22px}
.player{min-width:calc(50% - 4px);padding:6px 10px}
.piles{width:100%;justify-content:center}.groups{min-width:0;width:100%}
.hand{gap:4px}.card{width:40px;height:56px}.card b{font-size:18px}.card.sm{width:32px;height:46px}
button,select,input{min-height:40px}
.tray{margin:12px -8px 0;padding:8px 8px 12px}
.slotH{flex-wrap:wrap}.big{font-size:26px;letter-spacing:4px}
input[readonly]{width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SYM = { R: '●', B: '■', G: '▲', Y: '◆' }, CN = { R: '紅', B: '藍', G: '綠', Y: '黃' };
const lab = ([t, n]) => (t === 'set' ? `${n} 張同數字` : t === 'run' ? `${n} 張連續順子` : `${n} 張同顏色`);
const store = {
  get() { try { return JSON.parse(localStorage.getItem('p10') || 'null'); } catch { return null; } },
  set(v) { try { v ? localStorage.setItem('p10', JSON.stringify(v)) : localStorage.removeItem('p10'); } catch {} },
};
const urlRoom = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
let sess = store.get(), snap = null, es = null, sel = new Set(), slots = {}, seen = null, rulesOpen = true, endFor = null; // 每次 render 會重建 DOM，展開狀態要存在這；endFor = 正在選「接前/接後」的順子
if (sess && urlRoom && sess.code !== urlRoom) sess = null; // 邀請連結指向另一間房 → 先顯示加入畫面

function toast(m) {
  const t = $('#toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 2800);
}
async function post(name, data = {}) {
  const r = await fetch('/api/' + name, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '發生錯誤');
  return j;
}
const call = (name, data) => post(name, { ...sess, ...data }).catch((e) => toast(e.message));

function connect() {
  es?.close();
  es = new EventSource(`/api/events?code=${sess.code}&token=${sess.token}`);
  es.onmessage = (e) => { snap = JSON.parse(e.data); render(); };
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) { toast('連線中斷或房間已過期'); exit(); } };
}
// 手機切去別的 App 再回來，iOS 的 EventSource 常常是死的 → 回前景一律重連
document.addEventListener('visibilitychange', () => { if (!document.hidden && sess) connect(); });
function exit() {
  es?.close(); sess = snap = null; sel.clear(); slots = {}; store.set(null);
  history.replaceState(null, '', '/'); render();
}
function enter(r) {
  sess = r; store.set(r); history.replaceState(null, '', '/?room=' + r.code); connect();
}

const card = (c, o = {}) => {
  const cls = c.t === 'n' ? c.c : c.t === 'w' ? 'W' : 'S';
  const face = c.t === 'n' ? c.n : c.t === 'w' ? 'W' : '⊘';
  const sym = c.t === 'n' ? SYM[c.c] : c.t === 'w' ? '★' : 'SKIP';
  const name = c.t === 'n' ? `${CN[c.c]}${c.n}` : c.t === 'w' ? '百搭' : '跳過';
  return `<${o.tag || 'button'} class="card ${cls} ${o.cls || ''}" aria-label="${name}" ${o.attrs || ''}><b>${face}</b><i>${sym}</i>${o.sub ? `<u>${o.sub}</u>` : ''}</${o.tag || 'button'}>`;
};

function lobby() {
  return `<h1>🃏 Phase 10 線上</h1>
  <div class="panel"><h2>你的名字</h2><input id="name" maxlength="12" placeholder="最多 12 字" value="${esc(localStorage.getItem('p10name') || '')}"></div>
  ${urlRoom ? '' : `<div class="panel"><h2>開新房間</h2><button data-a="create">建立房間</button></div>`}
  <div class="panel"><h2>${urlRoom ? '你被邀請加入房間' : '加入房間'}</h2>
    <div class="row"><input id="code" maxlength="4" size="6" placeholder="房間代碼" value="${esc(urlRoom)}" style="text-transform:uppercase"><button data-a="join">加入</button>
    ${urlRoom ? '<button class="ghost" data-a="home">改為開新房間</button>' : ''}</div></div>
  <p class="mute">2–6 人。建立房間後把邀請連結傳給朋友即可。</p>`;
}

function room() {
  const s = snap, host = s.me === s.host, n = s.players.length, st = s.settings;
  const link = `${location.origin}/?room=${s.code}`;
  const set = host
    ? `<div class="row"><select data-c="target">${[...Array(10)].map((_, i) => `<option value="${i + 1}" ${st.target === i + 1 ? 'selected' : ''}>目標：第 ${i + 1} 階段</option>`).join('')}</select></div>`
    : `<div>先完成第 ${st.target} 階段者結束遊戲</div>`;
  return `<h1>房間 <span class="big">${s.code}</span></h1>
  <div class="panel"><h2>邀請朋友</h2><div class="row"><input readonly value="${esc(link)}" size="34" onfocus="this.select()"><button data-a="copy">複製連結</button></div></div>
  <div class="panel"><h2>玩家（${n}/6）</h2>
    ${s.players.map((p) => `<div><span class="dot ${p.online ? 'on' : ''}"></span>${esc(p.name)} ${p.id === s.host ? '<span class="crown">👑 房主</span>' : ''} ${p.id === s.me ? '<span class="mute">（你）</span>' : ''}</div>`).join('')}</div>
  <div class="panel"><h2>規則</h2>${set}
    <p class="mute">每人發 10 張牌。只有完成當前階段的人，下一回合才能進下一階段；沒完成就繼續挑戰同一階段。有人完成目標階段後，該回合結束時比總分（低者勝）。</p></div>
  <div class="row">${host ? `<button data-a="start" ${n < 2 ? 'disabled' : ''}>開始遊戲</button>${n < 2 ? '<span class="mute">至少需要 2 人</span>' : ''}` : '<span class="mute">等待房主開始…</span>'}
  <button class="ghost" data-a="leave">離開房間</button></div>`;
}

function game() {
  const s = snap, g = s.game, me = s.me, mine = g.players.find((p) => p.id === me);
  const myTurn = g.turn === me, canDraw = myTurn && g.stage === 'draw', canAct = myTurn && g.stage === 'act';
  const online = Object.fromEntries(s.players.map((p) => [p.id, p.online]));
  const ids = new Set(g.hand.map((c) => c.id));
  sel.forEach((id) => ids.has(id) || sel.delete(id));
  Object.keys(slots).forEach((id) => ids.has(+id) || delete slots[id]);
  // 抽牌動畫：手牌比上次多出來的牌 = 剛抽到的（只在該次 render 播動畫），標記「新」直到我棄牌結束回合
  if (seen?.round !== g.round) { seen = { round: g.round, ids: null, drawn: null }; slots = {}; } // 新回合發牌不算抽牌；牌 id 每局重編，舊預放要清
  const fresh = seen.ids ? [...ids].filter((id) => !seen.ids.has(id)) : [];
  seen.ids = ids;
  if (!canAct || !ids.has(seen.drawn)) seen.drawn = null;
  if (fresh.length === 1) seen.drawn = fresh[0];
  const rank = (c) => (c.t === 'n' ? c.n * 4 + 'RBGY'.indexOf(c.c) : c.t === 'w' ? 100 : 101);
  const hand = [...g.hand].sort((a, b) => rank(a) - rank(b));
  const req = g.phases[mine.phase - 1] || [];
  const name = (id) => g.players.find((p) => p.id === id)?.name ?? '?';
  const picked = hand.filter((c) => sel.has(c.id));
  if (!canAct || !picked.length) endFor = null;

  const players = g.players.map((p) => `<div class="player ${g.turn === p.id ? 'turn' : ''} ${p.in ? '' : 'out'}">
    <b>${esc(p.name)}${p.id === me ? '（你）' : ''} ${online[p.id] ? '' : '💤'}</b>
    <small>階段 ${p.phase > 10 ? 10 : p.phase} ${p.laid ? '✅' : ''} · ${p.n} 張 · ${p.score} 分${p.skip === 1 ? ' · ⏭將被跳過' : ''}</small>
    ${p.id === me || !p.pick ? '' : `<div class="pick">${p.pick.from === 'pile' ? '🂠 抽牌堆' : `♻ 撿棄牌 ${card(p.pick.card, { tag: 'span', cls: 'sm' })}`}</div>`}</div>`).join('');

  // 排名：先比階段（高者優先）再比分數（低者優先）。同條件並列同名次。
  const cmp = (a, b) => b.phase - a.phase || a.score - b.score;
  const sorted = [...g.players].sort(cmp);
  const ranking = sorted.map((p) => `<tr class="${p.id === me ? 'me' : ''}"><td>${sorted.findIndex((q) => !cmp(q, p)) + 1}</td><td>${esc(p.name)}</td>
    <td>階段 ${Math.min(p.phase, 10)} ${p.laid ? '✅' : ''}</td><td>${p.score} 分</td></tr>`).join('');

  const groups = g.groups.map((gr, i) => {
    const t = gr.type === 'set' ? `${gr.n} 同數` : gr.type === 'run' ? `順子 ${gr.lo}–${gr.hi}` : `同色（${CN[gr.c]}）`;
    const cs = gr.cards.map((c, k) => card(c, { tag: 'div', cls: 'sm', sub: c.t === 'w' ? (gr.type === 'set' ? gr.n : gr.type === 'run' ? gr.lo + k : '') : '' })).join('');
    // 選了牌後整組變成點擊目標（不再長按鈕列，版面不會跳）；選到百搭的順子才多問接前/接後（覆蓋層，不占版面）
    const can = canAct && mine.laid && picked.length;
    const ends = can && endFor === i ? `<div class="ends"><button data-a="hit" data-v="${i}" data-end="lo">‹ 接前</button><button data-a="hit" data-v="${i}" data-end="hi">接後 ›</button></div>` : '';
    return `<div class="group ${can ? 'can' : ''}" ${can ? `data-a="hit" data-v="${i}" role="button"` : ''}><small>${esc(name(gr.owner))} · ${t}</small><div class="row">${cs}</div>${ends}</div>`;
  }).join('');

  const need = req.map(([, n], gi) => hand.filter((c) => slots[c.id] === gi).length === n);
  const layUI = g.status === 'play' && mine.in && !mine.laid ? `<div>${req.map((r, gi) => {
    const cs = hand.filter((c) => slots[c.id] === gi);
    return `<div class="slot"><div class="slotH"><span>組 ${gi + 1}：${lab(r)}（${cs.length}/${r[1]}）</span><button data-a="slot" data-v="${gi}" ${picked.length ? '' : 'disabled'}>放入選取的牌</button></div>
      <div class="row">${cs.map((c) => card(c, { attrs: `data-a="unslot" data-v="${c.id}"` })).join('') || '<span class="mute">先選牌，再按右上角按鈕</span>'}</div></div>`;
  }).join('')}<div class="row" style="margin-top:8px"><button data-a="lay" ${canAct && need.every(Boolean) ? '' : 'disabled'}>放下階段</button><span class="mute">${canAct ? '順子可用百搭補洞；每組至少要有一張數字牌' : '可先排好牌，輪到你抽完牌後再放下'}</span></div></div>` : '';

  const free = hand.filter((c) => slots[c.id] === undefined);
  const one = picked.length === 1 ? picked[0] : null;
  const targets = g.players.filter((p) => p.in && p.id !== me && p.skip === 0);
  const discard = !canAct ? '' : one?.t === 's' && targets.length && g.hand.length > 1
    ? `<span>跳過誰？</span>${targets.map((p) => `<button data-a="discard" data-v="${p.id}">${esc(p.name)}</button>`).join('')}`
    : `<button data-a="discard" ${one ? '' : 'disabled'}>棄牌並結束回合</button>`;

  const status = g.status !== 'play' ? '' : myTurn
    ? (g.stage === 'draw' ? '輪到你了：先從牌堆或棄牌堆抽一張' : '放下階段／接牌，最後棄一張牌')
    : `輪到 ${esc(name(g.turn))}`;

  return `<div class="row" style="justify-content:space-between"><b>房間 ${s.code} · 第 ${g.round} 回合${g.playoff ? '（加賽）' : ''}</b>
    <span class="mute">目標：第 ${g.target} 階段</span></div>
  <div class="row" style="margin:10px 0">${players}</div>
  <div class="panel table">
    <div class="piles">
      <div class="pile"><button class="card back" aria-label="抽牌堆" data-a="draw" data-v="pile" ${canDraw ? '' : 'disabled'}><b>抽牌</b></button><br>牌堆 ${g.drawCount}</div>
      <div class="pile">${g.top ? card(g.top, { attrs: `data-a="draw" data-v="discard" ${canDraw && g.top.t !== 's' ? '' : 'disabled'}` }) : '<div class="card empty"></div>'}<br>棄牌</div>
    </div>
    <div class="groups">${groups || '<span class="mute">還沒有人放下階段</span>'}</div>
  </div>
  <div class="panel">
    <h2>你的階段 ${mine.phase}：${req.map(lab).join(' ＋ ')} ${mine.laid ? '✅ 已完成' : ''}</h2>
    ${layUI}
  </div>
  <div class="panel"><h2>排名 <small>階段高者優先，同階段比分數（低者優先）</small></h2><table>${ranking}</table></div>
  <details class="panel" ${rulesOpen ? 'open' : ''} ontoggle="rulesOpen=this.open"><summary>10 個階段</summary><table>${g.phases.map((r, i) => `<tr class="${i + 1 === Math.min(mine.phase, 10) ? 'me' : ''}"><td>${i + 1}</td><td>${r.map(lab).join(' ＋ ')}</td></tr>`).join('')}</table></details>
  <div class="log">${g.log.map(esc).join('<br>')}</div>
  ${g.status !== 'play' ? overlay(g, s) : `<div class="tray"><b>${status}</b>
    <div class="hand">${free.map((c) => card(c, { cls: `${sel.has(c.id) ? 'sel' : ''} ${c.id === seen.drawn ? 'new' : ''} ${fresh.includes(c.id) ? 'pop' : ''}`, attrs: `data-a="card" data-v="${c.id}"` })).join('')}</div>
    ${discard && `<div class="row act">${discard}</div>`}</div>`}`; // 手牌＋棄牌固定在螢幕底部（拇指區），其餘在上方捲動
}

function overlay(g, s) {
  const sm = g.summary, over = g.status === 'over', host = s.me === s.host;
  const nm = (id) => esc(g.players.find((p) => p.id === id).name);
  return `<div class="overlay"><div class="modal">
    <h2>${over ? '🏆 遊戲結束' : '回合結束'}</h2>
    ${over ? `<p style="font-size:20px"><b>勝利：${g.winners.map(nm).join('、')}</b></p>` : `<p><b>${nm(sm.out)}</b> 出完牌！</p>`}
    <table><tr><th>玩家</th><th>階段</th><th>本回合</th><th>總分</th></tr>
    ${sm.rows.map((r) => `<tr><td>${esc(r.name)}</td><td>${r.phase} ${r.laid ? '✅' : '❌'}</td><td>+${r.gain}</td><td>${r.score}</td></tr>`).join('')}</table>
    ${sm.note ? `<p>${esc(sm.note)}</p>` : ''}
    <div class="row" style="margin-top:12px">${over
      ? (host ? '<button data-a="back">回到房間</button>' : '<span class="mute">等待房主…</span>')
      : '<button data-a="next">下一回合</button>'}</div></div></div>`;
}

function render() {
  const keep = $('#name')?.value;
  if (!snap?.game) seen = null; // 離開／重開一場遊戲後不要沿用舊手牌
  $('#app').innerHTML = !sess ? lobby() : !snap ? '<p>連線中…</p>' : snap.game ? game() : room();
  if (keep !== undefined && $('#name')) $('#name').value = keep;
}

const A = {
  async create() { const r = await post('create', { name: $('#name').value }).catch((e) => toast(e.message)); if (r) { localStorage.setItem('p10name', $('#name').value); enter(r); } },
  async join() { const r = await post('join', { name: $('#name').value, code: $('#code').value }).catch((e) => toast(e.message)); if (r) { localStorage.setItem('p10name', $('#name').value); enter(r); } },
  home() { history.replaceState(null, '', '/'); location.reload(); },
  async copy() {
    const l = `${location.origin}/?room=${snap.code}`;
    try { await navigator.clipboard.writeText(l); toast('已複製邀請連結'); } catch { prompt('複製這個連結傳給朋友：', l); }
  },
  start: () => call('start'),
  async leave() { await call('leave'); exit(); },
  back: () => call('back'),
  next: () => call('act', { action: { type: 'next' } }),
  draw: (v) => call('act', { action: { type: 'draw', from: v } }),
  card(v) { sel.has(+v) ? sel.delete(+v) : sel.add(+v); endFor = null; render(); },
  slot(v) { sel.forEach((id) => (slots[id] = +v)); sel.clear(); render(); },
  unslot(v) { delete slots[v]; render(); },
  async lay() {
    const req = snap.game.phases[snap.game.players.find((p) => p.id === snap.me).phase - 1];
    const groups = req.map((_, gi) => Object.keys(slots).filter((id) => slots[id] === gi).map(Number));
    if (await call('act', { action: { type: 'lay', groups } })) slots = {};
  },
  hit(v, el) {
    const gr = snap.game.groups[+v], end = el.dataset.end;
    // 順子 + 選到百搭 + 還沒指定方向 → 先問接前/接後（純數字牌伺服器會自己判斷）
    if (gr.type === 'run' && !end && snap.game.hand.some((c) => sel.has(c.id) && c.t === 'w')) { endFor = +v; return render(); }
    return call('act', { action: { type: 'hit', group: +v, cards: [...sel], end } }).then((r) => { endFor = null; r ? sel.clear() : render(); });
  },
  discard: (v) => call('act', { action: { type: 'discard', card: [...sel][0], target: v } }).then((r) => r && sel.clear()),
};
$('#app').addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled) A[el.dataset.a]?.(el.dataset.v, el);
});
$('#app').addEventListener('change', (e) => {
  const k = e.target.dataset.c;
  if (k) call('settings', { [k]: k === 'target' ? +e.target.value : e.target.value });
});
if (sess) connect(); else render();
</script>
</body>
</html>
