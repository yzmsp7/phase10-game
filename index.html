function manilaOverlay(g, s) {
  const sm = g.summary, over = g.status === 'over', me = s.me, host = me === s.host;
  const pById = Object.fromEntries(g.players.map((p) => [p.id, p]));
  const nm = (id) => esc(pById[id]?.name ?? '?');
  const head = over
    ? (g.winners.includes(me) ? '<span class="trophy">🏆</span> 你是馬尼拉走私大王！' : `🏆 ${g.winners.map(nm).join('、')} 成為走私大王！`)
    : `⚓ 第 ${sm.round} 航程結算`;

  const shipLines = sm.ships.map((sr) => {
    const info = M_INFO[sr.good];
    const who = sr.payouts.length ? sr.payouts.map((x) => `${nm(x.id)} +$${x.amount}`).join('、') : '無人分紅';
    return `<div class="res" style="border-left:4px solid ${info.color}">
      <div class="row" style="justify-content:space-between"><span class="row" style="gap:6px">${mGoodImg(sr.good)}<b>${sr.name}船</b></span><span>${sr.plundered ? '🏴‍☠️ 被海盜掠奪 → ' : ''}${sr.dest === 'harbor' ? '⚓ 進港' : '🔧 修船廠'}</span></div>
      <small class="mute">${who}</small></div>`;
  }).join('');

  const mktLine = sm.priceChanges.length
    ? `<div class="res"><b>📈 黑市價格調漲</b><div class="row" style="margin-top:6px;font-size:var(--s1);gap:10px">${sm.priceChanges.map((x) => `<span class="row" style="gap:4px">${mGoodImg(x.good)}${x.name} $${x.before}→<b>$${x.after}</b></span>`).join('')}</div></div>`
    : '<div class="res mute">本航程無船進港，黑市價格未變動</div>';

  const insLine = sm.insurance && sm.insurance.owed > 0
    ? `<div class="res"><b>🛡️ 保險理賠</b><div style="margin-top:4px;font-size:var(--s1)">${esc(sm.insurance.name)} 賠付修船廠 <b>$${sm.insurance.paid}</b>${sm.insurance.autoMortgaged ? `（自動抵押 ${sm.insurance.autoMortgaged} 股）` : ''}${sm.insurance.bankCovered ? `（銀行補足 $${sm.insurance.bankCovered}）` : ''}</div></div>`
    : '';

  const roundRows = sm.rows.map((r) => `<div class="res ${r.id === me ? 'me' : ''}">
    <div class="row" style="justify-content:space-between"><span class="row" style="gap:5px">${mMeeple(pById[r.id], true)}<b>${esc(r.name)}${r.id === me ? '（你）' : ''}</b></span><span>本航程 <b>${r.net >= 0 ? `+$${r.net}` : `−$${Math.abs(r.net)}`}</b> → ${mCoin(13)} $${r.cash}</span></div>
    <small class="mute">${[r.cargo && `船員+$${r.cargo}`, r.pirate && `海盜+$${r.pirate}`, r.harbor && `港口+$${r.harbor}`, r.shipyard && `修船廠+$${r.shipyard}`, r.insurancePaid && `保險−$${r.insurancePaid}`].filter(Boolean).join(' · ') || '無收支'}</small></div>`).join('');

  const finalBoard = over && sm.finalRows ? sm.finalRows.map((r) => {
    const rank = sm.finalRows.findIndex((q) => q.total === r.total);
    const stDesc = M_GOODS.filter((k) => r.byGood[k] > 0).map((k) => `<span class="row" style="gap:3px;display:inline-flex;margin-right:6px">${mGoodImg(k)}${r.byGood[k]}×$${sm.market[k]}</span>`).join('');
    return `<div class="res rk ${r.id === me ? 'me' : ''}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap">
      <div><b class="row" style="gap:5px;flex-wrap:nowrap"><span style="display:inline-block;min-width:1.4em">${['🏆', '🥈', '🥉'][rank] ?? rank + 1}</span>${mMeeple(pById[r.id], true)}${esc(r.name)}${r.id === me ? '（你）' : ''}</b>
        <div style="font-size:var(--s1);font-weight:400;opacity:.85;margin-top:2px">現金 $${r.cash} ＋ 股票 $${r.stockValue}${r.debt ? ` − 贖回 $${r.debt}` : ''}</div>
        <div style="font-size:11px;font-weight:400;opacity:.9;margin-top:4px">${stDesc || '無持股'}</div></div>
      <b>$${r.total}</b></div></div>`;
  }).join('') : '';

  const activePs = g.players.filter((p) => p.in);
  const readySet = new Set(g.nextReady || []);
  const myReady = readySet.has(me);
  const readyBar = !over ? `<div class="m-ready-bar" aria-label="下一航程準備狀態">${activePs.map((p) => `<span class="m-rchip ${readySet.has(p.id) ? 'ok' : ''}">${mMeeple(p, true)}${esc(p.name)} ${readySet.has(p.id) ? '✓' : '…'}</span>`).join('')}</div>` : '';
  const foot = over
    ? (host ? '<button data-a="back">回到房間再來一局</button><button class="ghost" data-a="leave">離開房間</button>' : `<span class="mute">等 ${nm(s.host)} 開新局…</span><button class="ghost" data-a="leave">離開房間</button>`)
    : myReady
    ? `<button class="ghost" disabled>✅ 已準備，等待其他玩家（${readySet.size}/${activePs.length}）</button>`
    : `<button data-a="next">開始第 ${sm.round + 1} 航程（${readySet.size}/${activePs.length} 已準備）</button>`;

  return `<div class="overlay"><div class="modal res-m"><div class="body">
    <div class="hd">${head}</div>
    ${over ? `<div class="row mute" style="margin-bottom:8px;gap:8px;font-size:var(--s1)">黑市終盤：${M_GOODS.map((k) => `<span class="row" style="gap:3px">${mGoodImg(k)}$${sm.market[k]}</span>`).join('')}</div>${finalBoard}` : `${shipLines}${mktLine}${insLine}<h2 style="margin-top:12px">本航程收支</h2>${roundRows}`}
  </div><div class="foot">${readyBar}<div class="row act">${foot}</div></div></div></div>`;
}

function render() {
  const form = [...document.querySelectorAll('#name,#code,#target,#rounds,#turn,#pirateKick,[data-r]')].map((e) => [e, e.type === 'checkbox' ? e.checked : e.value]); // 建房表單：重繪不能洗掉使用者已填／已勾的
  const keep = Object.fromEntries(form.map(([e, v]) => [e.id || e.dataset.r, v]));
  if (!snap?.game) { seen = null; resetMs(); } // 離開／重開一場遊戲後不要沿用舊手牌
  document.body.classList.toggle('cats-mode', !!(snap?.game && snap.kind === 'cats'));
  document.body.classList.toggle('manila-mode', !!(snap?.game && snap.kind === 'manila'));
  $('#app').innerHTML = !sess ? lobby() : !snap ? '<p>連線中…</p>' : snap.game ? (snap.kind === 'fuji' ? fuji() : snap.kind === 'cats' ? cats() : snap.kind === 'manila' ? manila() : game()) : room();
  for (const e of document.querySelectorAll('#name,#code,#target,#rounds,#turn,#pirateKick,[data-r]')) { const v = keep[e.id || e.dataset.r]; if (v !== undefined) e.type === 'checkbox' ? (e.checked = v) : (e.value = v); }
  const all = [...document.querySelectorAll('[data-r]')]; if (all.length && all.every((b) => b.checked)) { const b = $('[data-a="allRules"]'); if (b) b.textContent = '全不選'; }
  tick();
}
// 倒數只改文字，不重繪 DOM；最後 10 秒變紅
function tick() {
  const el = $('.cd'); if (!el) return;
  const s = dl == null ? null : Math.max(0, Math.ceil((dl - Date.now()) / 1000));
  el.textContent = s == null ? '' : `⏱ ${s}`;
  el.style.color = s != null && s <= 10 ? '#ff8a80' : '';
  // 最後 5 秒：每秒換數字時重播晃動動畫；輪到我才震動（別人的倒數只有畫面提示，免得一直被打擾）
  const warn = s > 0 && s <= 5;
  if (warn && s !== tick.s) { el.classList.remove('warn'); void el.offsetWidth; if (snap?.game?.turn === snap.me) navigator.vibrate?.(80); }
  el.classList.toggle('warn', warn);
  tick.s = s;
}
setInterval(tick, 250);

const A = {
  async create() {
    const body = { kind: pick, name: $('#name').value, turn: +$('#turn').value };
    if (pick === 'phase10') Object.assign(body, { target: +$('#target').value, rules: Object.fromEntries(RULES.map(([k]) => [k, !!$(`[data-r="${k}"]`)?.checked])) });
    if (pick === 'cats') body.rounds = +$('#rounds').value;
    if (pick === 'manila') body.pirateKick = !!$('#pirateKick')?.checked;
    const r = await post('create', body).catch((e) => toast(e.message)); if (r) { localStorage.setItem('p10name', $('#name').value); enter(r); }
  },
  fold(v) { folds.has(v) ? folds.delete(v) : folds.add(v); render(); },
  pick(v) { pick = v; try { localStorage.setItem('p10pick', v); } catch {} render(); },
  async join() { const r = await post('join', { name: $('#name').value, code: $('#code').value }).catch((e) => toast(e.message)); if (r) { localStorage.setItem('p10name', $('#name').value); enter(r); } },
  home() { history.replaceState(null, '', '/'); location.reload(); },
  allRules(v, btn) { // 一次勾選：現在全勾了就全部取消，否則全部勾起來
    const boxes = [...document.querySelectorAll('[data-r]')], on = !boxes.every((b) => b.checked);
    boxes.forEach((b) => (b.checked = on)); btn.textContent = on ? '全不選' : '全選'; btn.setAttribute('aria-pressed', on);
  },
  async copy() {
    const l = inviteLink(snap.code, snap.kind), gn = GAMES[snap.kind].name;
    // 手機優先叫出系統分享面板（LINE／訊息一步到位）；使用者按取消不算失敗
    if (navigator.share) { try { return await navigator.share({ title: gn, text: `來玩 ${gn}！`, url: l }); } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(l); toast('已複製邀請連結'); } catch { prompt('複製這個連結傳給朋友：', l); }
  },
  start: () => call('start'),
  shuffle: () => call('shuffle'),
  addBot: () => call('addBot'),
  removeBot: (v) => call('removeBot', { id: v }),
  async leave() {
    // 遊戲中途退出是真的退出：牌放回棄牌堆、不能再回來；剩 2 人時你一走房間就關閉，所以先確認
    if (snap?.game && snap.game.status !== 'over') {
      const last2 = snap.game.players.filter((p) => p.in).length <= 2;
      if (!confirm(last2 ? '現在只剩兩人，你離開後房間會關閉，大家都會回到首頁。確定要離開？' : '離開後無法再回到這局，你的牌會放回棄牌堆。確定要離開？')) return;
    }
    await call('leave'); exit();
  },
  back: () => call('back'),
  next: () => call('act', { action: { type: 'next' } }),
  draw: (v) => call('act', { action: { type: 'draw', from: v } }),
  fcard(v) { sel = new Set(sel.has(+v) ? [] : [+v]); render(); }, // 富士流一次只能選一張
  fplay: () => call('act', { action: { type: 'play', card: [...sel][0] } }).then((r) => r && sel.clear()),
  ccard(v) { if (snap?.game?.myPick != null) return toast('已蓋牌，點下方「收回重選」即可換牌'); sel = new Set(sel.has(+v) ? [] : [+v]); render(); }, // 貓貓食堂一次選一張蓋牌
  cpick: () => call('act', { action: { type: 'pick', card: [...sel][0] } }).then((r) => r && sel.clear()),
  cunpick: () => call('act', { action: { type: 'unpick' } }),
  // 馬尼拉動作
  mStockSheet() { ms.stockSheet = !ms.stockSheet; render(); },
  mInfoSheet() { ms.infoSheet = !ms.infoSheet; render(); },
  mMortgage: (v) => call('act', { action: { type: 'mortgage', idx: +v } }),
  mRedeem: (v) => call('act', { action: { type: 'redeem', idx: +v } }),
  mBidStep(v) {
    const min = Math.max(1, (snap?.game?.auction?.high ?? 0) + 1);
    ms.bidAmt = Math.max(min, (ms.bidAmt || min) + +v);
    render();
  },
  mBid: (v) => call('act', { action: { type: 'bid', amount: +v } }),
  mPass: () => call('act', { action: { type: 'pass' } }),
  mBuy: (v) => call('act', { action: { type: 'buyStock', good: v } }),
  mPickGood(v) {
    const arr = ms.masterGoods;
    if (arr.includes(v)) ms.masterGoods = arr.filter((x) => x !== v);
    else if (arr.length < 3) { ms.masterGoods = [...arr, v]; if (ms.masterGoods.length === 3) { ms.masterGoods.forEach((k) => (ms.masterPos[k] = 3)); } }
    else toast('最多選 3 種貨物，請先取消其中一種');
    render();
  },
  mPreset(v) {
    const nums = v.split(',').map(Number);
    ms.masterGoods.forEach((k, i) => { ms.masterPos[k] = nums[i] ?? 0; });
    render();
  },
  mPos(v) {
    const [k, d] = v.split(':');
    ms.masterPos[k] = Math.max(0, Math.min(5, (ms.masterPos[k] ?? 0) + +d));
    render();
  },
  mSail() {
    const ships = ms.masterGoods.map((good) => ({ good, pos: ms.masterPos[good] ?? 0 }));
    return call('act', { action: { type: 'setupShips', ships } });
  },
  mSpot(v) { ms.spot = ms.spot === v ? null : v; render(); },
  mPlace: () => call('act', { action: { type: 'place', spot: ms.spot } }).then((r) => { if (r) ms.spot = null; }),
  mPassPlace: () => call('act', { action: { type: 'passPlace' } }),
  mNav(v) {
    const [si, d] = v.split(':').map(Number);
    ms.navMoves[si] = (ms.navMoves[si] || 0) + d;
    if (!ms.navMoves[si]) delete ms.navMoves[si];
    render();
  },
  mNavGo() {
    const moves = Object.entries(ms.navMoves).filter(([, d]) => d !== 0).map(([si, delta]) => ({ ship: +si, delta }));
    return call('act', { action: { type: 'navigate', moves } }).then((r) => { if (r) ms.navMoves = {}; });
  },
  mRoll: () => call('act', { action: { type: 'roll' } }),
  mPBoard(v) {
    if (v === 'skip') return call('act', { action: { type: 'pirateBoard', ship: null } });
    const [si, ki] = v.split(':').map(Number);
    return call('act', { action: { type: 'pirateBoard', ship: si, ...(ki >= 0 ? { kickIdx: ki } : {}) } });
  },
  mPPick(v) { ms.plunderShip = +v; render(); },
  mPDecide(v) {
    const [si, dest] = v.split(':');
    return call('act', { action: { type: 'pirateDecide', ship: +si, dest } });
  },
  fseat(v) {
    const p = snap?.game?.players?.find((x) => x.id === v);
    if (!p) return;
    const tag = p.left ? '已離開' : `剩 ${p.n} 張${p.card ? ` · 場上 ${p.card.n}${p.sum > p.card.n ? `（同盟合計 ${p.sum}）` : ''}` : ' · 尚未出牌'}`;
    toast(`${p.name}${p.id === snap.me ? '（你）' : ''}：${tag}`);
  },
  card(v) {
    endFor = null;
    if (actSlot === null) sel.has(+v) ? sel.delete(+v) : sel.add(+v);
    else { // 有作用中的組：點牌就直接放入；這組滿了自動換到下一個還沒滿的組
      const req = phaseReq(), cnt = (gi) => Object.values(slots).filter((x) => x === gi).length, full = (gi) => cnt(gi) >= req[gi][1];
      slots[v] = actSlot;
      // 剛好放滿才自動跳下一組；放滿之後繼續點牌就是多放（接牌），要再點該組才會回來
      if (cnt(actSlot) === req[actSlot][1]) actSlot = req.findIndex((_, gi) => !full(gi)) < 0 ? null : req.findIndex((_, gi) => !full(gi));
    }
    render();
  },
  slot(v) { // 有先選好的牌 → 整批放入（舊流程仍可用）；否則切換作用中的組
    if (sel.size) { sel.forEach((id) => (slots[id] = +v)); sel.clear(); actSlot = null; } else actSlot = actSlot === +v ? null : +v;
    render();
  },
  unslot(v) { delete slots[v]; render(); },
  lo(v) { const [gi, l] = v.split(':').map(Number); los[gi] = l; render(); },
  sheet() { sheet = !sheet; render(); },
  hist(v) { histFor = v || null; render(); }, // 玩家卡帶 id → 開；遮罩／✕ 沒有 → 關
  rxMenu() { rxOpen = !rxOpen; render(); },
  react(v) { rxOpen = false; render(); call('react', { e: v }); },
  sort() { byColor = !byColor; render(); },
  async lay() {
    const groups = phaseReq().map((_, gi) => Object.keys(slots).filter((id) => slots[id] === gi).map(Number));
    if (await call('act', { action: { type: 'lay', groups, los: groups.map((_, gi) => curLo(gi)) } })) { slots = {}; los = {}; actSlot = null; }
  },
  hit(v, el) {
    const gr = snap.game.groups[+v], end = el.dataset.end;
    // 順子 + 選到百搭 + 還沒指定方向 → 先問接前/接後（純數字牌伺服器會自己判斷）
    if (gr.type === 'run' && !end && snap.game.hand.some((c) => sel.has(c.id) && c.t === 'w')) { endFor = +v; return render(); }
    return call('act', { action: { type: 'hit', group: +v, cards: [...sel], end } }).then((r) => { endFor = null; r ? sel.clear() : render(); });
  },
  discard: (v) => call('act', { action: { type: 'discard', card: [...sel][0], target: v } }).then((r) => r && sel.clear()),
  xt(v) { xs.target = v; render(); },
  xg(v) { xs.give = xs.give === +v ? null : +v; render(); },
  xcancel() { sel.clear(); xs = { target: null, v: null, give: null }; render(); },
  plain() { return call('act', { action: { type: 'discard', card: [...sel][0], plain: true } }).then((r) => { if (r) { sel.clear(); xs = { target: null, v: null, give: null }; } }); },
  xv(v) { xs.v = /\d/.test(v) ? +v : v; render(); },
  swap() {
    const kind = snap.game.hand.find((c) => c.id === [...sel][0]).t;
    return call('act', { action: { type: 'discard', card: [...sel][0], target: xs.target, give: xs.give, [kind === 'xn' ? 'num' : 'color']: xs.v } }).then((r) => { if (r) { sel.clear(); xs = { target: null, v: null, give: null }; } });
  },
};
$('#skipBan').addEventListener('click', (e) => { const v = e.target.dataset.v; if (v) { $('#skipBan').classList.remove('on'); call('react', { e: v }); } }); // 被跳過時橫幅上的快捷表情
$('#mDiceStage').addEventListener('click', closeManilaDice); // 擲骰動畫點任意處可提前關閉
// 拖曳百搭：放開時越過最前／最後一張數字牌的中心 → 整段順子平移一格（等於 los 加減一），所以伺服器不用改
$('#app').addEventListener('pointerdown', (e) => {
  noClick = false;
  const el = e.target.closest('[data-drag]');
  if (!el || e.button) return;
  drag = { el, x: e.clientX, moved: false };
  el.setPointerCapture(e.pointerId);
});
$('#app').addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 6) drag.moved = true;
  if (drag.moved) { drag.el.classList.add('dragging'); drag.el.style.transform = `translateX(${dx}px)`; }
});
const endDrag = (e) => {
  const d = drag; drag = null;
  if (!d) return;
  if (!d.moved) return e.type === 'pointercancel' ? render() : 0; // 沒拖動就是一般點擊（拿回手上），交給 click；補畫拖曳期間被略過的快照
  noClick = true;
  const [gi, side] = d.el.dataset.drag.split(':'), lay = runLayout(+gi);
  if (lay && e.type === 'pointerup') {
    const kinds = lay.map((x) => x.c.t), cells = [...d.el.parentElement.children];
    const mid = (k) => { const r = cells[k].getBoundingClientRect(); return r.left + r.width / 2; };
    if (side === 'L' && e.clientX > mid(kinds.lastIndexOf('n'))) los[gi] = curLo(+gi) + 1;
    if (side === 'R' && e.clientX < mid(kinds.indexOf('n'))) los[gi] = curLo(+gi) - 1;
  }
  render();
};
$('#app').addEventListener('pointerup', endDrag);
$('#app').addEventListener('pointercancel', endDrag);
$('#app').addEventListener('click', (e) => {
  if (noClick) { noClick = false; return; }
  if (rxOpen && !e.target.closest('.rxw')) { rxOpen = false; render(); } // 點選單外面 → 收起（點到別的按鈕時仍照常執行）
  const why = e.target.closest('[data-why]')?.dataset.why; // 停用的按鈕 pointer-events:none，點擊落在外層 → 說明為什麼不能按
  if (why) return toast(why);
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled) A[el.dataset.a]?.(el.dataset.v, el);
});
$('#app').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); } }); // div 型按鈕（玩家卡、組合、放階段欄）要自己補鍵盤操作
$('#app').addEventListener('focusout', (e) => { if (e.target.matches?.('select') && snap) render(); }); // 補上選單開著時被略過的重繪
$('#app').addEventListener('change', (e) => {
  if (e.target.dataset.r !== undefined) { // 建房頁的規則勾選：全勾了按鈕顯示「全不選」
    const boxes = [...document.querySelectorAll('[data-r]')], all = boxes.every((b) => b.checked), btn = $('[data-a="allRules"]');
    if (btn) { btn.textContent = all ? '全不選' : '全選'; btn.setAttribute('aria-pressed', all); }
    return;
  }
  const k = e.target.dataset.c;
  if (k) e.target.blur(); // 選完就放開焦點，不然「焦點在 select 時略過重繪」會讓房主一直看不到新加入的玩家
  if (k) call('settings', { [k]: e.target.type === 'checkbox' ? e.target.checked : (k === 'target' || k === 'rounds' ? +e.target.value : e.target.value) });
});
if (sess) connect(); else render();
</script>
