<!doctype html>
<html lang="zh-Hant">
<head>

<title>Phase 10・富士流・貓貓食堂</title>
<style>
/* 字級只有 4 級、字重只有 400/600；間距走 4/8 格線。--mute 在 --panel2 上 4.84:1（原 #a8c7b8 只有 3.57） */
:root{--s1:12px;--s2:16px;--s3:20px;--s4:28px;--bg:#0f3d2e;--panel:#165740;--panel2:#1d6a4f;--ink:#f6f3ea;--mute:#cfe3d8;--accent:#f6c945;--R:#d64545;--B:#3b73d4;--G:#2e9e5b;--Y:#e0b020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--s2)/1.4 system-ui,-apple-system,"Noto Sans TC",sans-serif;touch-action:manipulation;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#app:has(.tray),#app:has(.cta){padding-bottom:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column} /* 內容不滿一屏時，sticky 托盤會浮在半空 → 撐滿一屏，用 margin-top:auto 把托盤推到最底 */
#app{max-width:1000px;margin:0 auto;padding:12px 16px 40px}
h1{margin:8px 0 16px;font-size:var(--s4);letter-spacing:.5px}h2{font-size:var(--s2);margin:0 0 8px;color:var(--mute);font-weight:600}
.panel{background:var(--panel);border-radius:12px;padding:16px;margin-bottom:12px}
b{font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;border-radius:8px;border:0;padding:8px 16px}
button{background:var(--accent);color:#2a2200;font-weight:600;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed;pointer-events:none} /* 點擊穿透到外層 [data-why]，用 toast 說明為什麼不能按 */
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--mute)}
input,select{font-size:16px;background:#0c2f23;color:var(--ink);border:1px solid #2f7d5f} /* iOS 對 <16px 的輸入框聚焦會自動放大整頁 */
button,.card{-webkit-user-select:none;user-select:none}
.mute{color:var(--mute)}.big{font-size:var(--s4);letter-spacing:6px;font-weight:600}
.player{background:var(--panel2);border-radius:10px;padding:8px 12px;min-width:120px;flex:1;border:2px solid transparent}
.player[data-a]{cursor:pointer}.player[data-a]:active{filter:brightness(1.2)}.player:focus-visible{outline:2px solid var(--accent)}.player.turn{border-color:var(--accent)}.player.out{opacity:.4}
.pick{margin-top:4px;font-size:var(--s1);display:flex;align-items:center;gap:8px}.pick .card{box-shadow:none}
.player .nm{display:block;min-width:0;overflow-wrap:anywhere;line-height:1.25}.player small{color:var(--mute)}.player .ft{display:flex;justify-content:space-between;align-items:flex-end;gap:4px;margin-top:4px}
.cnt{font-size:var(--s3);font-weight:600;line-height:1;white-space:nowrap}.cnt small{font-size:var(--s1);font-weight:400}
.table{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.piles{display:flex;gap:12px}
.pile{text-align:center;font-size:var(--s1);color:var(--mute)}
.groups{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:220px}
.group{position:relative;background:var(--panel2);border-radius:10px;padding:8px}
.group.can{outline:2px dashed var(--accent);cursor:pointer}
.ends{position:absolute;inset:0;display:flex;gap:4px;padding:4px;background:#0c2f23d9;border-radius:10px}.ends button{flex:1}
.group .row{gap:4px}.group small{display:block;color:var(--mute);margin-bottom:4px}
.card{position:relative;width:46px;height:64px;border-radius:7px;border:2px solid #fff;color:#fff;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-weight:600;box-shadow:0 1px 3px #0006;flex:none}
.card b{font-size:var(--s3);line-height:1}.card i{font-style:normal;font-size:var(--s1);opacity:.9}
.card u{position:absolute;bottom:1px;right:3px;font-size:var(--s1);text-decoration:none}
.card.sm{width:34px;height:48px}.card.sm b{font-size:var(--s2)}
.card.R{background:var(--R)}.card.B{background:var(--B)}.card.G{background:var(--G)}.card.Y{background:var(--Y);color:#2a2200}
.card.W{background:conic-gradient(var(--R),var(--Y),var(--G),var(--B),var(--R))}.card.W b,.card.W i,.card.W u{text-shadow:0 0 4px #000,0 0 2px #000}
.card.S{background:#222}.card.X{background:#5b3a8c}.card.back{background:repeating-linear-gradient(45deg,#7b2d8f,#7b2d8f 6px,#5d2070 6px,#5d2070 12px)}
.card.new{outline:3px solid #fff;box-shadow:0 0 12px 3px var(--accent)}
.card.new::after{content:'新';position:absolute;top:-8px;left:-8px;background:var(--accent);color:#2a2200;font-size:var(--s1);line-height:16px;border-radius:8px;padding:0 8px}
.card.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}

.card[data-drag]{cursor:grab;touch-action:none;outline:2px dashed var(--accent);outline-offset:2px}.card.dragging{cursor:grabbing;z-index:5;box-shadow:0 6px 16px #000a}

.hand{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0 4px}
.tray{position:sticky;bottom:0;z-index:2;margin:auto -16px 0;padding:8px 16px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid #2f7d5f;box-shadow:0 -8px 16px #0a2a1f99}
.tray>b{display:block}.tray .hand{padding:12px 0 8px}
.act button{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px}
.players{margin:12px 0;align-items:stretch}.ic{min-width:44px;min-height:44px;padding:0}
.slot.can{outline:2px dashed var(--accent);cursor:pointer}
.pile .card{width:56px;height:80px}.pile .card b{font-size:var(--s3)}
@keyframes glow{to{box-shadow:0 0 0 3px var(--accent),0 0 16px 4px var(--accent)}}
.pile button.card:not(:disabled){animation:glow 1s ease-in-out infinite alternate}
.overlay.sheet{align-items:flex-end;padding:0}.sheet .modal{border-radius:16px 16px 0 0;max-height:80vh;max-height:80dvh}.modal .log{max-height:none}
.bd{position:absolute;inset:0}.act .w{flex:1;display:flex}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.slot{background:#0c2f23;border-radius:8px;padding:8px;margin-top:8px}
.slotH{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.slot .row{min-height:48px}
.log{font-size:var(--s1);color:var(--mute);max-height:90px;overflow:auto}
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal{background:var(--panel);border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:90vh;max-height:90dvh;overflow:auto;position:relative}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left}th{color:var(--mute);font-weight:600}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#000d;padding:8px 16px;border-radius:10px;z-index:9;display:none}
tr.me{color:var(--accent);font-weight:600}h2 small{font-weight:400}
.crown{color:var(--accent)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:#777}.dot.on{background:#5fe08a}
@media(max-width:600px){
#app{padding:8px 8px 32px}.panel{padding:12px}h1{font-size:var(--s3)}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}.player{min-width:0;padding:8px}
.piles{width:100%;justify-content:center}.groups{min-width:0;width:100%}
.hand{gap:4px}.card{width:40px;height:56px}.card.sm{width:32px;height:46px}
button,select,input{min-height:40px}
.tray{margin:auto -8px 0;padding:8px 8px calc(12px + env(safe-area-inset-bottom))}
.cta{margin:auto -8px 0;padding:12px 8px calc(12px + env(safe-area-inset-bottom))} /* 負邊距要跟 #app 的左右內距（8）一樣，否則整頁會橫向溢出 */
.slotH{flex-wrap:wrap}.big{letter-spacing:4px}
input[readonly]{width:100%}
}
/* 橫放手機高度只有 ~375px：手牌改單排橫捲，按鈕縮矮，托盤才不會吃掉半個畫面 */
@media(max-height:500px){.tray .hand{flex-wrap:nowrap;overflow-x:auto}.act button{min-height:40px}}
/* 結算畫面：按鈕固定在 modal 底部（玩家多、剩牌多時中間捲動，按鈕仍在拇指區） */
.modal.res-m{display:flex;flex-direction:column;overflow:hidden}.res-m .body{overflow:auto;flex:1;min-height:0;padding:4px}.res-m .foot{padding-top:16px}
.res{background:var(--panel2);border-radius:10px;padding:12px;margin-top:8px}.res.me{outline:2px solid var(--accent)}
.rk{padding:16px;font-size:var(--s3)}.rk.me{background:var(--accent);color:#1a1a1a;outline:0} /* 排行榜：列加大；自己整列反白（深字 on 黃底） */
.hd{font-size:var(--s4);font-weight:600;margin-bottom:8px}
.cd.warn{display:inline-block;font-size:var(--s3);animation:shake 1s both}
@keyframes shake{0%{transform:scale(1)}12%{transform:scale(1.9) rotate(-8deg)}28%{transform:scale(1.7) rotate(8deg)}44%{transform:scale(1.7) rotate(-6deg)}60%{transform:scale(1.5) rotate(5deg)}100%{transform:scale(1)}}
#skipBan{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:8;display:none;pointer-events:none;text-align:center;font-size:var(--s4);font-weight:600;background:#000d;border:3px solid var(--accent);border-radius:16px;padding:20px 28px;box-shadow:0 0 32px 8px #f6c94588;max-width:90vw}
#skipBan.on{display:block;animation:ban 2.4s both}#skipBan button{pointer-events:auto;font-size:var(--s4);padding:0 16px}
/* 表情：浮動層放在 #app 外面（render 會重建 #app）；入口是頂列 😀 + 往下展開的選單 */
#rx{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.rxb{position:absolute;text-align:center;font-size:var(--s4);line-height:1;animation:rxup 2s ease-out both}
.rxb small{display:block;margin-top:4px;font-size:var(--s1);background:#000a;border-radius:8px;padding:0 8px;white-space:nowrap}
@keyframes rxup{0%{transform:translate(-50%,0) scale(.4);opacity:0}15%{transform:translate(-50%,-8px) scale(1.2);opacity:1}25%{transform:translate(-50%,-16px) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-72px);opacity:0}}
.rxw{position:relative}
.rxp{position:absolute;right:0;top:calc(100% + 8px);z-index:4;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;width:max-content;max-width:calc(100vw - 16px);padding:8px;background:var(--panel);border:1px solid #2f7d5f;border-radius:12px;box-shadow:0 8px 16px #0a2a1f99}
.rxp button{background:transparent;font-size:var(--s3);min-width:44px;min-height:44px;padding:0}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}12%{transform:translate(-50%,-50%) scale(1.15);opacity:1}20%,80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%);opacity:0}}
.fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}.fld label{color:var(--mute);font-size:var(--s1)}.fld select,.fld input{width:100%}
.rhd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.rhd h2{margin:0}.rhd button{min-height:44px}
.rule{display:flex;gap:12px;align-items:center;min-height:56px;padding:8px 12px;margin-top:8px;border-radius:10px;background:#0c2f23;border:2px solid transparent;cursor:pointer}
.rule:has(input:checked){border-color:var(--accent);background:#1d6a4f}.rule:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.rule input{position:absolute;opacity:0;width:44px;height:44px;margin:0}.rule i{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-style:normal;color:transparent;font-size:var(--s1);font-weight:600}
.rule:has(input:checked) i{background:var(--accent);border-color:var(--accent);color:#2a2200}.rule span{flex:1;min-width:0}.rule small{display:block;color:var(--mute)}
.cta{position:sticky;bottom:0;z-index:2;margin:auto -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid #2f7d5f}.cta button{width:100%;min-height:48px;font-size:var(--s2)}
.xs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px #0a2a1fcc;max-height:75vh;max-height:75dvh;overflow:auto}
.xs h3{margin:16px 0 8px;font-size:var(--s2);font-weight:600;color:var(--mute)}.xs h3:first-child{margin-top:0}.xs .row{gap:8px}
.xs button.on{background:var(--accent);color:#2a2200}.xs .nums button{min-width:44px;min-height:44px;padding:0}.xs .give .card{box-shadow:none}.xs .give .card.sel{outline:3px solid var(--accent);transform:translateY(-4px)}
.xs .go{width:100%;min-height:48px;margin-top:16px}
.card.X b{font-size:var(--s3)}.card.X i{font-size:11px;line-height:1.1;text-align:center;max-width:100%}
.trophy{display:inline-block;animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
/* 首頁選遊戲、房間、富士流牌桌（手機優先；字級只用 --s1..4，間距 4/8 格線） */
.gsel{display:flex;gap:8px}.gsel button{flex:1;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 8px;line-height:1.2}.gsel .gi{font-size:var(--s4);line-height:1}.gsel small{font-weight:400}

.fold{background:transparent;color:var(--mute);font-weight:400;width:100%;min-height:44px;padding:8px 0;display:flex;align-items:center;gap:8px;text-align:left}.fold::before{content:'▸'}.fold[aria-expanded=true]::before{content:'▾'}.foldb{padding-bottom:8px}

.card.F{background:hsl(var(--h,210) 60% 40%);font-variant-numeric:tabular-nums}.card.md{width:44px;height:60px}.card.md b{font-size:var(--s3)}

.fmeta{font-size:var(--s1);color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--panel);padding:4px 8px;border-radius:8px;border:1px solid #2f7d5f}

.fstage{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 0;min-height:0}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    : `<div>共進行 <b>${st.rounds} 輪</b>，最高分者成為喵喵之王</div>`;
  const rulesPanel = fj
    ? `<div class="panel"><h2>規則</h2><p style="margin:0">每回合 ${st.turn} 秒，超時自動代打（出最小的牌）。3–6 人每人發 6 張，7–8 人發 5 張。</p>${fold('rules', '完整玩法', fujiRules())}</div>`
    : ct
    ? `<div class="panel"><h2>規則</h2>${catSet}<p style="margin:8px 0 0">每手 ${st.turn} 秒，超時自動出最小的牌。每輪結算：第一名 +2、第二名 +1、最低分 −1。</p>${fold('rules', '完整玩法', catsRules())}</div>`
    : `<div class="panel"><h2>規則</h2>${set}
    <p>每回合 ${st.turn} 秒，超時自動代打。</p>
    ${RULES.some(([k]) => st.rules[k]) ? `<ul style="margin:8px 0;padding-left:20px">${RULES.filter(([k]) => st.rules[k]).map(([, t, d]) => `<li style="margin-top:8px"><b>${t}</b><br><small class="mute">${d}</small></li>`).join('')}</ul>${['rv', 'sh', 'xn', 'xc'].some((k) => st.rules[k]) ? `<p class="mute" style="margin:8px 0">${SP_NOTE}</p>` : ''}` : '<p class="mute">標準規則</p>'}
    <p class="mute">每人發 10 張牌。只有完成當前階段的人，下一回合才能進下一階段；沒完成就繼續挑戰同一階段。有人完成目標階段後，該回合結束時比總分（低者勝）。</p></div>`;
  // 主動作（分享邀請）一顆大按鈕；連結和 QR 只有面對面才需要，收起來。開始遊戲固定在底部（拇指區）
  return `<h1>${GM.icon} ${GM.name}</h1>
  <div class="panel"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><div class="mute">房間代碼</div><div class="big">${s.code}</div></div><button data-a="copy" style="min-height:48px">${navigator.share ? '分享邀請' : '複製連結'}</button></div>
    ${fold('qr', '面對面？用 QR code 或連結加入', `<input readonly value="${esc(link)}" onfocus="this.select()" style="width:100%">${qrBox(link)}`)}</div>
  <div class="panel"><div class="rhd"><h2>玩家 ${n}/${s.max}</h2>${host && n > 1 ? '<button class="ghost" data-a="shuffle">🔀 隨機排位子</button>' : ''}</div>
    ${s.players.map((p) => `<div class="pl">${av(p.name)}<span class="nmx">${esc(p.name)}${p.id === s.me ? ' <span class="mute">（你）</span>' : ''}${p.id === s.host ? ' <span class="crown">👑</span>' : ''}</span><span class="dot ${p.online ? 'on' : ''}" role="img" aria-label="${p.online ? '在線' : '離線'}" style="margin:0"></span></div>`).join('')}
    <p class="mute" style="margin:8px 0 0">${need ? `再邀請 ${need} 位朋友就能開始（${s.min}–${s.max} 人）` : host ? '人數夠了，可以開始！' : '人數夠了，等房主開始'}</p></div>
  ${rulesPanel}
  <div class="cta"><div class="row"><button class="ghost" data-a="leave" style="min-height:48px">離開</button>${host ? `<span class="w" data-why="${need ? `至少需要 ${s.min} 人` : ''}"><button data-a="start" ${need ? 'disabled' : ''}>開始遊戲</button></span>` : '<span class="mute" style="flex:1;text-align:center">等待房主開始…</span>'}</div></div>`;
}

function game() {
  const s = snap, g = s.game, me = s.me, mine = g.players.find((p) => p.id === me);
  const myTurn = g.turn === me, canAct = myTurn && g.stage === 'act';
  const laying = g.status === 'play' && mine.in && !mine.laid;
  if (!laying) actSlot = null;
  if (g.status !== 'play') sheet = false, histFor = null; // 結算畫面出現時收起 📋 面板，免得下一回合自己彈出來
  const online = Object.fromEntries(s.players.map((p) => [p.id, p.online]));
  const ids = new Set(g.hand.map((c) => c.id));
  sel.forEach((id) => ids.has(id) || sel.delete(id));
  Object.keys(slots).forEach((id) => ids.has(+id) || delete slots[id]);
  // 抽牌動畫：手牌比上次多出來的牌 = 剛抽到的（只在該次 render 播動畫），標記「新」直到我棄牌結束回合
  if (seen?.round !== g.round) { seen = { round: g.round, ids: null, drawn: null, laid: null }; slots = {}; los = {}; actSlot = null; } // 新回合發牌不算抽牌；牌 id 每局重編，舊預放要清
  // 放下階段是整場的 peak：自己 → 震動 + 慶祝；別人 → 橫幅提醒（只在「剛變成已放下」的那次 render 觸發）。
  // 不顯示階段數字：放完最後一張牌時伺服器已把 phase+1，數字會差一。
  if (seen.laid) g.players.forEach((p) => { if (p.laid && !seen.laid.has(p.id)) { if (p.id === me) { navigator.vibrate?.(30); toast('🎉 階段完成！'); } else toast(`${p.name} 放下了階段`); } });
  seen.laid = new Set(g.players.filter((p) => p.laid).map((p) => p.id));
  const fresh = seen.ids ? [...ids].filter((id) => !seen.ids.has(id)) : [];
  seen.ids = ids;
  if (!canAct || !ids.has(seen.drawn)) seen.drawn = null;
  if (fresh.length === 1) seen.drawn = fresh[0];
  const rank = (c) => (c.t === 'n' ? (byColor ? 'RBGY'.indexOf(c.c) * 13 + c.n : c.n * 4 + 'RBGY'.indexOf(c.c)) : c.t === 'w' ? 100 : 101 + (SP[c.t] ? Object.keys(SP).indexOf(c.t) : 0)); // 顏色模式：同色排一起，色內依數字
  const hand = [...g.hand].sort((a, b) => rank(a) - rank(b));
  const req = g.phases[mine.phase - 1] || [];
  const name = (id) => g.players.find((p) => p.id === id)?.name ?? '?';
  // 特殊牌效果：新事件才彈出橫幅（第一次 render／重連只記錄，不重播舊事件）
  const ev = g.ev, nm = (id) => (id === me ? '你' : name(id));
  if (seen.evNo !== undefined && ev && ev.no !== seen.evNo) {
    const hit = ev.to === me, who = `<span class="crown">${esc(nm(ev.by))}</span>`, to = `<span class="crown">${esc(nm(ev.to))}</span>`;
    const what = { s: `⏭ ${who} 跳過了 ${to}`, rv: `⟲ ${who} 打出迴轉牌，方向反過來了`, sh: `⇄ ${who} 打出換位牌，座位重排了`}[ev.kind]
      || `${SP[ev.kind][0]} ${who} 指定 ${to} 的${ev.kind === 'xn' ? `數字 ${ev.want}` : `${CN[ev.want]}色`}：${!ev.ok ? '對方沒有，落空' : ev.got ? `${esc(nm(ev.by))}${ev.by === me ? '拿到' : '換走'} ${card(ev.by === me ? ev.got : ev.give, { tag: 'span', cls: 'sm' })}` : '交換成功'}`;
    skipBanner(`${what}${hit && ev.kind === 's' ? '<div style="margin-top:12px"><button data-v="😡" aria-label="回應生氣">😡</button></div>' : ''}`, hit && ev.kind === 's' ? 4000 : ev.got ? 4000 : 2400);
    if (hit) navigator.vibrate?.([60, 40, 60]);
  }
  seen.evNo = ev ? ev.no : null;
  const picked = hand.filter((c) => sel.has(c.id));
  if (!canAct || !picked.length) endFor = null;

  const players = g.players.map((p) => `<div class="player ${g.turn === p.id ? 'turn' : ''} ${p.in ? '' : 'out'}" data-pid="${p.id}" ${p.in ? `data-a="hist" data-v="${p.id}" role="button" tabindex="0" aria-haspopup="dialog"` : ''}>
    <b class="nm">${esc(p.name)}${p.id === me ? '（你）' : ''}</b>
    <div class="ft"><small>${p.left ? '已離開' : `<span style="white-space:nowrap">階段 ${p.phase > 10 ? 10 : p.phase}${p.laid ? ' ✅' : ''}</span><br>${p.score} 分${online[p.id] ? '' : ' 💤'}${p.skip === 1 ? '<br>⏭將被跳過' : ''}`}</small>${p.left ? '' : `<span class="cnt" aria-label="${p.n} 張">${p.n}<small>張${p.in ? ' ›' : ''}</small></span>`}</div>
    ${p.id === me || !p.pick ? '' : `<div class="pick">${p.pick.from === 'pile' ? '🂠 抽牌堆' : `♻ 撿棄牌 ${card(p.pick.card, { tag: 'span', cls: 'sm' })}`}</div>`}</div>`).join('');

  // 排名：先比階段（高者優先）再比分數（低者優先）。同條件並列同名次。
  const cmp = (a, b) => b.phase - a.phase || a.score - b.score;
  const sorted = g.players.filter((p) => !p.left).sort(cmp); // 離開的人不列入排名
  const ranking = sorted.map((p) => `<tr class="${p.id === me ? 'me' : ''}"><td>${sorted.findIndex((q) => !cmp(q, p)) + 1}</td><td>${esc(p.name)}</td>
    <td>階段 ${Math.min(p.phase, 10)} ${p.laid ? '✅' : ''}</td><td>${p.score} 分</td></tr>`).join('');

  const groups = g.groups.map((gr, i) => {
    const t = gr.type === 'set' ? `${gr.n} 同數` : gr.type === 'run' ? `順子 ${gr.lo}–${gr.hi}` : `同色（${CN[gr.c]}）`;
    const cs = gr.cards.map((c, k) => card(c, { tag: 'div', cls: 'sm', sub: c.t === 'w' ? (gr.type === 'set' ? gr.n : gr.type === 'run' ? gr.lo + k : '') : '' })).join('');
    // 選了牌後整組變成點擊目標（不再長按鈕列，版面不會跳）；選到百搭的順子才多問接前/接後（覆蓋層，不占版面）
    const can = canAct && mine.laid && picked.length;
    const ends = can && endFor === i ? `<div class="ends"><button data-a="hit" data-v="${i}" data-end="lo">‹ 接前</button><button data-a="hit" data-v="${i}" data-end="hi">接後 ›</button></div>` : '';
    return `<div class="group ${can ? 'can' : ''}" ${can ? `data-a="hit" data-v="${i}" role="button"` : ''}><small>${esc(name(gr.owner))} · ${t}</small><div class="row">${cs}</div>${ends}</div>`;
  }).join('');

  const need = req.map(([, n], gi) => hand.filter((c) => slots[c.id] === gi).length >= n);
  // 放階段：點某一組讓它「作用中」，再直接點手牌放入（滿了自動跳下一組）；點組內的牌拿回手上。放下階段的按鈕在底部托盤。
  // 百搭多出來時：選順子從幾開始（例如 2,3,4＋百搭 → 1–4 或 2–5）
  const runBtns = (gi, size) => { const rg = runRange(gi), cur = curLo(gi); if (!rg) return ''; let b = ''; for (let l = rg[0]; l <= rg[1]; l++) b += `<button class="${l === cur ? '' : 'ghost'}" data-a="lo" data-v="${gi}:${l}" aria-pressed="${l === cur}">${l}–${l + size - 1}</button>`; return `<span class="row">${b}</span>`; };
  const layUI = laying ? `<div>${req.map((r, gi) => {
    const cs = hand.filter((c) => slots[c.id] === gi), on = actSlot === gi;
    // 放滿的順子照實際順序排，百搭標出它代表的數字；頭尾能換邊的百搭可以拖
    const shown = runLayout(gi) || cs.map((c) => ({ c }));
    return `<div class="slot ${on ? 'can' : ''}" data-a="slot" data-v="${gi}" role="button" aria-pressed="${on}"><div class="slotH"><span>組 ${gi + 1}：${lab(r)}（${cs.length}/${r[1]}）</span>${runBtns(gi, cs.length)}</div>
      <div class="row">${shown.map(({ c, n, mv }) => card(c, { attrs: `data-a="unslot" data-v="${c.id}"${mv ? ` data-drag="${gi}:${mv}"` : ''}`, sub: c.t === 'w' ? n : '' })).join('') ||`<span class="mute">${on ? '點下方手牌放入這組' : '點這組，再點下方手牌'}</span>`}</div></div>`;
  }).join('')}<p class="mute" style="margin:8px 0 0">順子可用百搭補洞；每組至少要有一張數字牌；放滿後還能接的牌可以一起放（等於順便接牌）${req.some((_, gi) => runLayout(gi)?.some((x) => x.mv)) ? '。虛線的百搭可以拖到另一頭' : ''}${canAct ? '' : '。可先排好牌，輪到你抽完牌後再放下'}</p></div>` : '';

  const free = hand.filter((c) => slots[c.id] === undefined);
  const one = picked.length === 1 ? picked[0] : null;
  const targets = g.players.filter((p) => p.in && p.id !== me && p.skip === 0);
  // 停用的按鈕不吞掉點擊（CSS pointer-events:none），外層 data-why 會用 toast 說明原因
  const wb = (label, a, why, cls = '') => `<span class="w" data-why="${esc(why)}"><button class="${cls}" data-a="${a}" ${why ? 'disabled' : ''}>${label}</button></span>`;
  const layWhy = need.every(Boolean) ? '' : '每一組都要放滿才能放下階段';
  const layBtn = canAct && laying ? wb('放下階段', 'lay', layWhy, layWhy ? 'ghost' : '') : '';
  const kind = one && g.hand.length > 1 ? one.t : null; // 手上只剩最後一張時直接出完，效果不觸發
  const others = g.players.filter((p) => p.in && p.id !== me);
  const swap = kind === 'xn' || kind === 'xc';
  if (!swap) xs = { target: null, v: null, give: null };
  if (xs.give && !ids.has(xs.give)) xs.give = null;
  const swapOk = swap && xs.target && xs.v && xs.give;
  const discard = !canAct ? '' : kind === 's' && targets.length
    ? `<span>跳過誰？</span>${targets.map((p) => `<button data-a="discard" data-v="${p.id}">${esc(p.name)}</button>`).join('')}`
    : swap ? ''
    : wb('棄牌並結束回合', 'discard', one ? '' : actSlot !== null ? '正在放階段：再點一次該組可取消' : picked.length > 1 ? '一次只能棄一張牌' : '先點一張要棄的牌', layBtn && !layWhy ? 'ghost' : '');
  // 交換牌：結果出來前先選好三件事（對象、數字／顏色、要換出的牌），放在底部抽屜裡；換出的牌也在抽屜內選，不跟手牌區的「已選」標示混在一起
  const give = hand.filter((c) => c.id !== one?.id);
  const swapUI = canAct && swap ? `<div class="overlay sheet" style="background:#0006"><div class="bd" data-a="xcancel"></div><div class="xs" role="dialog" aria-label="${one.t === 'xn' ? '數字' : '顏色'}交換">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2 style="margin:0;color:var(--ink)">${one.t === 'xn' ? '數字' : '顏色'}交換牌</h2><button class="ghost ic" data-a="xcancel" aria-label="取消">✕</button></div>
    <h3>跟誰換</h3><div class="row">${others.map((p) => `<button class="${xs.target === p.id ? 'on' : 'ghost'}" data-a="xt" data-v="${p.id}" aria-pressed="${xs.target === p.id}" style="min-height:44px">${esc(p.name)}</button>`).join('')}</div>
    <h3>指定${one.t === 'xn' ? '數字' : '顏色'}</h3><div class="row nums">${one.t === 'xn' ? [...Array(12)].map((_, i) => `<button class="${xs.v === i + 1 ? 'on' : 'ghost'}" data-a="xv" data-v="${i + 1}" aria-pressed="${xs.v === i + 1}">${i + 1}</button>`).join('') : ['R', 'B', 'G', 'Y'].map((c) => `<button class="${xs.v === c ? 'on' : 'ghost'}" data-a="xv" data-v="${c}" aria-pressed="${xs.v === c}" style="min-height:44px">${CN[c]}</button>`).join('')}</div>
    <h3>你要換出哪張 <small class="mute">（看結果前先決定）</small></h3><div class="row give">${give.map((c) => card(c, { cls: c.id === xs.give ? 'sel' : '', attrs: `data-a="xg" data-v="${c.id}" aria-pressed="${c.id === xs.give}"` })).join('')}</div>
    <button class="go ${swapOk ? '' : 'ghost'}" data-a="swap" ${swapOk ? '' : 'disabled'}>${swapOk ? '打出並交換' : '還沒選完'}</button>
    <button class="ghost go" data-a="plain" style="margin-top:8px">不交換，直接棄牌</button></div></div>` : '';
  const drawWhy = !myTurn ? `還沒輪到你，現在是 ${name(g.turn)}` : g.stage === 'act' ? '這回合已經抽過牌了' : '';
  const topWhy = drawWhy || (!g.top ? '棄牌堆是空的' : g.top.t !== 'n' && g.top.t !== 'w' ? '跳過牌和特殊牌不能撿' : '');

  const status = g.status !== 'play' ? '' : actSlot !== null ? `放入第 ${actSlot + 1} 組：點下方手牌` : myTurn
    ? (g.stage === 'draw' ? '輪到你了：先從牌堆或棄牌堆抽一張' : '放下階段／接牌，最後棄一張牌')
    : `輪到 ${esc(name(g.turn))}`;

  const sheetUI = sheet && g.status === 'play' ? `<div class="overlay sheet"><div class="bd" data-a="sheet"></div><div class="modal">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">排名 <small>階段高者優先，同階段比分數（低者優先）</small></h2><button class="ghost ic" data-a="sheet" aria-label="關閉">✕</button></div>
    <table>${ranking}</table>
    <h2 style="margin-top:16px">10 個階段</h2><table>${g.phases.map((r, i) => `<tr class="${i + 1 === Math.min(mine.phase, 10) ? 'me' : ''}"><td>${i + 1}</td><td>${r.map(lab).join(' ＋ ')}</td></tr>`).join('')}</table>
    <h2 style="margin-top:16px">最近動態</h2><div class="log">${g.log.map(esc).join('<br>')}</div>
    <button class="ghost" data-a="leave" style="width:100%;margin-top:16px">離開房間</button></div></div>` : '';

  // 只有還在場的人可看（離開／加賽淘汰者沒有東西可看；面板開著時對方離開 → 自動關）。最新一手排最上面：重繪會把捲動位置歸零，最新的要永遠看得到
  const hp = g.players.find((p) => p.id === histFor && p.in), who = hp && (hp.id === me ? '你' : esc(hp.name) + ' ');
  const histUI = hp ? `<div class="overlay sheet"><div class="bd" data-a="hist"></div><div class="modal" role="dialog" aria-label="${who}本回合的撿棄牌">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0;color:var(--ink)">${who}本回合的撿棄牌</h2><button class="ghost ic" data-a="hist" aria-label="關閉">✕</button></div>
    ${hp.hist.length ? hp.hist.map((h, i) => `<div class="pick" style="font-size:var(--s2);margin-top:12px"><span class="mute">${i + 1}.</span>${h.from === 'pile' ? '🂠 抽牌堆' : `♻ 撿棄牌 ${card(h.card, { tag: 'span', cls: 'sm' })}`}<span>→</span>${h.disc ? `棄 ${card(h.disc, { tag: 'span', cls: 'sm' })}` : '<span class="mute">出牌中…</span>'}</div>`).reverse().join('') : `<p class="mute">${who}還沒出過牌。輪到之後，這裡會列出每一手撿了或抽了什麼、棄了哪張。</p>`}</div></div>` : '';

  return `<div class="row"><b style="flex:1;min-width:0">${s.code} · 第 ${g.round} 回合${g.playoff ? '（加賽）' : ''}</b>
    <span class="mute" style="white-space:nowrap">${g.rules.rv ? `<span title="${g.dir < 0 ? '反向' : '順向'}" aria-label="${g.dir < 0 ? '反向' : '順向'}">${g.dir < 0 ? '⟲' : '⟳'}</span> ` : ''}目標 ${g.target}</span><b class="cd" aria-live="off"></b>
    <span class="rxw"><button class="ghost ic" data-a="rxMenu" aria-label="送表情" aria-expanded="${rxOpen}">😀</button>${rxOpen ? `<div class="rxp">${EMOJI.map((e) => `<button data-a="react" data-v="${e}" aria-label="${e}">${e}</button>`).join('')}</div>` : ''}</span>
    <button class="ghost ic" data-a="sheet" aria-label="排名、階段表、動態">📋</button></div>
  <div class="row players">${players}</div>
  <div class="panel table">
    <div class="piles">
      <div class="pile" data-why="${esc(drawWhy)}"><button class="card back" aria-label="抽牌堆" data-a="draw" data-v="pile" ${drawWhy ? 'disabled' : ''}><b>抽牌</b></button><br>牌堆 ${g.drawCount}</div>
      <div class="pile" data-why="${esc(topWhy)}">${g.top ? card(g.top, { attrs: `data-a="draw" data-v="discard" ${topWhy ? 'disabled' : ''}` }) : '<div class="card empty"></div>'}<br>棄牌</div>
    </div>
    <div class="groups">${groups || '<span class="mute">還沒有人放下階段</span>'}</div>
  </div>
  <div class="panel">
    <h2>你的階段 ${mine.phase}：${req.map(lab).join(' ＋ ')} ${mine.laid ? '✅ 已完成' : ''}</h2>
    ${layUI}
  </div>

// 結算：依「我贏／別人贏」給不同開場；每人顯示剩下的牌，讓「+N 分」看得出來源；按鈕固定在 modal 底部

  const isLeaderMe = g.leader === me;
  const selNum = sel.size ? [...sel][0] : null;

  // 圓桌幾何：自己固定在 6 點鐘方向，其餘順時針排列
  const N = g.players.length, myIdx = Math.max(0, g.players.findIndex((p) => p.id === me));
  const ring = Array.from({ length: N }, (_, k) => g.players[(myIdx + k) % N]);
  const [Rx, Ry, rx, ry] = N <= 4 ? [39, 42.5, 18.5, 18.5] : [40, 43.5, 20.5, 20.5];
  const pos = ring.map((p, k) => {
    const a = Math.PI / 2 + (2 * Math.PI * k) / N, ca = Math.cos(a), sa = Math.sin(a);
    return { p, k, a, ca, sa, sx: 50 + Rx * ca, sy: 50 + Ry * sa, cx: 50 + rx * ca, cy: 50 + ry * sa };
  });
  const ldrPos = pos.find((x) => x.p.id === g.leader);
  const ldrDeg = ldrPos ? (ldrPos.a * 180 / Math.PI) + 90 : 180;

  const arrows = pos.map(({ a }) => {
    const mid = a + Math.PI / N, ax = 50 + 35.5 * Math.cos(mid), ay = 50 + 35.5 * Math.sin(mid), deg = (mid * 180 / Math.PI) + 90;
    return `<path d="M-1.5 -1.1 L1.5 0 L-1.5 1.1" fill="none" stroke="#f6c45366" stroke-width=".65" stroke-linecap="round" stroke-linejoin="round" transform="translate(${ax.toFixed(1)} ${ay.toFixed(1)}) rotate(${deg.toFixed(1)})"/>`;
  }).join('');
  let spotlight = '';
  if (ldrPos && g.status === 'play') {
    const sp = Math.min(0.38, (Math.PI / N) * 0.75), a1 = ldrPos.a - sp, a2 = ldrPos.a + sp;
    const x1 = (50 + 39.5 * Math.cos(a1)).toFixed(1), y1 = (50 + 39.5 * Math.sin(a1)).toFixed(1);
    const x2 = (50 + 39.5 * Math.cos(a2)).toFixed(1), y2 = (50 + 39.5 * Math.sin(a2)).toFixed(1);
    spotlight = `<path d="M50 50 L${x1} ${y1} A39.5 39.5 0 0 1 ${x2} ${y2} Z" fill="url(#cspot)"/>`;
  }
  const svg = `<svg class="fsvg" viewBox="0 0 100 100" aria-hidden="true">
    <defs><radialGradient id="cspot" cx="50%" cy="50%" r="50%"><stop offset="12%" stop-color="#f6c453" stop-opacity=".28"/><stop offset="100%" stop-color="#f6c453" stop-opacity=".02"/></radialGradient></defs>
    ${spotlight}
    <circle cx="50" cy="50" r="35.5" fill="none" stroke="#f6c45328" stroke-width=".5" stroke-dasharray="1.8 1.8"/>
    ${arrows}</svg>`;

  const lastById = Object.fromEntries((g.last?.picks ?? []).map((x) => [x.id, x]));

  const seats = pos.map(({ p, sx, sy }) => {
    const isMe = p.id === me, isLdr = g.leader === p.id && g.status === 'play';
    const pill = p.left ? '<span class="mute">已離開</span>'
      : p.ready ? `<span class="cpill ok">🐾 ${isMe && g.myPick != null ? `已蓋 ${g.myPick}` : '已蓋牌'}</span>`
      : '<span class="cpill wait">💭 選牌中</span>';
    const aria = `${p.name}${isMe ? '（你）' : ''}${isLdr ? '，本手首領' : ''}，本輪 ${signNum(p.roundScore)} 分，累計得分標記 ${p.tokens} 分，${p.ready ? '已蓋牌' : '尚未蓋牌'}`;
    return `<div class="cseat ${isMe ? 'me' : ''} ${isLdr ? 'ldr' : ''} ${p.in ? '' : 'out'}" data-pid="${p.id}" data-a="hist" data-v="${p.id}" role="button" tabindex="0" aria-haspopup="dialog" aria-label="${esc(aria)}" style="left:${sx.toFixed(2)}%;top:${sy.toFixed(2)}%">
      <div class="cseat-top">${catAv(seatIdx[p.id], isLdr)}<span class="fnm">${esc(p.name)}</span></div>
      <div class="cseat-meta"><span>本輪 <b>${signNum(p.roundScore)}</b></span><span>🏅${p.tokens}${online[p.id] ? '' : ' 💤'}</span></div>
      <div class="cseat-st">${pill}<span class="mute">${p.n}張 ›</span></div></div>`;
  }).join('');

  const cards = pos.map(({ p, cx, cy }) => {
    const isMe = p.id === me, lp = lastById[p.id];
    let inner = '';
    if (isMe && selNum != null && g.myPick == null) {
      inner = `${ccard(selNum, { tag: 'div', cls: 'pre', label: `預覽蓋牌 ${selNum}` })}<span class="cbadge hot">預覽</span>`;
    } else if (lp && g.last.round === g.round) {
      const side = lp.sign < 0;
      const cls = `${side ? 'side' : 'pos'} ${fresh ? 'flip' : ''}`;
      const badge = `<span class="cbadge ${side ? 'neg' : 'pos'}">${lp.why === 'matched' ? '⚡ ' : ''}${side ? `−${lp.n}` : `+${lp.n}`}</span>`;
      const tag = lp.isLeader ? `<span class="ctag">${lp.why === 'leaderMatched' ? '👑 撞號' : '👑 上手首領'}</span>` : '';
      inner = `${ccard(lp.n, { tag: 'div', cls, label: `${p.name} 上手出 ${lp.n}（${side ? '橫置扣分' : '正放加分'}）` })}${tag}${badge}`;
    } else if (p.ready) {
      inner = `<div class="ccard back" aria-label="${esc(p.name)} 已蓋牌"><b>🐾</b><span>已蓋牌</span></div>${isMe && g.myPick != null ? `<span class="cbadge hot">你蓋 ${g.myPick}</span>` : ''}`;
    } else {
      inner = `<div class="cempty ${isMe && g.status === 'play' ? 'need' : ''}" aria-hidden="true">🐾</div>`;
    }
    return `<div class="ccwrap" style="left:${cx.toFixed(2)}%;top:${cy.toFixed(2)}%">${inner}</div>`;
  }).join('');

  const lastLog = g.log.at(-1) || '準備開始覓食！';
  const ticker = `<button class="fticker" data-a="sheet" aria-label="查看玩法與動態"><span>${esc(lastLog)}</span><i aria-hidden="true">›</i></button>`;
  const table = `<div class="cstage"><div class="ctable" role="region" aria-label="貓貓食堂圓桌，首領依順時針輪流">
    <div class="cfelt"></div>${svg}
    <div class="chub" aria-label="已蓋牌 ${readyCount}/${active.length} 人">${g.status === 'play' ? `<div class="chub-ptr" style="--ang:${ldrDeg.toFixed(1)}deg" aria-hidden="true"></div>` : ''}<b>${readyCount}/${active.length}</b><small>已蓋牌</small></div>
    ${cards}${seats}</div></div>`;

  const roleText = g.myPick != null
    ? `✅ 已蓋牌 ${g.myPick} ${CAT_SPOTS[g.myPick].icon}${CAT_SPOTS[g.myPick].name} · 等 ${waitCount} 人`
    : isLeaderMe ? '👑 你是本手首領！選一張不想被撞號的牌'
    : `🐾 首領：${esc(name(g.leader))} · 別比老大吃更好！`;
  const selSpot = selNum != null ? CAT_SPOTS[selNum] : null;
  const pickWhy = g.myPick != null ? '' : selNum != null ? '' : '先點一張要蓋下的覓食地點卡';
  const ctaBtn = g.myPick != null
    ? `<button class="ghost" data-a="cunpick">收回重選（已蓋 ${g.myPick} ${CAT_SPOTS[g.myPick].name}）</button>`
    : `<span class="w" data-why="${esc(pickWhy)}"><button data-a="cpick" ${pickWhy ? 'disabled' : ''}>${selSpot ? `🐾 蓋牌：${selNum} ${selSpot.icon} ${selSpot.name}` : '選擇一張覓食卡蓋牌'}</button></span>`;

  const tray = g.status !== 'play' ? catsOverlay(g, s, seatIdx) : `<div class="tray"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b class="${isLeaderMe && g.myPick == null ? 'crown' : ''}" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${roleText}</b><b class="cd" aria-live="off"></b></div>
    <div class="hand c ${g.myPick != null ? 'locked' : ''}">${g.hand.map((n) => ccard(n, { cls: `${sel.has(n) ? 'sel' : ''} ${g.myPick === n ? 'picked' : ''}`, attrs: `data-a="ccard" data-v="${n}" aria-pressed="${sel.has(n) || g.myPick === n}"` })).join('')}</div>
    <div class="row act">${ctaBtn}</div></div>`;

  const sortedRank = g.players.filter((p) => !p.left).sort((a, b) => b.tokens - a.tokens || b.roundScore - a.roundScore);
  const sheetUI = sheet && g.status === 'play' ? `<div class="overlay sheet"><div class="bd" data-a="sheet"></div><div class="modal" role="dialog" aria-label="計分板、玩法與動態">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">🐱 食堂戰況（第 ${g.round}/${g.rounds} 輪）</h2><button class="ghost ic" data-a="sheet" aria-label="關閉">✕</button></div>
    <table style="margin-top:8px"><tr><th>玩家</th><th>本輪淨分</th><th>得分標記</th></tr>
      ${sortedRank.map((p) => `<tr class="${p.id === me ? 'me' : ''}"><td>${esc(p.name)}${p.id === g.leader ? ' 👑' : ''}</td><td>${signNum(p.roundScore)}</td><td>🏅 ${p.tokens}</td></tr>`).join('')}</table>
    <h2 style="margin-top:16px">完整玩法</h2>${catsRules()}
    <h2 style="margin-top:16px">最近動態</h2><div class="log">${g.log.map(esc).join('<br>')}</div>
    <button class="ghost" data-a="leave" style="width:100%;margin-top:16px">離開房間</button></div></div>` : '';

  const hp = g.players.find((p) => p.id === histFor);
  const histUI = hp ? (() => {
    const posCards = hp.played.filter((x) => x.sign > 0), negCards = hp.played.filter((x) => x.sign < 0);
    const posSum = posCards.reduce((a, x) => a + x.n, 0), negSum = negCards.reduce((a, x) => a + x.n, 0);
    const used = new Set(hp.played.map((x) => x.n));
    const rem = Array.from({ length: 12 }, (_, i) => i + 1).filter((n) => !used.has(n));
    return `<div class="overlay sheet"><div class="bd" data-a="hist"></div><div class="modal" role="dialog" aria-label="${esc(hp.name)} 本輪出牌紀錄">
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="row" style="flex-wrap:nowrap">${catAv(seatIdx[hp.id], hp.id === g.leader, true)}<div><h2 style="margin:0;color:var(--ink)">${esc(hp.name)}${hp.id === me ? '（你）' : ''}</h2><small class="mute">本輪淨分 ${signNum(hp.roundScore)} · 得分標記 🏅 ${hp.tokens}</small></div></div><button class="ghost ic" data-a="hist" aria-label="關閉">✕</button></div>
      <div style="margin-top:16px"><b>正放加分（+${posSum}）</b><div class="cmini-row">${posCards.length ? posCards.map((x) => `<span class="cmini pos" title="第 ${x.trick} 手">${x.n}${CAT_SPOTS[x.n].icon}</span>`).join('') : '<span class="mute">尚無</span>'}</div></div>
      <div style="margin-top:14px"><b>橫置扣分（−${negSum}）</b><div class="cmini-row">${negCards.length ? negCards.map((x) => `<span class="cmini neg" title="第 ${x.trick} 手">−${x.n}${CAT_SPOTS[x.n].icon}</span>`).join('') : '<span class="mute">尚無，很會躲！</span>'}</div></div>
      ${hp.in ? `<div style="margin-top:14px"><b>尚未出過（${rem.length} 張）</b><div class="cmini-row">${rem.map((n) => `<span class="cmini rem">${n}</span>`).join('')}</div></div>` : ''}
    </div></div>`;
  })() : '';

  return `<div class="row" style="flex-wrap:nowrap"><b style="flex:1;min-width:0">🐱 貓貓食堂 · ${s.code}</b>
    <span class="fmeta">輪 ${g.round}/${g.rounds} · 手 ${g.trick}/12</span>
    <span class="rxw"><button class="ghost ic" data-a="rxMenu" aria-label="送表情" aria-expanded="${rxOpen}">😀</button>${rxOpen ? `<div class="rxp">${EMOJI.map((e) => `<button data-a="react" data-v="${e}" aria-label="${e}">${e}</button>`).join('')}</div>` : ''}</span>
    <button class="ghost ic" data-a="sheet" aria-label="戰況、玩法、離開">📋</button></div>
  ${ticker}${table}${tray}${sheetUI}${histUI}`;
}

function catsOverlay(g, s, seatIdx) {
  const sm = g.summary, over = g.status === 'over', me = s.me, host = me === s.host;
  const nm = (id) => esc(g.players.find((p) => p.id === id)?.name ?? '?');
  const tokBadge = (d) => `<span class="ctok ${d === 2 ? 'p2' : d === 1 ? 'p1' : d === -1 ? 'm1' : 'z0'}">${d > 0 ? `+${d}` : d < 0 ? `−${Math.abs(d)}` : '±0'} 標記</span>`;
  const head = over
    ? (g.winners.includes(me) ? '<span class="trophy">👑</span> 你獲得「喵喵之王」稱號！' : `👑 ${g.winners.map(nm).join('、')} 成為喵喵之王！`)
    : `🍽️ 第 ${sm.round}/${g.rounds} 輪食堂結算`;

  const rows = sm.rows.map((r) => {
    const pos = r.played.filter((x) => x.sign > 0), neg = r.played.filter((x) => x.sign < 0);
    return `<div class="res ${r.id === me ? 'me' : ''}">
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap">
        <div class="row" style="flex-wrap:nowrap;min-width:0">${catAv(seatIdx[r.id], false)}<b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}${r.id === me ? '（你）' : ''}</b></div>
        <div class="row" style="flex-wrap:nowrap"><b>${signNum(r.roundScore)} 分</b>${tokBadge(r.delta)}</div>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:6px;font-size:var(--s1)"><span class="mute">正放 +${pos.reduce((a, x) => a + x.n, 0)} · 橫置 −${neg.reduce((a, x) => a + x.n, 0)}</span><span>累計 <b>🏅 ${r.tokens}</b></span></div>
      <div class="cmini-row" style="gap:4px">${r.played.map((x) => `<span class="cmini ${x.sign > 0 ? 'pos' : 'neg'}" style="min-width:26px;height:28px;font-size:11px">${x.sign > 0 ? x.n : `−${x.n}`}</span>`).join('')}</div>
    </div>`;
  }).join('');

  const cmp = (a, b) => b.tokens - a.tokens || b.totalScore - a.totalScore;
  const sorted = over ? g.players.filter((p) => !p.left).sort(cmp) : [];
  const board = sorted.map((p) => {
    const r = sorted.findIndex((q) => q.tokens === p.tokens);
    const hist = p.roundDeltas.map((d) => `R${d.round} ${d.delta > 0 ? '+' : d.delta < 0 ? '−' : '±'}${Math.abs(d.delta)}`).join(' · ');
    return `<div class="res rk ${p.id === me ? 'me' : ''}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap">
      <div class="row" style="flex-wrap:nowrap"><span style="display:inline-block;min-width:1.6em">${['👑', '🥈', '🥉'][r] ?? r + 1}</span>${catAv(seatIdx[p.id], g.winners.includes(p.id), true)}<div><b>${esc(p.name)}${p.id === me ? '（你）' : ''}</b><div style="font-size:var(--s1);font-weight:400;opacity:.82">${hist}（總淨分 ${signNum(p.totalScore)}）</div></div></div>
      <b>🏅 ${p.tokens}</b></div></div>`;
  }).join('');

  const foot = over
    ? (host ? '<button data-a="back">回到房間再來一局</button><button class="ghost" data-a="leave">離開房間</button>' : `<span class="mute">等 ${nm(s.host)} 開新局…</span><button class="ghost" data-a="leave">離開房間</button>`)
    : `<button data-a="next">開始第 ${sm.round + 1} 輪</button>`;

  return `<div class="overlay"><div class="modal res-m"><div class="body">
    <div class="hd">${head}</div>${over ? '<div class="mute" style="margin-bottom:8px">🍣 享受貓貓食堂的豪華美食吧！</div>' : ''}
    ${over ? board : rows}${sm.note ? `<p class="mute">${esc(sm.note)}</p>` : ''}</div>
    <div class="row act foot">${foot}</div></div></div>`;
}

function render() {
  const form = [...document.querySelectorAll('#name,#code,#target,#rounds,#turn,[data-r]')].map((e) => [e, e.type === 'checkbox' ? e.checked : e.value]); // 建房表單：重繪不能洗掉使用者已填／已勾的
  const keep = Object.fromEntries(form.map(([e, v]) => [e.id || e.dataset.r, v]));
  if (!snap?.game) seen = null; // 離開／重開一場遊戲後不要沿用舊手牌
  document.body.classList.toggle('cats-mode', !!(snap?.game && snap.kind === 'cats'));
  $('#app').innerHTML = !sess ? lobby() : !snap ? '<p>連線中…</p>' : snap.game ? (snap.kind === 'fuji' ? fuji() : snap.kind === 'cats' ? cats() : game()) : room();
  for (const e of document.querySelectorAll('#name,#code,#target,#rounds,#turn,[data-r]')) { const v = keep[e.id || e.dataset.r]; if (v !== undefined) e.type === 'checkbox' ? (e.checked = v) : (e.value = v); }
  const all = [...document.querySelectorAll('[data-r]')]; if (all.length && all.every((b) => b.checked)) { const b = $('[data-a="allRules"]'); if (b) b.textContent = '全不選'; }
  tick();
}
// 倒數只改文字，不重繪 DOM；最後 10 秒變紅
function tick() {
  const el = $('.cd'); if (!el) return;
  const s = dl == null ? null : Math.max(0, Math.ceil((dl - Date.now()) / 1000));
  el.textContent = s == null ? '' : `⏱ ${s}`;
  el.style.color = s != null && s <= 10 ? '#ff8a80' : '';
  // 最後 5 秒：每秒換數字時重播晃動動畫；輪到我才震動（別人的倒數只有畫面提示，免得一直被打擾）
  const warn = s > 0 && s <= 5;
  if (warn && s !== tick.s) { el.classList.remove('warn'); void el.offsetWidth; if (snap?.game?.turn === snap.me) navigator.vibrate?.(80); }
  el.classList.toggle('warn', warn);
  tick.s = s;
}
setInterval(tick, 250);

const A = {
  async create() {
    const body = { kind: pick, name: $('#name').value, turn: +$('#turn').value };
    if (pick === 'phase10') Object.assign(body, { target: +$('#target').value, rules: Object.fromEntries(RULES.map(([k]) => [k, !!$(`[data-r="${k}"]`)?.checked])) });
    if (pick === 'cats') body.rounds = +$('#rounds').value;
    const r = await post('create', body).catch((e) => toast(e.message)); if (r) { localStorage.setItem('p10name', $('#name').value); enter(r); }
  },
  fold(v) { folds.has(v) ? folds.delete(v) : folds.add(v); render(); },
  pick(v) { pick = v; try { localStorage.setItem('p10pick', v); } catch {} render(); },
  async join() { const r = await post('join', { name: $('#name').value, code: $('#code').value }).catch((e) => toast(e.message)); if (r) { localStorage.setItem('p10name', $('#name').value); enter(r); } },
  home() { history.replaceState(null, '', '/'); location.reload(); },
  allRules(v, btn) { // 一次勾選：現在全勾了就全部取消，否則全部勾起來
    const boxes = [...document.querySelectorAll('[data-r]')], on = !boxes.every((b) => b.checked);
    boxes.forEach((b) => (b.checked = on)); btn.textContent = on ? '全不選' : '全選'; btn.setAttribute('aria-pressed', on);
  },
  async copy() {
    const l = inviteLink(snap.code, snap.kind), gn = GAMES[snap.kind].name;
    // 手機優先叫出系統分享面板（LINE／訊息一步到位）；使用者按取消不算失敗
    if (navigator.share) { try { return await navigator.share({ title: gn, text: `來玩 ${gn}！`, url: l }); } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(l); toast('已複製邀請連結'); } catch { prompt('複製這個連結傳給朋友：', l); }
  },
  start: () => call('start'),
  shuffle: () => call('shuffle'),
  async leave() {
    // 遊戲中途退出是真的退出：牌放回棄牌堆、不能再回來；剩 2 人時你一走房間就關閉，所以先確認
    if (snap?.game && snap.game.status !== 'over') {
      const last2 = snap.game.players.filter((p) => p.in).length <= 2;
      if (!confirm(last2 ? '現在只剩兩人，你離開後房間會關閉，大家都會回到首頁。確定要離開？' : '離開後無法再回到這局，你的牌會放回棄牌堆。確定要離開？')) return;
    }
    await call('leave'); exit();
  },
  back: () => call('back'),
  next: () => call('act', { action: { type: 'next' } }),
  draw: (v) => call('act', { action: { type: 'draw', from: v } }),
  fcard(v) { sel = new Set(sel.has(+v) ? [] : [+v]); render(); }, // 富士流一次只能選一張
  fplay: () => call('act', { action: { type: 'play', card: [...sel][0] } }).then((r) => r && sel.clear()),
  ccard(v) { if (snap?.game?.myPick != null) return toast('已蓋牌，點下方「收回重選」即可換牌'); sel = new Set(sel.has(+v) ? [] : [+v]); render(); }, // 貓貓食堂一次選一張蓋牌
  cpick: () => call('act', { action: { type: 'pick', card: [...sel][0] } }).then((r) => r && sel.clear()),
  cunpick: () => call('act', { action: { type: 'unpick' } }),
  fseat(v) {
    const p = snap?.game?.players?.find((x) => x.id === v);
    if (!p) return;
    const tag = p.left ? '已離開' : `剩 ${p.n} 張${p.card ? ` · 場上 ${p.card.n}${p.sum > p.card.n ? `（同盟合計 ${p.sum}）` : ''}` : ' · 尚未出牌'}`;
    toast(`${p.name}${p.id === snap.me ? '（你）' : ''}：${tag}`);
  },
  card(v) {
    endFor = null;
    if (actSlot === null) sel.has(+v) ? sel.delete(+v) : sel.add(+v);
    else { // 有作用中的組：點牌就直接放入；這組滿了自動換到下一個還沒滿的組
      const req = phaseReq(), cnt = (gi) => Object.values(slots).filter((x) => x === gi).length, full = (gi) => cnt(gi) >= req[gi][1];
      slots[v] = actSlot;
      // 剛好放滿才自動跳下一組；放滿之後繼續點牌就是多放（接牌），要再點該組才會回來
      if (cnt(actSlot) === req[actSlot][1]) actSlot = req.findIndex((_, gi) => !full(gi)) < 0 ? null : req.findIndex((_, gi) => !full(gi));
    }
    render();
  },
  slot(v) { // 有先選好的牌 → 整批放入（舊流程仍可用）；否則切換作用中的組
    if (sel.size) { sel.forEach((id) => (slots[id] = +v)); sel.clear(); actSlot = null; } else actSlot = actSlot === +v ? null : +v;
    render();
  },
  unslot(v) { delete slots[v]; render(); },
  lo(v) { const [gi, l] = v.split(':').map(Number); los[gi] = l; render(); },
  sheet() { sheet = !sheet; render(); },
  hist(v) { histFor = v || null; render(); }, // 玩家卡帶 id → 開；遮罩／✕ 沒有 → 關
  rxMenu() { rxOpen = !rxOpen; render(); },
  react(v) { rxOpen = false; render(); call('react', { e: v }); },
  sort() { byColor = !byColor; render(); },
  async lay() {
    const groups = phaseReq().map((_, gi) => Object.keys(slots).filter((id) => slots[id] === gi).map(Number));
    if (await call('act', { action: { type: 'lay', groups, los: groups.map((_, gi) => curLo(gi)) } })) { slots = {}; los = {}; actSlot = null; }
  },
  hit(v, el) {
    const gr = snap.game.groups[+v], end = el.dataset.end;
    // 順子 + 選到百搭 + 還沒指定方向 → 先問接前/接後（純數字牌伺服器會自己判斷）
    if (gr.type === 'run' && !end && snap.game.hand.some((c) => sel.has(c.id) && c.t === 'w')) { endFor = +v; return render(); }
    return call('act', { action: { type: 'hit', group: +v, cards: [...sel], end } }).then((r) => { endFor = null; r ? sel.clear() : render(); });
  },
  discard: (v) => call('act', { action: { type: 'discard', card: [...sel][0], target: v } }).then((r) => r && sel.clear()),
  xt(v) { xs.target = v; render(); },
  xg(v) { xs.give = xs.give === +v ? null : +v; render(); },
  xcancel() { sel.clear(); xs = { target: null, v: null, give: null }; render(); },
  plain() { return call('act', { action: { type: 'discard', card: [...sel][0], plain: true } }).then((r) => { if (r) { sel.clear(); xs = { target: null, v: null, give: null }; } }); },
  xv(v) { xs.v = /\d/.test(v) ? +v : v; render(); },
  swap() {
    const kind = snap.game.hand.find((c) => c.id === [...sel][0]).t;
    return call('act', { action: { type: 'discard', card: [...sel][0], target: xs.target, give: xs.give, [kind === 'xn' ? 'num' : 'color']: xs.v } }).then((r) => { if (r) { sel.clear(); xs = { target: null, v: null, give: null }; } });
  },
};
$('#skipBan').addEventListener('click', (e) => { const v = e.target.dataset.v; if (v) { $('#skipBan').classList.remove('on'); call('react', { e: v }); } }); // 被跳過時橫幅上的快捷表情
// 拖曳百搭：放開時越過最前／最後一張數字牌的中心 → 整段順子平移一格（等於 los 加減一），所以伺服器不用改
$('#app').addEventListener('pointerdown', (e) => {
  noClick = false;
  const el = e.target.closest('[data-drag]');
  if (!el || e.button) return;
  drag = { el, x: e.clientX, moved: false };
  el.setPointerCapture(e.pointerId);
});
$('#app').addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 6) drag.moved = true;
  if (drag.moved) { drag.el.classList.add('dragging'); drag.el.style.transform = `translateX(${dx}px)`; }
});
const endDrag = (e) => {
  const d = drag; drag = null;
  if (!d) return;
  if (!d.moved) return e.type === 'pointercancel' ? render() : 0; // 沒拖動就是一般點擊（拿回手上），交給 click；補畫拖曳期間被略過的快照
  noClick = true;
  const [gi, side] = d.el.dataset.drag.split(':'), lay = runLayout(+gi);
  if (lay && e.type === 'pointerup') {
    const kinds = lay.map((x) => x.c.t), cells = [...d.el.parentElement.children];
    const mid = (k) => { const r = cells[k].getBoundingClientRect(); return r.left + r.width / 2; };
    if (side === 'L' && e.clientX > mid(kinds.lastIndexOf('n'))) los[gi] = curLo(+gi) + 1;
    if (side === 'R' && e.clientX < mid(kinds.indexOf('n'))) los[gi] = curLo(+gi) - 1;
  }
  render();
};
$('#app').addEventListener('pointerup', endDrag);
$('#app').addEventListener('pointercancel', endDrag);
$('#app').addEventListener('click', (e) => {
  if (noClick) { noClick = false; return; }
  if (rxOpen && !e.target.closest('.rxw')) { rxOpen = false; render(); } // 點選單外面 → 收起（點到別的按鈕時仍照常執行）
  const why = e.target.closest('[data-why]')?.dataset.why; // 停用的按鈕 pointer-events:none，點擊落在外層 → 說明為什麼不能按
  if (why) return toast(why);
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled) A[el.dataset.a]?.(el.dataset.v, el);
});
$('#app').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); } }); // div 型按鈕（玩家卡、組合、放階段欄）要自己補鍵盤操作
$('#app').addEventListener('focusout', (e) => { if (e.target.matches?.('select') && snap) render(); }); // 補上選單開著時被略過的重繪
$('#app').addEventListener('change', (e) => {
  if (e.target.dataset.r !== undefined) { // 建房頁的規則勾選：全勾了按鈕顯示「全不選」
    const boxes = [...document.querySelectorAll('[data-r]')], all = boxes.every((b) => b.checked), btn = $('[data-a="allRules"]');
    if (btn) { btn.textContent = all ? '全不選' : '全選'; btn.setAttribute('aria-pressed', all); }
    return;
  }
  const k = e.target.dataset.c;
  if (k) e.target.blur(); // 選完就放開焦點，不然「焦點在 select 時略過重繪」會讓房主一直看不到新加入的玩家
  if (k) call('settings', { [k]: k === 'target' || k === 'rounds' ? +e.target.value : e.target.value });
});
if (sess) connect(); else render();
</script>
